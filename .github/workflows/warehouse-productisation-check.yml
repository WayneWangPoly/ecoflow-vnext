name: Apply final EcoFlow production consolidation

on:
  pull_request:
    branches: [main]

concurrency:
  group: ecoflow-final-consolidation-pr
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout working branch
        uses: actions/checkout@v4
        with:
          ref: agent/production-workflow-consolidation
          fetch-depth: 0
      - name: Assemble and verify exact source patch
        shell: bash
        run: |
          set -euo pipefail
          cat scripts/final-consolidation.patch.part-* > /tmp/final-consolidation.patch
          python - <<'PY'
          from pathlib import Path
          path=Path('/tmp/final-consolidation.patch')
          source=path.read_text()
          extra="+  left join public.v_ecoflow_day_state) days\n"
          if source.count(extra) != 1:
              raise SystemExit(f'expected one known transfer boundary line, found {source.count(extra)}')
          path.write_text(source.replace(extra,''))
          PY
          test "$(wc -c < /tmp/final-consolidation.patch | tr -d ' ')" = "122606"
          echo "fcf84dc1e37ac77cb74ddc8258deeabd6fed287ddc1026b94e3e57f1783d89d7  /tmp/final-consolidation.patch" | sha256sum -c -
      - name: Normalize non-newline CSS deletion and verify application
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          path=Path('/tmp/final-consolidation.patch')
          source=path.read_text()
          start=source.index('--- a/src/driverPodQuality.css\n')
          end=source.index('--- a/src/enhancers/DriverEnhancers.tsx\n',start)
          path.write_text(source[:start]+source[end:])
          PY
          test "$(wc -c < /tmp/final-consolidation.patch | tr -d ' ')" = "119755"
          echo "470a2504c6a8913032bb7e15c0fdbc011186a7e1a7c284d403cd5f6f0d7d2c62  /tmp/final-consolidation.patch" | sha256sum -c -
          git apply --check --verbose /tmp/final-consolidation.patch
      - name: Apply production source changes
        shell: bash
        run: |
          set -euo pipefail
          git apply --whitespace=nowarn /tmp/final-consolidation.patch
          rm -f src/driverPodQuality.css
          rm -f scripts/final-consolidation.patch.part-*
      - name: Commit and push final source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Complete production workflows, multi-run state and secure field operations"
          git fetch origin agent/production-workflow-consolidation
          git rebase origin/agent/production-workflow-consolidation
          git push origin HEAD:agent/production-workflow-consolidation
