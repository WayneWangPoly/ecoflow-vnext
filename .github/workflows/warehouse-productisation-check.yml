name: Warehouse productisation check

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - 'agent/warehouse-productisation'
      - 'agent/warehouse-backend-hardening'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Use Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Audit warehouse invariants
        run: npm run audit:warehouse
      - name: TypeScript check
        shell: bash
        run: |
          set -o pipefail
          node ./node_modules/typescript/bin/tsc -b --pretty false 2>&1 | tee typecheck.log
      - name: Vite bundle
        shell: bash
        run: |
          set -o pipefail
          node ./node_modules/vite/bin/vite.js build 2>&1 | tee vite-build.log
      - name: Upload validation logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: warehouse-validation-logs
          path: |
            typecheck.log
            vite-build.log
          if-no-files-found: warn

  migrations:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: postgres
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - name: Bootstrap Supabase-compatible database roles
        shell: bash
        run: |
          psql -v ON_ERROR_STOP=1 <<'SQL'
          create extension if not exists pgcrypto;
          create schema if not exists auth;
          create schema if not exists extensions;
          do $$ begin create role anon nologin; exception when duplicate_object then null; end $$;
          do $$ begin create role authenticated nologin; exception when duplicate_object then null; end $$;
          do $$ begin create role service_role nologin bypassrls; exception when duplicate_object then null; end $$;
          create table if not exists auth.users (
            id uuid primary key default gen_random_uuid(),
            email text,
            raw_user_meta_data jsonb default '{}'::jsonb,
            created_at timestamptz not null default now(),
            updated_at timestamptz not null default now()
          );
          create or replace function auth.uid() returns uuid language sql stable as $$ select null::uuid $$;
          create or replace function auth.role() returns text language sql stable as $$ select 'authenticated'::text $$;
          create or replace function auth.jwt() returns jsonb language sql stable as $$ select '{}'::jsonb $$;
          SQL
      - name: Replay every migration from an empty database
        shell: bash
        run: |
          set -euo pipefail
          : > migration-replay.log
          while IFS= read -r file; do
            echo "==> $file" | tee -a migration-replay.log
            psql -v ON_ERROR_STOP=1 -f "$file" 2>&1 | tee -a migration-replay.log
          done < <(find supabase/migrations -maxdepth 1 -type f -name '*.sql' | sort)
      - name: Upload migration replay log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: warehouse-migration-replay
          path: migration-replay.log
          if-no-files-found: warn
