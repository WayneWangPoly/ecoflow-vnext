name: Diagnose final EcoFlow consolidation patch

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - agent/production-workflow-consolidation

concurrency:
  group: ecoflow-final-consolidation
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout working branch
        uses: actions/checkout@v4
        with:
          ref: agent/production-workflow-consolidation
          fetch-depth: 0
      - name: Assemble patch and report digest
        shell: bash
        run: |
          set -euo pipefail
          cat scripts/final-consolidation.patch.part-* > assembled-final-consolidation.patch
          wc -c assembled-final-consolidation.patch | tee patch-diagnostic.txt
          sha256sum assembled-final-consolidation.patch | tee -a patch-diagnostic.txt
          git apply --check assembled-final-consolidation.patch 2>&1 | tee -a patch-diagnostic.txt || true
      - name: Upload assembled patch diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: assembled-final-consolidation-patch
          path: |
            assembled-final-consolidation.patch
            patch-diagnostic.txt
          if-no-files-found: error
