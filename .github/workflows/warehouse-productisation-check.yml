name: Warehouse productisation check

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - 'agent/warehouse-productisation'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Use Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Audit warehouse invariants
        run: npm run audit:warehouse
      - name: Build application
        run: npm run build
