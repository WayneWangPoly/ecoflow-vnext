name: Warehouse and delivery productisation check

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - main
      - 'agent/**'

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Use Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Audit operational invariants
        id: operational_audit
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          npm run audit:warehouse 2>&1 | tee operational-audit.log
          node scripts/audit-stocktake-go-live-readiness.mjs 2>&1 | tee -a operational-audit.log
          npm run audit:returns-acl 2>&1 | tee -a operational-audit.log
          npm run audit:analytics 2>&1 | tee -a operational-audit.log
          node scripts/audit-order-fulfilment-facts.mjs 2>&1 | tee -a operational-audit.log
          node scripts/audit-inventory-movement-snapshots.mjs 2>&1 | tee -a operational-audit.log
          node scripts/audit-delivery-route-stop-facts.mjs 2>&1 | tee -a operational-audit.log
      - name: TypeScript check
        shell: bash
        run: |
          set -o pipefail
          node ./node_modules/typescript/bin/tsc -b --pretty false 2>&1 | tee typecheck.log
      - name: Vite bundle
        shell: bash
        run: |
          set -o pipefail
          node ./node_modules/vite/bin/vite.js build 2>&1 | tee vite-build.log
      - name: Enforce operational audit result
        if: steps.operational_audit.outcome == 'failure'
        run: exit 1
      - name: Upload validation logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: operational-validation-logs
          path: |
            operational-audit.log
            typecheck.log
            vite-build.log
          if-no-files-found: warn

  migrations:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: postgres
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - name: Load current operational schema contract
        shell: bash
        run: |
          set -o pipefail
          psql -v ON_ERROR_STOP=1 -f scripts/warehouse-migration-fixture.sql 2>&1 | tee operational-db-contract.log
          psql -v ON_ERROR_STOP=1 -f scripts/driver-departure-migration-fixture.sql 2>&1 | tee -a operational-db-contract.log
          psql -v ON_ERROR_STOP=1 -f scripts/pick-task-claim-migration-fixture.sql 2>&1 | tee -a operational-db-contract.log
          psql -v ON_ERROR_STOP=1 -f scripts/operational-state-migration-fixture.sql 2>&1 | tee -a operational-db-contract.log
          psql -v ON_ERROR_STOP=1 -f scripts/order-fulfilment-migration-fixture.sql 2>&1 | tee -a operational-db-contract.log
      - name: Apply operational migrations in release order
        shell: bash
        run: |
          set -euo pipefail
          for file in \
            supabase/migrations/20260624_remote_production_baseline.sql \
            supabase/migrations/20260710130000_warehouse_backend_hardening.sql \
            supabase/migrations/20260710130100_warehouse_backend_hardening_followup.sql \
            supabase/migrations/20260710130200_warehouse_backend_function_qualification.sql \
            supabase/migrations/20260710130300_barcode_scan_conflict_qualification.sql \
            supabase/migrations/20260710130400_receiving_confirmation_qualification.sql \
            supabase/migrations/20260710130500_layout_conflict_qualification.sql \
            supabase/migrations/20260710_delivery_notifications_returns.sql \
            supabase/migrations/20260710_return_zone_drop_and_inspection.sql \
            supabase/migrations/20260710_return_zone_geofence.sql \
            scripts/legacy-return-four-arg-production-drift-fixture.sql \
            supabase/migrations/20260710140000_owner_driver_location_tracking.sql \
            supabase/migrations/20260710140100_verify_owner_driver_tracking_release.sql \
            supabase/migrations/20260711100000_driver_departure_and_delivery_notifications.sql \
            supabase/migrations/20260711100100_notification_contact_conflict_qualification.sql \
            supabase/migrations/20260711150000_repair_gbk_mojibake_text.sql \
            supabase/migrations/20260711170000_pick_task_ownership.sql \
            supabase/migrations/20260711180000_unknown_barcode_quarantine.sql \
            supabase/migrations/20260711181000_operational_state_auth_hardening.sql \
            supabase/migrations/20260711182000_multi_run_day_state.sql \
            supabase/migrations/20260722194500_stocktake_package_unit_integrity.sql \
            supabase/migrations/20260722194600_verify_stocktake_pick_readiness.sql \
            supabase/migrations/20260725100000_fix_barcode_rpc_ambiguous_sku.sql \
            supabase/migrations/20260727110000_restore_warehouse_write_guards.sql \
            supabase/migrations/20260727120450_restore_return_geofence_prerequisite.sql \
            supabase/migrations/20260727120460_prepare_return_zone_view_for_acl.sql \
            supabase/migrations/20260727120470_recompile_legacy_returns_for_managed_postgres.sql \
            supabase/migrations/20260727120500_legacy_returns_acl_hardening.sql \
            supabase/migrations/20260727120510_legacy_return_geofence_format_repair.sql \
            supabase/migrations/20260727130000_day_state_change_sequence.sql \
            supabase/migrations/20260728221500_analytics_semantic_foundation.sql \
            supabase/migrations/20260729090000_order_fulfilment_facts.sql \
            supabase/migrations/20260729120000_inventory_movement_and_daily_snapshot.sql \
            supabase/migrations/20260729120100_inventory_location_dimension_resolution.sql \
            supabase/migrations/20260729200000_delivery_route_stop_execution_facts.sql
          do
            echo "==> $file" | tee -a operational-db-contract.log
            if [[ "$file" == 'supabase/migrations/20260727120470_recompile_legacy_returns_for_managed_postgres.sql' ]]; then
              psql -v ON_ERROR_STOP=1 -f scripts/legacy-returns-managed-migration-role-fixture.sql 2>&1 | tee -a operational-db-contract.log
              printf 'set role ecoflow_managed_migration;\n\\i %s\nreset role;\n' "$file" \
                | psql -v ON_ERROR_STOP=1 2>&1 \
                | tee -a operational-db-contract.log
              psql -v ON_ERROR_STOP=1 \
                -c 'reassign owned by ecoflow_managed_migration to postgres' \
                2>&1 | tee -a operational-db-contract.log
            else
              psql -v ON_ERROR_STOP=1 -f "$file" 2>&1 | tee -a operational-db-contract.log
            fi
          done
      - name: Execute warehouse transaction contract tests
        shell: bash
        run: |
          set -o pipefail
          psql -v ON_ERROR_STOP=1 -f scripts/warehouse-migration-contract-test.sql 2>&1 | tee -a operational-db-contract.log
      - name: Execute warehouse write guard tests
        shell: bash
        run: |
          set -o pipefail
          psql -v ON_ERROR_STOP=1 -f scripts/warehouse-write-guard-contract-test.sql 2>&1 | tee -a operational-db-contract.log
      - name: Execute legacy returns ACL role tests
        shell: bash
        run: |
          set -o pipefail
          psql -v ON_ERROR_STOP=1 -f scripts/legacy-returns-acl-contract-test.sql 2>&1 | tee -a operational-db-contract.log
      - name: Execute managed PostgreSQL return-function tests
        shell: bash
        run: |
          set -o pipefail
          psql -v ON_ERROR_STOP=1 -f scripts/legacy-returns-managed-postgres-contract-test.sql 2>&1 | tee -a operational-db-contract.log
      - name: Execute analytics semantic foundation tests
        shell: bash
        run: |
          set -o pipefail
          psql -v ON_ERROR_STOP=1 -f scripts/analytics-semantic-foundation-contract-test.sql 2>&1 | tee -a operational-db-contract.log
      - name: Execute order and fulfilment fact tests
        shell: bash
        run: |
          set -o pipefail
          psql -v ON_ERROR_STOP=1 -f scripts/order-fulfilment-facts-contract-test.sql 2>&1 | tee -a operational-db-contract.log
      - name: Execute pick ownership concurrency tests
        shell: bash
        run: |
          set -o pipefail
          psql -v ON_ERROR_STOP=1 -f scripts/pick-task-claim-contract-test.sql 2>&1 | tee -a operational-db-contract.log
      - name: Execute inventory movement and daily snapshot tests
        shell: bash
        run: |
          set -o pipefail
          psql -v ON_ERROR_STOP=1 -f scripts/inventory-movement-snapshot-contract-test.sql 2>&1 | tee -a operational-db-contract.log
      - name: Execute inventory location dimension history tests
        shell: bash
        run: |
          set -o pipefail
          psql -v ON_ERROR_STOP=1 -f scripts/inventory-location-dimension-contract-test.sql 2>&1 | tee -a operational-db-contract.log
      - name: Execute delivery route and stop execution fact tests
        shell: bash
        run: |
          set -o pipefail
          psql -v ON_ERROR_STOP=1 -f scripts/delivery-route-stop-facts-contract-test.sql 2>&1 | tee -a operational-db-contract.log
      - name: Execute unknown barcode quarantine tests
        shell: bash
        run: |
          set -o pipefail
          psql -v ON_ERROR_STOP=1 -f scripts/unknown-barcode-contract-test.sql 2>&1 | tee -a operational-db-contract.log
      - name: Execute operational state auth and multi-run tests
        shell: bash
        run: |
          set -o pipefail
          psql -v ON_ERROR_STOP=1 -f scripts/operational-state-contract-test.sql 2>&1 | tee -a operational-db-contract.log
          psql -v ON_ERROR_STOP=1 -f scripts/day-state-change-sequence-contract.sql 2>&1 | tee -a operational-db-contract.log
      - name: Execute driver tracking privacy and idempotency tests
        shell: bash
        run: |
          set -o pipefail
          psql -v ON_ERROR_STOP=1 -f scripts/driver-location-contract-test.sql 2>&1 | tee -a operational-db-contract.log
      - name: Execute departure declaration and notification tests
        shell: bash
        run: |
          set -o pipefail
          psql -v ON_ERROR_STOP=1 -f scripts/driver-departure-contract-test.sql 2>&1 | tee -a operational-db-contract.log
      - name: Upload operational database contract log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: operational-database-contract
          path: operational-db-contract.log
          if-no-files-found: warn

  temp-driver-scd-patch:
    if: github.head_ref == 'agent/data/INTEL-DATA-004-delivery-route-execution-facts'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out pull request branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Apply Driver SCD patch and self-clean workflows
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          migration_path = Path('supabase/migrations/20260729200000_delivery_route_stop_execution_facts.sql')
          contract_path = Path('scripts/delivery-route-stop-facts-contract-test.sql')
          workflow_path = Path('.github/workflows/warehouse-productisation-check.yml')
          migration = migration_path.read_text()
          contract = contract_path.read_text()
          workflow = workflow_path.read_text()

          driver_pattern = re.compile(
              r"(?ms)^    insert into analytics\.dim_driver\(\n"
              r".*?^      and d\.is_current and d\.display_name is distinct from s\.display_name;\n\n"
              r"(?=^    insert into analytics\.dim_route\()"
          )
          driver_replacement = """    update analytics.dim_driver d
    set display_name=s.display_name,
        source_updated_at=s.source_updated_at,
        updated_at=v_as_of
    from pg_temp.delivery_driver_source s
    where d.source_system='ECOFLOW'
      and d.source_driver_key=s.source_driver_key
      and d.is_current
      and d.display_name is distinct from s.display_name
      and v_as_of<=d.effective_from;

    update analytics.dim_driver d
    set effective_to=v_as_of,
        is_current=false,
        updated_at=v_as_of
    from pg_temp.delivery_driver_source s
    where d.source_system='ECOFLOW'
      and d.source_driver_key=s.source_driver_key
      and d.is_current
      and d.display_name is distinct from s.display_name
      and v_as_of>d.effective_from;

    insert into analytics.dim_driver(
      source_system,source_driver_key,display_name,active,effective_from,is_current,
      source_updated_at,recorded_by
    )
    select 'ECOFLOW',s.source_driver_key,s.display_name,true,v_as_of,true,
      s.source_updated_at,'analytics.refresh_delivery_route_stop_facts'
    from pg_temp.delivery_driver_source s
    where not exists(
      select 1 from analytics.dim_driver d
      where d.source_system='ECOFLOW'
        and d.source_driver_key=s.source_driver_key
        and d.is_current
    );

"""
          migration, count = driver_pattern.subn(driver_replacement, migration)
          if count != 1:
              raise SystemExit(f'Expected one Driver SCD source block, found {count}')

          contract_pattern = re.compile(
              r"\$first_refresh\$;\n\n"
              r"-- A transport-only timestamp update with identical payload must not create history\."
          )
          contract_replacement = """$first_refresh$;

-- Driver labels are SCD attributes. A later display-name change creates a new
-- dimension row without rewriting prior route observations.
update public.app_user_profiles
set display_name='Route Driver One Renamed',
    updated_at='2026-07-29 12:31:00+09:30'
where user_id='81000000-0000-0000-0000-000000000001';

set role service_role;
select * from analytics.refresh_delivery_route_stop_facts(
  '2026-07-29 12:32:00+09:30'
);
reset role;

do $driver_scd$
begin
  if (select count(*) from analytics.dim_driver
      where source_system='ECOFLOW'
        and source_driver_key='81000000-0000-0000-0000-000000000001')<>2 then
    raise exception 'driver display-name change did not create an SCD version';
  end if;
  if not exists(
    select 1 from analytics.dim_driver
    where source_system='ECOFLOW'
      and source_driver_key='81000000-0000-0000-0000-000000000001'
      and display_name='Route Driver One'
      and not is_current
      and effective_to='2026-07-29 12:32:00+09:30'
  ) then
    raise exception 'prior driver dimension was not closed';
  end if;
  if not exists(
    select 1 from analytics.dim_driver
    where source_system='ECOFLOW'
      and source_driver_key='81000000-0000-0000-0000-000000000001'
      and display_name='Route Driver One Renamed'
      and is_current
      and effective_from='2026-07-29 12:32:00+09:30'
  ) then
    raise exception 'current driver dimension was not inserted';
  end if;
  if (select count(*) from analytics.fact_delivery_route_observation
      where source_route_key='2026-07-29:RUN:A')<>1 then
    raise exception 'driver label change created a false route observation version';
  end if;
end;
$driver_scd$;

-- A transport-only timestamp update with identical payload must not create history."""
          contract, count = contract_pattern.subn(contract_replacement, contract)
          if count != 1:
              raise SystemExit(f'Expected one Driver SCD contract insertion point, found {count}')

          marker = '\n  temp-driver-scd-patch:\n'
          if workflow.count(marker) != 1:
              raise SystemExit('Temporary productisation job boundary was not unique')
          workflow = workflow.split(marker,1)[0].rstrip() + '\n'
          workflow = workflow.replace('permissions:\n  contents: write','permissions:\n  contents: read',1)

          migration_path.write_text(migration)
          contract_path.write_text(contract)
          workflow_path.write_text(workflow)
          PY

          rm -f .github/workflows/temp-intel-data-004-driver-scd.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add supabase/migrations/20260729200000_delivery_route_stop_execution_facts.sql scripts/delivery-route-stop-facts-contract-test.sql .github/workflows/warehouse-productisation-check.yml .github/workflows/temp-intel-data-004-driver-scd.yml
          git commit -m 'fix(data): version delivery driver dimensions'
          git push origin HEAD:${{ github.head_ref }}
