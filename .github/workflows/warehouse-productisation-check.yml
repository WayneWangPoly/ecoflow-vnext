name: Warehouse productisation check

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - 'agent/warehouse-productisation'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Use Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Audit warehouse invariants
        run: npm run audit:warehouse
      - name: TypeScript check
        shell: bash
        run: |
          set -o pipefail
          node ./node_modules/typescript/bin/tsc -b --pretty false 2>&1 | tee typecheck.log
      - name: Vite bundle
        shell: bash
        run: |
          set -o pipefail
          node ./node_modules/vite/bin/vite.js build 2>&1 | tee vite-build.log
      - name: Upload validation logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: warehouse-validation-logs
          path: |
            typecheck.log
            vite-build.log
          if-no-files-found: warn
