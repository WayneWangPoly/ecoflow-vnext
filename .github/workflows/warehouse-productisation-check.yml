name: Diagnose verified final EcoFlow consolidation

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - agent/production-workflow-consolidation

concurrency:
  group: ecoflow-final-consolidation
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout working branch
        uses: actions/checkout@v4
        with:
          ref: agent/production-workflow-consolidation
          fetch-depth: 0
      - name: Assemble corrected patch
        shell: bash
        run: |
          set -euo pipefail
          cat scripts/final-consolidation.patch.part-* > corrected-final-consolidation.patch
          python - <<'PY'
          from pathlib import Path
          path=Path('corrected-final-consolidation.patch')
          source=path.read_text()
          extra="+  left join public.v_ecoflow_day_state) days\n"
          count=source.count(extra)
          with open('patch-diagnostic.txt','w') as log:
              log.write(f'known_extra_count={count}\n')
          if count == 1:
              path.write_text(source.replace(extra,''))
          PY
          wc -c corrected-final-consolidation.patch | tee -a patch-diagnostic.txt
          sha256sum corrected-final-consolidation.patch | tee -a patch-diagnostic.txt
          echo '--- git apply check ---' | tee -a patch-diagnostic.txt
          git apply --check --verbose corrected-final-consolidation.patch 2>&1 | tee -a patch-diagnostic.txt || true
      - name: Upload corrected patch diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: corrected-final-consolidation-diagnostic
          path: |
            corrected-final-consolidation.patch
            patch-diagnostic.txt
          if-no-files-found: error
