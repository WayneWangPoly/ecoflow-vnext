name: Warehouse productisation check

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - 'agent/warehouse-productisation'
      - 'agent/warehouse-backend-hardening'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Use Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Audit warehouse invariants
        run: npm run audit:warehouse
      - name: TypeScript check
        shell: bash
        run: |
          set -o pipefail
          node ./node_modules/typescript/bin/tsc -b --pretty false 2>&1 | tee typecheck.log
      - name: Vite bundle
        shell: bash
        run: |
          set -o pipefail
          node ./node_modules/vite/bin/vite.js build 2>&1 | tee vite-build.log
      - name: Upload validation logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: warehouse-validation-logs
          path: |
            typecheck.log
            vite-build.log
          if-no-files-found: warn

  migrations:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: postgres
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - name: Load current warehouse schema contract
        shell: bash
        run: |
          set -o pipefail
          psql -v ON_ERROR_STOP=1 -f scripts/warehouse-migration-fixture.sql 2>&1 | tee warehouse-db-contract.log
      - name: Apply warehouse hardening migrations in release order
        shell: bash
        run: |
          set -euo pipefail
          for file in \
            supabase/migrations/20260710130000_warehouse_backend_hardening.sql \
            supabase/migrations/20260710130100_warehouse_backend_hardening_followup.sql \
            supabase/migrations/20260710130200_warehouse_backend_function_qualification.sql \
            supabase/migrations/20260710130300_barcode_scan_conflict_qualification.sql \
            supabase/migrations/20260710130400_receiving_confirmation_qualification.sql
          do
            echo "==> $file" | tee -a warehouse-db-contract.log
            psql -v ON_ERROR_STOP=1 -f "$file" 2>&1 | tee -a warehouse-db-contract.log
          done
      - name: Execute warehouse transaction contract tests
        shell: bash
        run: |
          set -o pipefail
          psql -v ON_ERROR_STOP=1 -f scripts/warehouse-migration-contract-test.sql 2>&1 | tee -a warehouse-db-contract.log
      - name: Upload warehouse database contract log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: warehouse-database-contract
          path: warehouse-db-contract.log
          if-no-files-found: warn
