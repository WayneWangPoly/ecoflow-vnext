name: Native operational routes

on:
  pull_request:
    branches: [main]
    paths:
      - 'src/main.tsx'
      - 'src/features/operationalRoutes/**'
      - 'src/features/navigation/**'
      - 'src/features/products/**'
      - 'src/features/suppliers/**'
      - 'src/features/purchases/**'
      - 'src/features/operationalRecords/**'
      - 'src/features/dashboard/ControlRoomReadParityPanel.tsx'
      - 'src/features/dashboard/controlRoomReadParityPanel.css'
      - 'src/features/officeParity/**'
      - 'src/data/repositories/productMaster.ts'
      - 'src/data/repositories/productMasterIdentity.ts'
      - 'src/data/repositories/supplierMaster.ts'
      - 'src/data/repositories/purchaseOperations.ts'
      - 'src/data/repositories/purchaseOperationsContract.ts'
      - 'src/data/repositories/operationalRecords.ts'
      - 'src/features/stores/**'
      - 'src/features/inventory/**'
      - 'src/features/ordermentum/**'
      - 'src/features/warehouse/WarehouseMapRoute.tsx'
      - 'src/features/warehouse/WarehouseMapPage.tsx'
      - 'scripts/audit-native-operational-routes.mjs'
      - 'scripts/native-operational-route-contract.test.mjs'
      - 'scripts/intel-frontend-navigation-contract.test.mjs'
      - 'scripts/intel-desktop-route-adapter-contract.test.mjs'
      - 'scripts/unleashed-340a-audit-regression.test.mjs'
      - 'docs/PHASE-9C-NATIVE-OPERATIONAL-ROUTES.md'
      - '.github/workflows/native-operational-routes-check.yml'
  push:
    branches:
      - main
      - 'agent/phase9c/**'
      - 'agent/unleashed/**'
    paths:
      - 'src/main.tsx'
      - 'src/features/operationalRoutes/**'
      - 'src/features/navigation/**'
      - 'src/features/products/**'
      - 'src/features/suppliers/**'
      - 'src/features/purchases/**'
      - 'src/features/operationalRecords/**'
      - 'src/features/dashboard/ControlRoomReadParityPanel.tsx'
      - 'src/features/dashboard/controlRoomReadParityPanel.css'
      - 'src/features/officeParity/**'
      - 'src/data/repositories/productMaster.ts'
      - 'src/data/repositories/productMasterIdentity.ts'
      - 'src/data/repositories/supplierMaster.ts'
      - 'src/data/repositories/purchaseOperations.ts'
      - 'src/data/repositories/purchaseOperationsContract.ts'
      - 'src/data/repositories/operationalRecords.ts'
      - 'src/features/stores/**'
      - 'src/features/inventory/**'
      - 'src/features/ordermentum/**'
      - 'src/features/warehouse/WarehouseMapRoute.tsx'
      - 'src/features/warehouse/WarehouseMapPage.tsx'
      - 'scripts/audit-native-operational-routes.mjs'
      - 'scripts/native-operational-route-contract.test.mjs'
      - 'scripts/intel-frontend-navigation-contract.test.mjs'
      - 'scripts/intel-desktop-route-adapter-contract.test.mjs'
      - 'scripts/unleashed-340a-audit-regression.test.mjs'
      - 'docs/PHASE-9C-NATIVE-OPERATIONAL-ROUTES.md'
      - '.github/workflows/native-operational-routes-check.yml'

permissions:
  contents: read

concurrency:
  group: native-operational-routes-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native-routes:
    name: Native workspace ownership
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Audit native route ownership
        run: node scripts/audit-native-operational-routes.mjs
      - name: Test route, parity and pagination contracts
        run: node --experimental-strip-types --test scripts/native-operational-route-contract.test.mjs scripts/intel-frontend-navigation-contract.test.mjs scripts/intel-desktop-route-adapter-contract.test.mjs scripts/unleashed-340a-audit-regression.test.mjs
      - name: TypeScript
        run: npm run typecheck
      - name: Vite production build
        run: npm run build
