name: Materialize INTEL-UI-003B

on:
  push:
    branches:
      - agent/frontend/INTEL-UI-003B-actionable-exception-surface

permissions:
  contents: write

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/frontend/INTEL-UI-003B-actionable-exception-surface
          fetch-depth: 0
      - name: Apply exact Dashboard integration
        shell: python
        run: |
          from pathlib import Path

          path = Path('src/features/dashboard/DashboardPage.tsx')
          source = path.read_text()

          import_anchor = "import { useOverlayManager } from '@/features/intelligence/overlays';\n"
          import_replacement = import_anchor + "import { ActionableExceptionQueue } from '@/features/intelligence/attention';\n"
          if source.count(import_anchor) != 1:
              raise SystemExit('INTEL_UI_003B_IMPORT_ANCHOR_COUNT_INVALID')
          if "ActionableExceptionQueue" not in source:
              source = source.replace(import_anchor, import_replacement, 1)

          surface_anchor = "      </section>\n\n      <section className=\"ops-control-grid\">\n"
          surface_replacement = "      </section>\n\n      <ActionableExceptionQueue onOpenOrders={() => onOpenTab('orders')} />\n\n      <section className=\"ops-control-grid\">\n"
          if source.count(surface_anchor) != 1:
              raise SystemExit('INTEL_UI_003B_SURFACE_ANCHOR_COUNT_INVALID')
          if '<ActionableExceptionQueue ' not in source:
              source = source.replace(surface_anchor, surface_replacement, 1)

          old_title = '          title="Needs attention"\n'
          new_title = '          title="Operational queues"\n'
          if source.count(old_title) != 1:
              raise SystemExit('INTEL_UI_003B_QUEUE_TITLE_ANCHOR_COUNT_INVALID')
          source = source.replace(old_title, new_title, 1)

          path.write_text(source)
      - name: Remove materializer and commit
        shell: bash
        run: |
          rm .github/workflows/materialize-intel-ui-003b.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/features/dashboard/DashboardPage.tsx .github/workflows/materialize-intel-ui-003b.yml
          git commit -m "Adopt read-only actionable exception surface"
          git push origin HEAD:agent/frontend/INTEL-UI-003B-actionable-exception-surface
