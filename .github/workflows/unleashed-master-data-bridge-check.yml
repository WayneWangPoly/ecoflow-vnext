name: Unleashed master-data bridge contract

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/unleashed-master-data-bridge-check.yml'
      - '.github/workflows/deploy-supabase-migrations.yml'
      - 'docs/engineering/work-packages/UNLEASHED-MIGRATION-003-canonical-master-data-assets.md'
      - 'scripts/unleashed-master-data-bridge-contract.test.mjs'
      - 'scripts/unleashed-master-data-bridge-db-contract-test.sql'
      - 'scripts/unleashed-master-data-bridge-review-fixes-db-contract-test.sql'
      - 'scripts/audit-unleashed-master-data-bridge.mjs'
      - 'supabase/functions/trigger-unleashed-master-migration/**'
      - 'supabase/migrations/20260831235500_unleashed_master_data_bridge.sql'
      - 'package.json'
  push:
    branches:
      - 'agent/platform/unleashed-migration-003-*'
    paths:
      - '.github/workflows/unleashed-master-data-bridge-check.yml'
      - '.github/workflows/deploy-supabase-migrations.yml'
      - 'docs/engineering/work-packages/UNLEASHED-MIGRATION-003-canonical-master-data-assets.md'
      - 'scripts/unleashed-master-data-bridge-contract.test.mjs'
      - 'scripts/unleashed-master-data-bridge-db-contract-test.sql'
      - 'scripts/unleashed-master-data-bridge-review-fixes-db-contract-test.sql'
      - 'scripts/audit-unleashed-master-data-bridge.mjs'
      - 'supabase/functions/trigger-unleashed-master-migration/**'
      - 'supabase/migrations/20260831235500_unleashed_master_data_bridge.sql'
      - 'package.json'

permissions:
  contents: write

jobs:
  contract:
    name: Governed identity and asset bridge
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: postgres
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/platform/unleashed-migration-003-master-data-bridge
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Prepare exact DB contract patch marker
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('scripts/unleashed-master-data-bridge-db-contract-test.sql')
          text = p.read_text()
          sentinel = "\nselect 'UNLEASHED_MASTER_DATA_BRIDGE_DB_CONTRACT_PASS' as result;"
          if text.count(sentinel) != 1:
              raise SystemExit(f'expected one DB PASS sentinel, found {text.count(sentinel)}')
          p.write_text(text.replace(sentinel, "\nrollback;\n", 1))
          PY
      - name: Apply database-owned COPY lease serialization
        run: python3 scripts/chat-lease-serialization-fix.py
      - name: Align static contract with database-owned lease boundary
        run: python3 scripts/chat-lease-static-alignment.py
      - name: Align bounded authority audit with database-owned lease boundary
        run: python3 scripts/chat-lease-audit-alignment.py
      - name: Restore DB contract PASS sentinel
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('scripts/unleashed-master-data-bridge-db-contract-test.sql')
          text = p.read_text()
          marker = "\nrollback;\n"
          if text.count(marker) != 1:
              raise SystemExit(f'expected one temporary rollback marker, found {text.count(marker)}')
          text = text.replace(marker, "\nselect 'UNLEASHED_MASTER_DATA_BRIDGE_DB_CONTRACT_PASS' as result;", 1)
          p.write_text(text.rstrip() + "\n")
          PY
      - name: Remove all Chat staging and restore governed workflow before tests
        run: |
          git rm -f scripts/chat-lease-serialization-fix.py
          git rm -f scripts/chat-lease-static-alignment.py
          git rm -f scripts/chat-lease-audit-alignment.py
          git rm -f .github/workflows/chat-lease-serialization-fix.yml
          git rm -f .github/workflows/chat-lease-serialization-fix-v2.yml
          git checkout 15ffd9cf79f2f6fdaf52c36202cc32a22bb79ba2 -- .github/workflows/unleashed-master-data-bridge-check.yml
          test "$(grep -c '^  contents: read$' .github/workflows/unleashed-master-data-bridge-check.yml)" -eq 1
      - run: npm ci
      - name: Run static and helper contracts
        run: node --experimental-strip-types --test scripts/unleashed-master-data-bridge-contract.test.mjs
      - name: Run migration, RLS, idempotency and lease contracts
        run: psql -v ON_ERROR_STOP=1 -f scripts/unleashed-master-data-bridge-db-contract-test.sql
      - name: Run independent-review regression contract
        run: psql -v ON_ERROR_STOP=1 -f scripts/unleashed-master-data-bridge-review-fixes-db-contract-test.sql
      - name: Run bounded authority audit
        run: node scripts/audit-unleashed-master-data-bridge.mjs
      - name: Verify final diff hygiene
        run: |
          git diff --check
          test ! -e scripts/chat-lease-serialization-fix.py
          test ! -e scripts/chat-lease-static-alignment.py
          test ! -e scripts/chat-lease-audit-alignment.py
          test ! -e .github/workflows/chat-lease-serialization-fix.yml
          test ! -e .github/workflows/chat-lease-serialization-fix-v2.yml
          git diff -- .github/workflows/unleashed-master-data-bridge-check.yml
          git status --short
      - name: Commit verified engineering patch only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "UNLEASHED-MIGRATION-003 serialize copy lease transitions"
          git push origin HEAD:agent/platform/unleashed-migration-003-master-data-bridge
