name: Chat Unleashed 002D regression contract patch

on:
  push:
    branches:
      - 'agent/platform/unleashed-migration-002d-acquisition-fencing'
    paths:
      - '.github/workflows/chat-unleashed-002d-regression-contract-patch.yml'
      - 'scripts/chat-unleashed-002d-regression-contract-patch.mjs'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install dependencies
        run: npm ci
      - name: Check patcher syntax
        run: node --check scripts/chat-unleashed-002d-regression-contract-patch.mjs
      - name: Apply regression contract update
        run: node scripts/chat-unleashed-002d-regression-contract-patch.mjs
      - name: Run updated connector regression
        run: node --experimental-strip-types --test scripts/unleashed-readonly-connector-contract.test.mjs
      - name: Verify exact permanent scope
        shell: bash
        run: |
          changed="$({ git diff --name-only; git ls-files --others --exclude-standard; } | sort -u)"
          expected='scripts/unleashed-readonly-connector-contract.test.mjs'
          printf 'Changed files:\n%s\n' "$changed"
          test "$changed" = "$expected"
      - name: Commit regression update
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/unleashed-readonly-connector-contract.test.mjs
          git commit -m 'test: align Unleashed replay contract with fenced DB commit'
          git push origin HEAD:agent/platform/unleashed-migration-002d-acquisition-fencing
