name: Diagnose production projections

on:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/diagnose-production-projections.mjs'
      - '.github/workflows/diagnose-production-projections-pr.yml'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Require Supabase diagnostic credentials
        shell: bash
        run: |
          test -n "$SUPABASE_URL" || { echo 'Missing SUPABASE_URL'; exit 1; }
          test -n "$SUPABASE_SERVICE_ROLE_KEY" || { echo 'Missing SUPABASE_SERVICE_ROLE_KEY'; exit 1; }
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Inspect production projections
        run: node scripts/diagnose-production-projections.mjs | tee /tmp/projection-diagnostics.json
      - name: Upload diagnostic report
        uses: actions/upload-artifact@v4
        with:
          name: production-projection-diagnostics
          path: /tmp/projection-diagnostics.json
          retention-days: 7
