name: Agent repair safe commissioning patcher
on:
  push:
    branches: [agent/commissioning-presentation-safe-v2]
    paths:
      - '.github/workflows/agent-fix-safe-commissioning-patcher.yml'
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/commissioning-presentation-safe-v2
      - name: Repair baseline fetch
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('.github/workflows/agent-apply-safe-commissioning-v2.yml')
          text = path.read_text()
          needle = "      - name: Verify canonical classifier untouched\n"
          replacement = "      - name: Fetch canonical main baseline\n        run: git fetch --no-tags origin main:refs/remotes/origin/main\n" + needle
          if needle not in text:
            raise SystemExit('verify step not found')
          path.write_text(text.replace(needle, replacement, 1))
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/agent-apply-safe-commissioning-v2.yml
          git commit -m "[AGENT] Fetch main before classifier baseline check"
          git push origin HEAD:agent/commissioning-presentation-safe-v2
      - name: Remove repair workflow
        run: |
          git rm .github/workflows/agent-fix-safe-commissioning-patcher.yml
          git commit -m "[AGENT] Remove patcher repair workflow"
          git push origin HEAD:agent/commissioning-presentation-safe-v2
