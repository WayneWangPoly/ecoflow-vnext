name: One-shot managed PostgreSQL GUC patch

on:
  push:
    branches:
      - 'agent/platform/fix-managed-plpgsql-guc'
    paths:
      - '.github/workflows/patch-managed-plpgsql-guc.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout patch branch
        uses: actions/checkout@v4
        with:
          ref: agent/platform/fix-managed-plpgsql-guc
          fetch-depth: 0
      - name: Remove superuser-only function GUC settings
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          acl_path = Path('supabase/migrations/20260727120500_legacy_returns_acl_hardening.sql')
          repair_path = Path('supabase/migrations/20260727120510_legacy_return_geofence_format_repair.sql')
          audit_path = Path('scripts/audit-legacy-returns-acl.mjs')

          acl = acl_path.read_text()
          pattern = re.compile(
              r"\nalter function public\.(ecoflow_(?:queue_delivery_notifications|record_delivery_exception|scan_delivery_return|driver_drop_return|record_return_inspection_item|complete_return_inspection)_acl_impl)\(([^;]+?)\)\n  set plpgsql\.variable_conflict = use_column;",
              re.DOTALL,
          )
          acl, count = pattern.subn('', acl)
          if count != 6:
              raise SystemExit(f'Expected 6 managed-GUC statements in SEC-DB-002, found {count}')

          anchor = """alter function public.ecoflow_complete_return_inspection_acl_impl(uuid,text,text)\n  set search_path = pg_catalog, public;\n"""
          note = anchor + """\n-- Supabase managed migration roles cannot set the superuser-only\n-- plpgsql.variable_conflict parameter. The preserved implementations are\n-- executed by the PostgreSQL role contract after rename, without relying on it.\n"""
          if acl.count(anchor) != 1:
              raise SystemExit('SEC-DB-002 managed-role note anchor not found exactly once')
          acl = acl.replace(anchor, note, 1)
          acl_path.write_text(acl)

          repair = repair_path.read_text()
          forbidden = """alter function public.ecoflow_driver_drop_return_acl_impl(\n  uuid,text,text,text,double precision,double precision,numeric\n) set plpgsql.variable_conflict = use_column;\n"""
          if repair.count(forbidden) != 1:
              raise SystemExit('Expected one managed-GUC statement in geofence repair')
          repair = repair.replace(
              forbidden,
              """-- Do not set plpgsql.variable_conflict here: Supabase managed migration\n-- roles cannot change that superuser-only parameter, and the implementation\n-- contract is already exercised without it.\n""",
              1,
          )
          repair_path.write_text(repair)

          audit = audit_path.read_text()
          old_check = "  ['impl use column', /set plpgsql\\.variable_conflict = use_column;/],"
          new_check = "  ['managed-role-compatible impl settings', /Supabase managed migration roles cannot set the superuser-only[\\s\\S]{0,180}plpgsql\\.variable_conflict/],"
          if audit.count(old_check) != 1:
              raise SystemExit('Legacy returns static audit GUC check was not found exactly once')
          audit = audit.replace(old_check, new_check, 1)

          anchor_audit = """for (const [name, pattern, target = source] of checks) {\n  assert.match(target, pattern, `Legacy returns ACL check failed: ${name}`);\n}\n\n"""
          replacement_audit = anchor_audit + """assert.doesNotMatch(\n  source,\n  /set plpgsql\\.variable_conflict = use_column;/,\n  'SEC-DB-002 must not require a superuser-only managed PostgreSQL setting'\n);\nassert.doesNotMatch(\n  repairSource,\n  /set plpgsql\\.variable_conflict = use_column;/,\n  'The geofence repair must not require a superuser-only managed PostgreSQL setting'\n);\n\n"""
          if audit.count(anchor_audit) != 1:
              raise SystemExit('Legacy returns static audit insertion anchor not found exactly once')
          audit = audit.replace(anchor_audit, replacement_audit, 1)
          audit_path.write_text(audit)
          PY
      - name: Commit exact patch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'EcoFlow Release Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add \
            supabase/migrations/20260727120500_legacy_returns_acl_hardening.sql \
            supabase/migrations/20260727120510_legacy_return_geofence_format_repair.sql \
            scripts/audit-legacy-returns-acl.mjs
          git diff --cached --check
          git commit -m 'Make returns migrations compatible with managed PostgreSQL'
          git push origin HEAD:agent/platform/fix-managed-plpgsql-guc
