name: Agent apply safe commissioning v2
on:
  push:
    branches: [agent/commissioning-presentation-safe-v2]
    paths:
      - '.github/workflows/agent-apply-safe-commissioning-v2.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/commissioning-presentation-safe-v2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Patch integration
        run: |
          python - <<'PY'
          from pathlib import Path

          dash = Path('src/features/dashboard/DashboardPage.tsx')
          s = dash.read_text()
          s = s.replace(
            "import { dashboardSourceTone, type DashboardOperationalTone } from './dashboardControlContract';\n",
            "import { dashboardSourceTone, type DashboardOperationalTone } from './dashboardControlContract';\nimport { buildControlRoomCommissioningView } from './controlRoomCommissioningView';\n",
            1,
          )
          s = s.replace(
            "function stageCount(flow: ReturnType<typeof buildOperationalFlow>, stage: OperationalFlowStage) {\n  return flow.nodes.find((node) => node.key === stage)?.count ?? 0;\n}",
            "function stageCount(flow: { nodes: readonly { key: OperationalFlowStage; count: number }[] }, stage: OperationalFlowStage) {\n  return flow.nodes.find((node) => node.key === stage)?.count ?? 0;\n}",
            1,
          )
          s = s.replace(
            "  const flow = useMemo(() => buildOperationalFlow(orders), [orders]);\n",
            "  const flow = useMemo(() => buildOperationalFlow(orders), [orders]);\n  const commissioningView = useMemo(\n    () => buildControlRoomCommissioningView(\n      flow,\n      orders,\n      readiness ? inventoryQuantityCommissioned : undefined,\n    ),\n    [flow, inventoryQuantityCommissioned, orders, readiness],\n  );\n",
            1,
          )
          s = s.replace("    flow.assignments.forEach((assignment) => {", "    commissioningView.assignments.forEach((assignment) => {", 1)
          s = s.replace("  }, [flow.assignments, orderById]);", "  }, [commissioningView.assignments, orderById]);", 1)
          s = s.replace("    () => flow.assignments\n", "    () => commissioningView.assignments\n", 1)
          s = s.replace("    [flow.assignments, orderById],\n", "    [commissioningView.assignments, orderById],\n", 1)
          s = s.replace(
            "  const todayFlow = useMemo(() => buildOperationalFlow(todayOrders), [todayOrders]);\n",
            "  const todayFlow = useMemo(() => buildOperationalFlow(todayOrders), [todayOrders]);\n  const todayCommissioningView = useMemo(\n    () => buildControlRoomCommissioningView(\n      todayFlow,\n      todayOrders,\n      readiness ? inventoryQuantityCommissioned : undefined,\n    ),\n    [inventoryQuantityCommissioned, readiness, todayFlow, todayOrders],\n  );\n",
            1,
          )
          s = s.replace("  const todayNeedsDecision = stageCount(todayFlow, 'NEEDS_ACTION') + stageCount(todayFlow, 'FINANCE_REVIEW');", "  const todayNeedsDecision = stageCount(todayCommissioningView, 'NEEDS_ACTION') + stageCount(todayCommissioningView, 'FINANCE_REVIEW');", 1)
          s = s.replace("  const todayReady = stageCount(todayFlow, 'READY');", "  const todayReady = stageCount(todayCommissioningView, 'READY');", 1)
          s = s.replace("  const todayWarehouse = stageCount(todayFlow, 'WAREHOUSE');", "  const todayWarehouse = stageCount(todayCommissioningView, 'WAREHOUSE');", 1)
          s = s.replace("  const todayStaged = stageCount(todayFlow, 'STAGED');", "  const todayStaged = stageCount(todayCommissioningView, 'STAGED');", 1)
          s = s.replace("  const todayRoute = stageCount(todayFlow, 'ROUTE');", "  const todayRoute = stageCount(todayCommissioningView, 'ROUTE');", 1)
          s = s.replace(
            "  const closeBlockers = detailReady\n    ? todayNeedsDecision + todayWarehouse + todayStaged + todayRoute + todayPodMissing + serverExceptions\n",
            "  const closeBlockers = detailReady\n    ? todayNeedsDecision + todayWarehouse + todayStaged + todayRoute + todayPodMissing + serverExceptions + (firstStocktakeNeeded ? 1 : 0)\n",
            1,
          )
          s = s.replace(
            "  const stages = flow.nodes.map((stage) => ({\n    ...stage,\n    tab: dashboardStageTarget(stage.key, role),\n  }));",
            "  const stages = commissioningView.nodes.map((stage) => ({\n    ...stage,\n    label: firstStocktakeNeeded && stage.key === 'NEW' ? 'Loaded' : stage.label,\n    tab: dashboardStageTarget(stage.key, role),\n  }));",
            1,
          )
          s = s.replace(
            "      data-inventory-quantity-authority={readiness ? (inventoryQuantityCommissioned ? 'commissioned' : 'pending-first-stocktake') : 'unknown'}\n",
            "      data-inventory-quantity-authority={readiness ? (inventoryQuantityCommissioned ? 'commissioned' : 'pending-first-stocktake') : 'unknown'}\n      data-operating-mode={readiness ? (inventoryQuantityCommissioned ? 'live' : 'commissioning') : 'unknown'}\n",
            1,
          )
          marker = "      <section className=\"ops-vnext-today\" aria-labelledby=\"ops-vnext-today-title\">"
          banner = '''      {readiness && firstStocktakeNeeded ? (\n        <ControlBanner\n          tone="warning"\n          icon={<ScanLine />}\n          title="Warehouse commissioning required"\n          actions={(role === 'owner' || role === 'admin') ? (\n            <a className="ops-control-link ops-control-link--primary" href="/?workspace=warehouse&mode=stocktake">\n              <ScanLine aria-hidden="true" />\n              <span>Continue commissioning</span>\n            </a>\n          ) : undefined}\n        >\n          {serverCurrentOrders.toLocaleString('en-AU')} current orders are loaded but warehouse release evaluation is not live yet. {detailReady ? commissioningView.deferredCount.toLocaleString('en-AU') : 'Mapping and stock-dependent'} records are waiting behind one commissioning gate, not separate action items. Finish SKU/barcode identity work, then approve the INITIAL stocktake. Release remains closed until commissioning is complete.\n        </ControlBanner>\n      ) : null}\n\n'''
          if marker not in s:
            raise SystemExit('Today marker not found')
          s = s.replace(marker, banner + marker, 1)
          s = s.replace(
            "            <small>business-day classified</small>",
            "            <small>{detailReady && firstStocktakeNeeded && todayCommissioningView.deferredCount\n              ? `${todayCommissioningView.deferredCount} await warehouse commissioning`\n              : 'business-day classified'}</small>",
            1,
          )
          s = s.replace(
            "              label={flow.state === 'partial' || flow.state === 'invalid' ? 'PARTIAL' : `${flow.classifiedCount} CLASSIFIED`}",
            "              label={flow.state === 'partial' || flow.state === 'invalid'\n                ? 'PARTIAL'\n                : firstStocktakeNeeded\n                  ? `${flow.classifiedCount} LOADED`\n                  : `${flow.classifiedCount} CLASSIFIED`}",
            1,
          )
          s = s.replace(
            "<span data-state={readiness && serverExceptions === 0 ? 'good' : 'attention'}><i />Active exceptions <b>{readiness ? serverExceptions : '—'}</b></span>",
            "<span data-state={readiness && serverExceptions + (firstStocktakeNeeded ? 1 : 0) === 0 ? 'good' : 'attention'}><i />Global gates <b>{readiness ? serverExceptions + (firstStocktakeNeeded ? 1 : 0) : '—'}</b></span>",
            1,
          )
          dash.write_text(s)

          routes = Path('src/features/operationalRoutes/UnifiedOperationalRoutes.tsx')
          r = routes.read_text()
          r = r.replace(
            "import { useOperationalSession } from '@/features/navigation/OperationalSessionContext';\n",
            "import { useOperationalSession } from '@/features/navigation/OperationalSessionContext';\nimport { WorkspaceRuntimeBoundary } from '@/features/navigation/WorkspaceRuntimeBoundary';\n",
            1,
          )
          r = r.replace(
            "    <OperationalAppShell role={role} profile={profile} onLogout={() => void logout()}>\n      {content}\n    </OperationalAppShell>",
            "    <OperationalAppShell role={role} profile={profile} onLogout={() => void logout()}>\n      <WorkspaceRuntimeBoundary workspace={workspace}>\n        {content}\n      </WorkspaceRuntimeBoundary>\n    </OperationalAppShell>",
            1,
          )
          routes.write_text(r)
          PY
      - name: Fetch canonical main baseline
        run: git fetch --no-tags origin main:refs/remotes/origin/main
      - name: Verify canonical classifier untouched
        run: git diff --exit-code origin/main -- src/features/intelligence/operationalFlow/operationalFlowContract.ts src/features/intelligence/operationalFlow/index.ts
      - name: Commit product integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/features/dashboard/DashboardPage.tsx src/features/operationalRoutes/UnifiedOperationalRoutes.tsx
          git commit -m "[COMMISSION-SAFE] Integrate presentation-only commissioning mode"
          git push origin HEAD:agent/commissioning-presentation-safe-v2
