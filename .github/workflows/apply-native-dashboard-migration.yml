name: Apply native dashboard migration

on:
  push:
    branches: [refactor/native-dashboard-phase2-20260713]
    paths:
      - '.github/workflows/apply-native-dashboard-migration.yml'

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/native-dashboard-phase2-20260713
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Recover prepared payload and apply migration
        shell: bash
        run: |
          git show HEAD^:.github/workflows/apply-native-dashboard-migration.yml > /tmp/prepared-native-dashboard.yml
          python3 - <<'PY'
          import base64
          import re
          from pathlib import Path

          prepared = Path('/tmp/prepared-native-dashboard.yml').read_text()
          def payload(name: str) -> bytes:
              match = re.search(rf'^\s*{name}:\s*(.+)$', prepared, re.MULTILINE)
              if not match:
                  raise SystemExit(f'Missing prepared payload: {name}')
              compact = ''.join(match.group(1).split())
              return base64.b64decode(compact)

          target = Path('src/features/dashboard/DashboardPage.tsx')
          target.parent.mkdir(parents=True, exist_ok=True)
          target.write_bytes(payload('DASHBOARD_PAGE_B64'))
          patch = Path('/tmp/native-dashboard-patch.py')
          patch.write_bytes(payload('PATCH_SCRIPT_B64'))
          PY
          python3 /tmp/native-dashboard-patch.py
      - name: Commit native dashboard migration
        shell: bash
        run: |
          git config user.name 'EcoFlow Stability Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -m 'Migrate dashboard from DOM enhancer to native workspace'
          git push origin HEAD:refactor/native-dashboard-phase2-20260713
