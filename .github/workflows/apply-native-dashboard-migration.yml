name: Apply native dashboard migration

on:
  push:
    branches: [refactor/native-dashboard-phase2-20260713]
    paths:
      - '.github/workflows/apply-native-dashboard-migration.yml'

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/native-dashboard-phase2-20260713
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply native Dashboard patch
        run: python3 scripts/apply-native-dashboard-migration.py
      - name: Remove one-time migration helpers
        run: |
          rm -f scripts/apply-native-dashboard-migration.py
          rm -f .github/workflows/apply-native-dashboard-migration.yml
      - name: Commit native Dashboard migration
        run: |
          git config user.name 'EcoFlow Stability Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -m 'Migrate dashboard from DOM enhancer to native workspace'
          git push origin HEAD:refactor/native-dashboard-phase2-20260713
