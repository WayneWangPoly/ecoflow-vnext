name: Apply native dashboard migration

on:
  push:
    branches: [refactor/native-dashboard-phase2-20260713]
    paths:
      - '.github/workflows/apply-native-dashboard-migration.yml'

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/native-dashboard-phase2-20260713
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Create native dashboard and patch app shell
        shell: bash
        env:
          DASHBOARD_PAGE_B64:   rJHtyZW1haW5pbmd9IG1vcmUgbGluZSR7cmVtYWluaW5nID09PSAxID8gJycgOiAn   b3cudGl0bGUgfHwgJ1VudGl0bGVkIGF0dGVudGlvbiBpdGVtJ308L3N0cm9uZz4KICAgICAgICA8c3Bhbj57cm93LmRldGFpbCB8fCByb3cuYWN0aW9uX2hpbnQgfHwgJ1JldmlldyByZXF1aXJlZC4nfTwvc3Bhbj4KICAgICAgPC9kaXY+CiAgICAgIDxQaWxsIHRvbmU9e3NpZ25hbFRvbmUocm93LnNpZ25hbCl9Pnty 
          PATCH_SCRIPT_B64:     c3JjL2Rhc2hib2FyZEJvb3RzdHJhcC5jc3MiKS51bmxpbmsobWlzc2luZ19vaz1UcnVlKQo=
        run: |
          mkdir -p src/features/dashboard /tmp/ecoflow-native-dashboard
          printf '%s' "$DASHBOARD_PAGE_B64" | base64 --decode > src/features/dashboard/DashboardPage.tsx
          printf '%s' "$PATCH_SCRIPT_B64" | base64 --decode > /tmp/ecoflow-native-dashboard/patch.py
          python3 /tmp/ecoflow-native-dashboard/patch.py
      - name: Commit native dashboard migration
        shell: bash
        run: |
          git config user.name 'EcoFlow Stability Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -m 'Migrate dashboard from DOM enhancer to native workspace'
          git push origin HEAD:refactor/native-dashboard-phase2-20260713
