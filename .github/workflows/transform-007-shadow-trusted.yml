name: TRANSFORM-007 trusted Supabase shadow

on:
  workflow_run:
    workflows: ['TRANSFORM-007 shadow request']
    types: [completed]

permissions: {}

concurrency:
  group: transform-007-trusted-shadow-${{ github.event.workflow_run.pull_requests[0].number || github.event.workflow_run.id }}
  cancel-in-progress: true

env:
  STATUS_CONTEXT: Supabase shadow gate (required)

jobs:
  resolve:
    name: Resolve trusted request context
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      verdict: ${{ steps.context.outputs.verdict }}
      reason: ${{ steps.context.outputs.reason }}
      pr_number: ${{ steps.context.outputs.pr_number }}
      head_sha: ${{ steps.context.outputs.head_sha }}
      merge_sha: ${{ steps.context.outputs.merge_sha }}
      candidate_blob_sha: ${{ steps.context.outputs.candidate_blob_sha }}
      target_path: ${{ steps.context.outputs.target_path }}
      target_version: ${{ steps.context.outputs.target_version }}
    steps:
      - name: Resolve current PR head and bounded scope
        id: context
        env:
          GH_TOKEN: ${{ github.token }}
          REQUEST_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          REQUEST_EVENT: ${{ github.event.workflow_run.event }}
        shell: bash
        run: |
          set -euo pipefail

          emit() {
            echo "verdict=$1" >> "$GITHUB_OUTPUT"
            echo "reason=$2" >> "$GITHUB_OUTPUT"
            echo "pr_number=${3:-}" >> "$GITHUB_OUTPUT"
            echo "head_sha=${4:-}" >> "$GITHUB_OUTPUT"
            echo "merge_sha=${5:-}" >> "$GITHUB_OUTPUT"
            echo "candidate_blob_sha=${6:-}" >> "$GITHUB_OUTPUT"
            echo "target_path=${7:-}" >> "$GITHUB_OUTPUT"
            echo "target_version=${8:-}" >> "$GITHUB_OUTPUT"
          }

          pr_number="$(jq -r '.workflow_run.pull_requests[0].number // empty' "$GITHUB_EVENT_PATH")"
          if [[ ! "$pr_number" =~ ^[0-9]+$ ]]; then
            emit blocked REQUEST_PR_MISSING
            exit 0
          fi

          pr_json=''
          for attempt in 1 2 3 4 5; do
            if ! pr_json="$(gh api "/repos/$GITHUB_REPOSITORY/pulls/$pr_number")"; then
              emit blocked REQUEST_PR_UNREADABLE "$pr_number"
              exit 0
            fi
            mergeable="$(jq -r '.mergeable | if . == null then "null" else tostring end' <<< "$pr_json")"
            [[ "$mergeable" != null ]] && break
            sleep 2
          done

          head_sha="$(jq -r '.head.sha // empty' <<< "$pr_json")"
          merge_sha="$(jq -r '.merge_commit_sha // empty' <<< "$pr_json")"
          changed_files="$(jq -r '.changed_files // empty' <<< "$pr_json")"
          head_repo="$(jq -r '.head.repo.full_name // empty' <<< "$pr_json")"
          base_ref="$(jq -r '.base.ref // empty' <<< "$pr_json")"
          pr_state="$(jq -r '.state // empty' <<< "$pr_json")"
          expected_snapshot="$(jq -r '[.head.sha,.merge_commit_sha,(.changed_files|tostring),.head.repo.full_name,.base.ref,.state] | @tsv' <<< "$pr_json")"

          if [[ ! "$head_sha" =~ ^[0-9a-f]{40}$ ]]; then
            emit blocked REQUEST_HEAD_INVALID "$pr_number"
            exit 0
          fi
          if [[ "$mergeable" != true || ! "$merge_sha" =~ ^[0-9a-f]{40}$ || "$merge_sha" == "$head_sha" ]]; then
            emit blocked REQUEST_TEST_MERGE_UNAVAILABLE "$pr_number" "$head_sha"
            exit 0
          fi
          if [[ ! "$changed_files" =~ ^[0-9]+$ ]]; then
            emit blocked REQUEST_FILE_COUNT_INVALID "$pr_number" "$head_sha" "$merge_sha"
            exit 0
          fi
          if (( changed_files > 3000 )); then
            emit blocked REQUEST_FILE_LIMIT_EXCEEDED "$pr_number" "$head_sha" "$merge_sha"
            exit 0
          fi
          if [[ "$REQUEST_EVENT" != pull_request || "$REQUEST_CONCLUSION" != success ]]; then
            emit blocked REQUEST_RUN_NOT_SUCCESSFUL "$pr_number" "$head_sha" "$merge_sha"
            exit 0
          fi
          if [[ "$pr_state" != open || "$base_ref" != main ]]; then
            emit blocked REQUEST_PR_NOT_OPEN_MAIN "$pr_number" "$head_sha" "$merge_sha"
            exit 0
          fi
          if [[ "$head_repo" != "$GITHUB_REPOSITORY" ]]; then
            emit blocked REQUEST_FORK_FORBIDDEN "$pr_number" "$head_sha" "$merge_sha"
            exit 0
          fi

          if ! gh api --paginate "/repos/$GITHUB_REPOSITORY/pulls/$pr_number/files?per_page=100" > /tmp/transform-007-pr-file-pages.json; then
            emit blocked REQUEST_FILES_UNREADABLE "$pr_number" "$head_sha" "$merge_sha"
            exit 0
          fi
          if ! jq -s '
              if all(.[]; type == "array") then add // [] else error("non-array PR files page") end
              | if all(.[];
                  (.filename | type) == "string" and
                  (.status | type) == "string" and
                  (.sha | type) == "string" and
                  ((has("previous_filename") | not) or (.previous_filename | type) == "string" or .previous_filename == null)
                ) then . else error("invalid PR file row") end
            ' /tmp/transform-007-pr-file-pages.json > /tmp/transform-007-pr-files.json; then
            emit blocked REQUEST_FILES_INVALID "$pr_number" "$head_sha" "$merge_sha"
            exit 0
          fi

          enumerated_files="$(jq 'length' /tmp/transform-007-pr-files.json)"
          if [[ "$enumerated_files" != "$changed_files" ]]; then
            emit blocked REQUEST_FILES_INCOMPLETE "$pr_number" "$head_sha" "$merge_sha"
            exit 0
          fi

          current_pr_json="$(gh api "/repos/$GITHUB_REPOSITORY/pulls/$pr_number")" || {
            emit blocked REQUEST_PR_UNREADABLE "$pr_number" "$head_sha" "$merge_sha"
            exit 0
          }
          current_snapshot="$(jq -r '[.head.sha,.merge_commit_sha,(.changed_files|tostring),.head.repo.full_name,.base.ref,.state] | @tsv' <<< "$current_pr_json")"
          if [[ "$current_snapshot" != "$expected_snapshot" ]]; then
            emit blocked REQUEST_PR_CHANGED "$pr_number" "$head_sha" "$merge_sha"
            exit 0
          fi

          protected_pattern='^(\.github/workflows/transform-007-shadow-(request|trusted)\.yml|scripts/transform-007-shadow-(runner\.sh|bootstrap\.test\.mjs)|docs/engineering/FILE-OWNERSHIP\.md|docs/engineering/work-packages/TRANSFORM-007-shadow-bootstrap\.md)$'
          if jq -e --arg pattern "$protected_pattern" 'any(.[]; (.filename | test($pattern)) or ((.previous_filename // "") | test($pattern)))' /tmp/transform-007-pr-files.json > /dev/null; then
            emit blocked TRUST_BOUNDARY_CHANGED "$pr_number" "$head_sha" "$merge_sha"
            exit 0
          fi

          changed_migration_count="$(jq '[.[] | select((.filename | test("^supabase/migrations/[^/]+\\.sql$")) or ((.previous_filename // "") | test("^supabase/migrations/[^/]+\\.sql$")))] | length' /tmp/transform-007-pr-files.json)"
          target_count="$(jq '[.[] | select(.filename | test("^supabase/migrations/[0-9]{14}_transform_007[a-z0-9_-]*\\.sql$"))] | length' /tmp/transform-007-pr-files.json)"

          if [[ "$target_count" == 0 ]]; then
            emit not_applicable TRANSFORM_007_MIGRATION_NOT_CHANGED "$pr_number" "$head_sha" "$merge_sha"
            exit 0
          fi
          if [[ "$target_count" != 1 ]]; then
            emit blocked TARGET_MIGRATION_AMBIGUOUS "$pr_number" "$head_sha" "$merge_sha"
            exit 0
          fi
          if [[ "$changed_migration_count" != 1 ]]; then
            emit blocked ADDITIONAL_MIGRATION_FORBIDDEN "$pr_number" "$head_sha" "$merge_sha"
            exit 0
          fi

          target_path="$(jq -r '.[] | select(.filename | test("^supabase/migrations/[0-9]{14}_transform_007[a-z0-9_-]*\\.sql$")) | .filename' /tmp/transform-007-pr-files.json)"
          target_status="$(jq -r --arg path "$target_path" '.[] | select(.filename == $path) | .status' /tmp/transform-007-pr-files.json)"
          candidate_blob_sha="$(jq -r --arg path "$target_path" '.[] | select(.filename == $path) | .sha' /tmp/transform-007-pr-files.json)"
          target_version="$(basename "$target_path" | cut -c1-14)"

          if [[ "$target_status" != added ]]; then
            emit blocked DEPLOYED_MIGRATION_EDIT_FORBIDDEN "$pr_number" "$head_sha" "$merge_sha"
            exit 0
          fi
          if [[ ! "$target_version" =~ ^[0-9]{14}$ || ! "$candidate_blob_sha" =~ ^[0-9a-f]{40}$ ]]; then
            emit blocked TARGET_METADATA_INVALID "$pr_number" "$head_sha" "$merge_sha"
            exit 0
          fi

          emit run TARGET_MIGRATION_REQUIRES_SHADOW "$pr_number" "$head_sha" "$merge_sha" "$candidate_blob_sha" "$target_path" "$target_version"

  prepare_evidence:
    name: Read production schema with trusted main
    needs: resolve
    if: needs.resolve.outputs.verdict == 'run'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    environment:
      name: transform-007-shadow-read
      deployment: false
    env:
      GH_TOKEN: ${{ github.token }}
      PR_NUMBER: ${{ needs.resolve.outputs.pr_number }}
      HEAD_SHA: ${{ needs.resolve.outputs.head_sha }}
      CANDIDATE_BLOB_SHA: ${{ needs.resolve.outputs.candidate_blob_sha }}
      TARGET_MIGRATION_PATH: ${{ needs.resolve.outputs.target_path }}
      TARGET_MIGRATION_VERSION: ${{ needs.resolve.outputs.target_version }}
    steps:
      - name: Checkout trusted main only
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Read production schema and migration history
        env:
          TRANSFORM_007_SHADOW_READ_DB_URL: ${{ secrets.TRANSFORM_007_SHADOW_READ_DB_URL }}
          TRANSFORM_007_TARGET_PATH: ${{ env.TARGET_MIGRATION_PATH }}
          TRANSFORM_007_TARGET_VERSION: ${{ env.TARGET_MIGRATION_VERSION }}
        shell: bash
        run: bash scripts/transform-007-shadow-runner.sh read-production /tmp/transform-007-shadow-input

      - name: Fetch the fixed candidate blob as data
        shell: bash
        run: |
          set -euo pipefail
          [[ "$PR_NUMBER" =~ ^[0-9]+$ ]]
          [[ "$HEAD_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$CANDIDATE_BLOB_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$TARGET_MIGRATION_PATH" =~ ^supabase/migrations/[0-9]{14}_transform_007[a-z0-9_-]*\.sql$ ]]
          [[ "$TARGET_MIGRATION_VERSION" =~ ^[0-9]{14}$ ]]

          metadata="$(gh api "/repos/$GITHUB_REPOSITORY/contents/$TARGET_MIGRATION_PATH?ref=$HEAD_SHA")"
          test "$(jq -r '.type' <<< "$metadata")" = file
          test "$(jq -r '.sha' <<< "$metadata")" = "$CANDIDATE_BLOB_SHA"
          size="$(jq -r '.size' <<< "$metadata")"
          [[ "$size" =~ ^[0-9]+$ ]] && (( size > 0 && size <= 2000000 ))

          gh api -H 'Accept: application/vnd.github.raw+json' "/repos/$GITHUB_REPOSITORY/contents/$TARGET_MIGRATION_PATH?ref=$HEAD_SHA" > /tmp/transform-007-shadow-input/candidate.sql
          test "$(git hash-object /tmp/transform-007-shadow-input/candidate.sql)" = "$CANDIDATE_BLOB_SHA"
          cp scripts/transform-007-shadow-runner.sh /tmp/transform-007-shadow-input/shadow-runner.sh

      - name: Seal the isolated input manifest
        env:
          REQUEST_RUN_ID: ${{ github.event.workflow_run.id }}
        shell: bash
        run: |
          set -euo pipefail
          input=/tmp/transform-007-shadow-input
          schema_sha="$(sha256sum "$input/prod-schema.sql" | cut -d' ' -f1)"
          history_sha="$(sha256sum "$input/remote-migration-versions.txt" | cut -d' ' -f1)"
          candidate_sha="$(sha256sum "$input/candidate.sql" | cut -d' ' -f1)"
          runner_sha="$(sha256sum "$input/shadow-runner.sh" | cut -d' ' -f1)"
          jq -n \
            --arg pr_number "$PR_NUMBER" \
            --arg head_sha "$HEAD_SHA" \
            --arg candidate_blob_sha "$CANDIDATE_BLOB_SHA" \
            --arg target_path "$TARGET_MIGRATION_PATH" \
            --arg target_version "$TARGET_MIGRATION_VERSION" \
            --arg request_run_id "$REQUEST_RUN_ID" \
            --arg schema_sha256 "$schema_sha" \
            --arg history_sha256 "$history_sha" \
            --arg candidate_sha256 "$candidate_sha" \
            --arg runner_sha256 "$runner_sha" \
            '{pr_number:$pr_number,head_sha:$head_sha,candidate_blob_sha:$candidate_blob_sha,target_path:$target_path,target_version:$target_version,request_run_id:$request_run_id,schema_sha256:$schema_sha256,history_sha256:$history_sha256,candidate_sha256:$candidate_sha256,runner_sha256:$runner_sha256}' \
            > "$input/manifest.json"

      - name: Upload schema-only shadow input
        uses: actions/upload-artifact@v4
        with:
          name: transform-007-shadow-input-${{ github.run_id }}
          path: /tmp/transform-007-shadow-input
          if-no-files-found: error
          retention-days: 1

  shadow:
    name: Apply candidate in credential-free PostgreSQL 17
    needs: [resolve, prepare_evidence]
    if: needs.resolve.outputs.verdict == 'run' && needs.prepare_evidence.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      actions: read
    services:
      shadow:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: shadow
          POSTGRES_DB: postgres
        ports:
          - 54329:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      SHADOW_ADMIN_DB_URL: postgresql://postgres:shadow@localhost:54329/postgres
      SHADOW_MIGRATOR_DB_URL: postgresql://transform_007_shadow:shadow-candidate@localhost:54329/postgres
      EXPECTED_PR_NUMBER: ${{ needs.resolve.outputs.pr_number }}
      EXPECTED_HEAD_SHA: ${{ needs.resolve.outputs.head_sha }}
      EXPECTED_CANDIDATE_BLOB_SHA: ${{ needs.resolve.outputs.candidate_blob_sha }}
      EXPECTED_TARGET_PATH: ${{ needs.resolve.outputs.target_path }}
      EXPECTED_TARGET_VERSION: ${{ needs.resolve.outputs.target_version }}
    steps:
      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Download isolated input from the trusted job
        uses: actions/download-artifact@v4
        with:
          name: transform-007-shadow-input-${{ github.run_id }}
          path: /tmp/transform-007-shadow-input

      - name: Execute credential-free shadow runner
        shell: bash
        run: bash /tmp/transform-007-shadow-input/shadow-runner.sh shadow /tmp/transform-007-shadow-input

  finalize:
    name: Publish exact head and test-merge result
    needs: [resolve, prepare_evidence, shadow]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: read
      statuses: write
    env:
      GH_TOKEN: ${{ github.token }}
      PR_NUMBER: ${{ needs.resolve.outputs.pr_number }}
      HEAD_SHA: ${{ needs.resolve.outputs.head_sha }}
      MERGE_SHA: ${{ needs.resolve.outputs.merge_sha }}
      VERDICT: ${{ needs.resolve.outputs.verdict }}
      REASON: ${{ needs.resolve.outputs.reason }}
      PREPARE_RESULT: ${{ needs.prepare_evidence.result }}
      SHADOW_RESULT: ${{ needs.shadow.result }}
      STATUS_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - name: Publish required status from trusted main
        shell: bash
        run: |
          set -euo pipefail
          [[ "$HEAD_SHA" =~ ^[0-9a-f]{40}$ ]] || exit 1
          [[ "$MERGE_SHA" =~ ^[0-9a-f]{40}$ ]] || exit 1
          [[ "$PR_NUMBER" =~ ^[0-9]+$ ]] || exit 1

          current_pr="$(gh api "/repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER")"
          jq -e --arg repository "$GITHUB_REPOSITORY" --arg head_sha "$HEAD_SHA" --arg merge_sha "$MERGE_SHA" \
            '.state == "open" and .base.ref == "main" and .head.repo.full_name == $repository and .head.sha == $head_sha and .merge_commit_sha == $merge_sha' \
            <<< "$current_pr" > /dev/null || exit 1

          final_state=failure
          final_description="Shadow blocked: ${REASON:-UNKNOWN_CONTEXT}"
          if [[ "$VERDICT" == not_applicable ]]; then
            final_state=success
            final_description='TRANSFORM-007 migration shadow is not applicable to this PR'
          elif [[ "$VERDICT" == run && "$PREPARE_RESULT" == success && "$SHADOW_RESULT" == success ]]; then
            final_state=success
            final_description='Production-schema shadow passed in isolated PostgreSQL 17'
          elif [[ "$VERDICT" == run ]]; then
            final_description="Shadow failed: prepare=$PREPARE_RESULT local=$SHADOW_RESULT"
          fi

          publish_status() {
            gh api --method POST "/repos/$GITHUB_REPOSITORY/statuses/$1" \
              -f state="$2" -f context="$STATUS_CONTEXT" -f description="$3" -f target_url="$STATUS_URL"
          }

          publish_status "$MERGE_SHA" pending 'Shadow result publication in progress'
          publish_status "$HEAD_SHA" pending 'Shadow result publication in progress'
          for target_sha in "$HEAD_SHA" "$MERGE_SHA"; do
            publish_status "$target_sha" "$final_state" "$final_description"
          done
          test "$final_state" = success
