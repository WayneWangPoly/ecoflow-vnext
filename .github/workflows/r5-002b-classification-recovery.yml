name: R5-002-R2 activation apply

on:
  push:
    branches:
      - 'agent/unleashed/r5-002-r2-activation'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/unleashed/r5-002-r2-activation
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Apply bounded R2 activation
        run: python3 scripts/r5-002-r2-activate-transform.py
      - name: Check patch
        run: git diff --check
      - name: Focused activation contracts
        run: node --experimental-strip-types --test scripts/r5-002a-authenticated-acquisition-carrier-contract.test.mjs scripts/r5-002b-classification-recovery-contract.test.mjs
      - name: Typecheck
        run: npm run typecheck
      - name: Production build
        run: npm run build
      - name: Commit activation carrier
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'WayneWangPoly'
          git config user.email 'waynewangpoly@gmail.com'
          git add \
            supabase/functions/trigger-unleashed-readonly-sync/index.ts \
            src/features/team/unleashedAdl1StockOnHandAcquisition.ts \
            src/features/settings/UnleashedReadonlyProbePanel.tsx \
            scripts/r5-002b-classification-recovery-contract.test.mjs \
            docs/engineering/work-packages/ECOFLOW-R5-002-R2-activation.md
          if git diff --cached --quiet; then
            echo 'Activation already applied.'
            exit 0
          fi
          git commit -m 'ECOFLOW-R5-002-R2 — activate governed recovery carrier'
          git push origin HEAD:agent/unleashed/r5-002-r2-activation
