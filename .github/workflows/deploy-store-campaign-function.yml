name: Deploy store campaign function

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'supabase/functions/store-campaign-dispatch/**'
      - '.github/workflows/deploy-store-campaign-function.yml'

permissions:
  contents: read

env:
  SUPABASE_CLI_VERSION: 2.107.0
  SUPABASE_PROJECT_REF: kauqwlzuyxcudoyognwf

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: Require deployment credentials
        run: test -n "$SUPABASE_ACCESS_TOKEN" || { echo 'Missing SUPABASE_ACCESS_TOKEN'; exit 1; }
      - name: Verify production project
        run: test "$(tr -d '[:space:]' < supabase/.temp/project-ref)" = "$SUPABASE_PROJECT_REF"
      - name: Install Supabase CLI
        run: npm install --global supabase@"$SUPABASE_CLI_VERSION"
      - name: Deploy store campaign dispatch
        run: supabase functions deploy store-campaign-dispatch --project-ref "$SUPABASE_PROJECT_REF"
