name: Deploy operational edge functions

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'supabase/functions/store-campaign-dispatch/**'
      - 'supabase/functions/trigger-ordermentum-sync/**'
      - '.github/workflows/deploy-store-campaign-function.yml'

permissions:
  contents: read
  statuses: write

env:
  SUPABASE_CLI_VERSION: 2.107.0
  SUPABASE_PROJECT_REF: kauqwlzuyxcudoyognwf

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    env:
      GH_TOKEN: ${{ github.token }}
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      STATUS_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - name: Publish pending function status
        run: gh api --method POST "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" -f state='pending' -f context='Operational edge functions' -f description='Deploying customer email and durable sync functions' -f target_url="$STATUS_URL"
      - uses: actions/checkout@v4
      - name: Require deployment credentials
        run: test -n "$SUPABASE_ACCESS_TOKEN" || { echo 'Missing SUPABASE_ACCESS_TOKEN'; exit 1; }
      - name: Verify production project
        run: test "$(tr -d '[:space:]' < supabase/.temp/project-ref)" = "$SUPABASE_PROJECT_REF"
      - name: Install Supabase CLI
        run: npm install --global supabase@"$SUPABASE_CLI_VERSION"
      - name: Deploy operational functions
        run: |
          supabase functions deploy store-campaign-dispatch --project-ref "$SUPABASE_PROJECT_REF"
          supabase functions deploy trigger-ordermentum-sync --project-ref "$SUPABASE_PROJECT_REF"
      - name: Verify deployed functions exist
        run: |
          supabase functions list --project-ref "$SUPABASE_PROJECT_REF" | tee /tmp/functions.txt
          grep -q 'store-campaign-dispatch' /tmp/functions.txt
          grep -q 'trigger-ordermentum-sync' /tmp/functions.txt
      - name: Publish successful function status
        run: gh api --method POST "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" -f state='success' -f context='Operational edge functions' -f description='Customer email and durable sync functions deployed' -f target_url="$STATUS_URL"
      - name: Publish failed function status
        if: failure()
        run: gh api --method POST "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" -f state='failure' -f context='Operational edge functions' -f description='Operational edge function deployment failed' -f target_url="$STATUS_URL"
