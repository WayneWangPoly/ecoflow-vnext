name: Apply commercial source-boundary code patches

on:
  workflow_dispatch:
  push:
    branches:
      - refactor/commercial-source-boundary-v1
    paths:
      - scripts/apply-commercial-source-boundary-code-patches.mjs
      - .github/workflows/apply-commercial-source-boundary-code-patches.yml

permissions:
  contents: write

concurrency:
  group: apply-commercial-source-boundary-code-patches
  cancel-in-progress: false

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/commercial-source-boundary-v1
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply deterministic patches
        run: node scripts/apply-commercial-source-boundary-code-patches.mjs
      - name: Commit patched source files
        shell: bash
        run: |
          if git diff --quiet; then
            echo "Source files already contain the strict boundary patches."
            exit 0
          fi
          git config user.name "EcoFlow Source Boundary Bot"
          git config user.email "actions@users.noreply.github.com"
          git add src/app/App.tsx src/data/repositories/supabaseOrdermentumViews.ts src/data/repositories/resilientOrdermentumViews.ts
          git commit -m "Enforce strict run release and source-aware payment holds"
          git push origin HEAD:refactor/commercial-source-boundary-v1
