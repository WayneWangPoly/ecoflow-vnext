name: Agent commissioning gate patch

on:
  push:
    branches:
      - agent/global-inventory-commissioning-gate

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[COMMISSION-GATE-PATCHED]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/global-inventory-commissioning-gate
          fetch-depth: 0
      - name: Patch commissioning semantics
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected one match, found {count}: {old[:90]!r}')
              p.write_text(text.replace(old, new, 1))

          flow = 'src/features/intelligence/operationalFlow/operationalFlowContract.ts'
          replace_once(
              flow,
              "export type OperationalFlowOrderInput = Pick<ImportedOrder, 'id' | 'status' | 'releaseGateStatus'>;\nexport type OperationalFlowState = 'ready' | 'partial' | 'empty' | 'invalid';",
              "export type OperationalFlowOrderInput = Pick<ImportedOrder, 'id' | 'status' | 'releaseGateStatus'>;\nexport type OperationalFlowContext = {\n  /** False means the first APPROVED INITIAL stocktake has not established quantity authority yet. */\n  inventoryQuantityCommissioned?: boolean;\n};\nexport type OperationalFlowState = 'ready' | 'partial' | 'empty' | 'invalid';"
          )
          replace_once(
              flow,
              "const BLOCKED_GATES = new Set<ReleaseGateStatus>([\n  'BLOCKED_DATA',\n  'BLOCKED_MAPPING',\n  'BLOCKED_STOCK',\n]);",
              "const BLOCKED_GATES = new Set<ReleaseGateStatus>([\n  'BLOCKED_DATA',\n  'BLOCKED_MAPPING',\n  'BLOCKED_STOCK',\n]);\n\nconst COMMISSIONING_DEFERRED_GATES = new Set<ReleaseGateStatus>([\n  'BLOCKED_MAPPING',\n  'BLOCKED_STOCK',\n]);"
          )
          replace_once(
              flow,
              "export function classifyOperationalFlowOrder(input: OperationalFlowOrderInput): OperationalFlowClassification {",
              "export function classifyOperationalFlowOrder(\n  input: OperationalFlowOrderInput,\n  context: OperationalFlowContext = {},\n): OperationalFlowClassification {"
          )
          replace_once(
              flow,
              "  if (status === 'MAPPING_EXCEPTION' || status === 'FAILED') {",
              "  const commissioningDeferred = context.inventoryQuantityCommissioned === false\n    && gate.kind === 'known'\n    && COMMISSIONING_DEFERRED_GATES.has(gate.value)\n    && status !== 'FAILED';\n\n  // Before the first APPROVED INITIAL stocktake, mapping/stock-dependent orders\n  // are held behind one warehouse commissioning gate. They remain fail-closed,\n  // but must not be multiplied into thousands of order-level action items.\n  if (status === 'MAPPING_EXCEPTION' && commissioningDeferred) {\n    return { kind: 'classified', orderId, stage: 'NEW', issues };\n  }\n\n  if (status === 'MAPPING_EXCEPTION' || status === 'FAILED') {"
          )
          replace_once(
              flow,
              "  if (gate.kind === 'known') {\n    if (BLOCKED_GATES.has(gate.value)) {",
              "  if (gate.kind === 'known') {\n    if (commissioningDeferred && BLOCKED_GATES.has(gate.value)) {\n      return { kind: 'classified', orderId, stage: 'NEW', issues };\n    }\n    if (BLOCKED_GATES.has(gate.value)) {"
          )
          replace_once(
              flow,
              "export function buildOperationalFlow(input: unknown): OperationalFlow {",
              "export function buildOperationalFlow(\n  input: unknown,\n  context: OperationalFlowContext = {},\n): OperationalFlow {"
          )
          replace_once(
              flow,
              "    const classification = classifyOperationalFlowOrder({\n      id: orderId,\n      status: record.status as OrderStatus,\n      releaseGateStatus: record.releaseGateStatus as ReleaseGateStatus | undefined,\n    });",
              "    const classification = classifyOperationalFlowOrder({\n      id: orderId,\n      status: record.status as OrderStatus,\n      releaseGateStatus: record.releaseGateStatus as ReleaseGateStatus | undefined,\n    }, context);"
          )

          dashboard = 'src/features/dashboard/DashboardPage.tsx'
          replace_once(
              dashboard,
              "function stageCount(flow: ReturnType<typeof buildOperationalFlow>, stage: OperationalFlowStage) {\n  return flow.nodes.find((node) => node.key === stage)?.count ?? 0;\n}",
              "function stageCount(flow: ReturnType<typeof buildOperationalFlow>, stage: OperationalFlowStage) {\n  return flow.nodes.find((node) => node.key === stage)?.count ?? 0;\n}\n\nfunction isCommissioningDeferredOrder(order: ImportedOrder, inventoryQuantityCommissioned: boolean) {\n  if (inventoryQuantityCommissioned || order.status === 'FAILED') return false;\n  return order.releaseGateStatus === 'BLOCKED_MAPPING' || order.releaseGateStatus === 'BLOCKED_STOCK';\n}"
          )
          replace_once(
              dashboard,
              "  const flow = useMemo(() => buildOperationalFlow(orders), [orders]);",
              "  const flow = useMemo(\n    () => buildOperationalFlow(orders, {\n      inventoryQuantityCommissioned: readiness ? inventoryQuantityCommissioned : undefined,\n    }),\n    [inventoryQuantityCommissioned, orders, readiness],\n  );"
          )
          replace_once(
              dashboard,
              "  const todayFlow = useMemo(() => buildOperationalFlow(todayOrders), [todayOrders]);",
              "  const todayFlow = useMemo(\n    () => buildOperationalFlow(todayOrders, {\n      inventoryQuantityCommissioned: readiness ? inventoryQuantityCommissioned : undefined,\n    }),\n    [inventoryQuantityCommissioned, readiness, todayOrders],\n  );\n  const commissioningDeferredCount = useMemo(\n    () => orders.filter((order) => isCommissioningDeferredOrder(order, inventoryQuantityCommissioned)).length,\n    [inventoryQuantityCommissioned, orders],\n  );\n  const todayCommissioningDeferred = useMemo(\n    () => todayOrders.filter((order) => isCommissioningDeferredOrder(order, inventoryQuantityCommissioned)).length,\n    [inventoryQuantityCommissioned, todayOrders],\n  );"
          )
          replace_once(
              dashboard,
              "  const closeBlockers = detailReady\n    ? todayNeedsDecision + todayWarehouse + todayStaged + todayRoute + todayPodMissing + serverExceptions\n    : null;",
              "  const closeBlockers = detailReady\n    ? todayNeedsDecision + todayWarehouse + todayStaged + todayRoute + todayPodMissing + serverExceptions + (firstStocktakeNeeded ? 1 : 0)\n    : null;"
          )
          replace_once(
              dashboard,
              "  const stages = flow.nodes.map((stage) => ({\n    ...stage,\n    tab: dashboardStageTarget(stage.key, role),\n  }));",
              "  const stages = flow.nodes.map((stage) => ({\n    ...stage,\n    label: firstStocktakeNeeded && stage.key === 'NEW' ? 'Loaded' : stage.label,\n    tab: dashboardStageTarget(stage.key, role),\n  }));"
          )
          replace_once(
              dashboard,
              "      {healthNotice || statusNotice ? (\n        <ControlBanner tone=\"warning\" icon={<ShieldAlert />}>\n          {healthNotice || statusNotice}\n        </ControlBanner>\n      ) : null}\n\n      <section className=\"ops-vnext-today\"",
              "      {healthNotice || statusNotice ? (\n        <ControlBanner tone=\"warning\" icon={<ShieldAlert />}>\n          {healthNotice || statusNotice}\n        </ControlBanner>\n      ) : null}\n      {readiness && firstStocktakeNeeded ? (\n        <ControlBanner\n          tone=\"warning\"\n          icon={<ScanLine />}\n          title=\"Warehouse commissioning required\"\n          actions={(role === 'owner' || role === 'admin') ? (\n            <a className=\"ops-control-link ops-control-link--primary\" href=\"/?workspace=warehouse&mode=stocktake\">\n              <ScanLine aria-hidden=\"true\" />\n              <span>Continue commissioning</span>\n            </a>\n          ) : undefined}\n        >\n          {serverCurrentOrders.toLocaleString('en-AU')} current orders are safely loaded. {detailReady ? commissioningDeferredCount.toLocaleString('en-AU') : 'Mapping and stock-dependent'} order records are waiting behind one warehouse go-live gate, not separate action items. Finish SKU/barcode identity work, then approve the INITIAL stocktake. Release remains closed until commissioning is complete.\n        </ControlBanner>\n      ) : null}\n\n      <section className=\"ops-vnext-today\""
          )
          replace_once(
              dashboard,
              "            <small>business-day classified</small>",
              "            <small>{detailReady && firstStocktakeNeeded && todayCommissioningDeferred\n              ? `${todayCommissioningDeferred} await warehouse commissioning`\n              : 'business-day classified'}</small>"
          )
          replace_once(
              dashboard,
              "              label={flow.state === 'partial' || flow.state === 'invalid' ? 'PARTIAL' : `${flow.classifiedCount} CLASSIFIED`}",
              "              label={flow.state === 'partial' || flow.state === 'invalid'\n                ? 'PARTIAL'\n                : firstStocktakeNeeded\n                  ? `${flow.classifiedCount} LOADED`\n                  : `${flow.classifiedCount} CLASSIFIED`}"
          )
          replace_once(
              dashboard,
              "            <span data-state={readiness && serverExceptions === 0 ? 'good' : 'attention'}><i />Active exceptions <b>{readiness ? serverExceptions : '—'}</b></span>",
              "            <span data-state={readiness && serverExceptions + (firstStocktakeNeeded ? 1 : 0) === 0 ? 'good' : 'attention'}><i />Global gates <b>{readiness ? serverExceptions + (firstStocktakeNeeded ? 1 : 0) : '—'}</b></span>"
          )
          replace_once(
              dashboard,
              "      data-inventory-quantity-authority={readiness ? (inventoryQuantityCommissioned ? 'commissioned' : 'pending-first-stocktake') : 'unknown'}",
              "      data-inventory-quantity-authority={readiness ? (inventoryQuantityCommissioned ? 'commissioned' : 'pending-first-stocktake') : 'unknown'}\n      data-operating-mode={readiness ? (inventoryQuantityCommissioned ? 'live' : 'commissioning') : 'unknown'}"
          )

          # Self-remove the one-shot patch workflow from the resulting branch.
          Path('.github/workflows/agent-commissioning-gate-patch.yml').unlink()
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/features/intelligence/operationalFlow/operationalFlowContract.ts src/features/dashboard/DashboardPage.tsx .github/workflows/agent-commissioning-gate-patch.yml
          git commit -m "[COMMISSION-GATE-PATCHED] Treat pre-stocktake blockers as one global gate"
          git push origin HEAD:agent/global-inventory-commissioning-gate
