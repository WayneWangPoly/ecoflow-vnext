name: Commercial Promotion Wave 2 P3A-R3 provider sentinel

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/commercial-promotion-wave2-p3a-r3-provider-sentinel-check.yml'
      - 'docs/engineering/work-packages/338-COMMERCIAL-WAVE2-P3A-R3-PROVIDER-SENTINEL.md'
      - 'scripts/commercial-promotion-wave2-p3a-r3-provider-sentinel-contract.test.mjs'
      - 'scripts/commercial-promotion-wave2-p3a-r3-provider-sentinel-db-contract-test.sql'
      - 'src/data/repositories/commercialWave2CanaryVerification.ts'
      - 'src/features/productIdentity/commercialWave2CanaryVerificationContract.ts'
      - 'supabase/migrations/20260913222500_commercial_wave2_p3a_r3_provider_sentinel.sql'
  push:
    branches:
      - 'agent/product-identity/338-wave2-p3a-r3-provider-sentinel'

permissions:
  contents: read

jobs:
  contract:
    name: Exact-head P3A-R3 provider sentinel contract
    runs-on: ubuntu-latest
    timeout-minutes: 35
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: postgres
      EXACT_BASE_SHA: 0986a20be5da367b0960a01c7e9c481139680f96
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Bind exact branch head to P3A-R2 production base
        shell: bash
        run: |
          set -euo pipefail
          test "$(git merge-base HEAD "$EXACT_BASE_SHA")" = "$EXACT_BASE_SHA"
          echo "exact_head=$(git rev-parse HEAD)"
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Exercise R3 static provider-attribution contract
        run: node --test scripts/commercial-promotion-wave2-p3a-r3-provider-sentinel-contract.test.mjs
      - name: Exercise PostgreSQL 17 R3 dynamic legacy-class and fail-closed contract
        run: psql -v ON_ERROR_STOP=1 -f scripts/commercial-promotion-wave2-p3a-r3-provider-sentinel-db-contract-test.sql
      - name: Keep incumbent P3A-R2 static authority contract green
        run: node --test scripts/commercial-promotion-wave2-p3a-auth-read-contract.test.mjs
      - name: Keep incumbent P3A-R2 database contract green
        run: psql -v ON_ERROR_STOP=1 -f scripts/commercial-promotion-wave2-p3a-auth-read-db-contract-test.sql
      - name: Keep incumbent P2B static contract green
        run: node --test scripts/commercial-promotion-wave2-p2b-canary-promotion-contract.test.mjs
      - name: Typecheck
        run: npm run typecheck
      - name: Production build
        run: npm run build
      - name: Reject whitespace errors
        run: git diff --check "$EXACT_BASE_SHA"...HEAD
