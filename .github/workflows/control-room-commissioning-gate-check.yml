name: Control Room commissioning gate check

on:
  pull_request:
    paths:
      - 'src/features/dashboard/**'
      - 'src/features/intelligence/operationalFlow/**'
      - 'src/data/repositories/dashboardReadiness.ts'
      - 'scripts/audit-control-room-commissioning-gate.mjs'
      - '.github/workflows/control-room-commissioning-gate-check.yml'
  push:
    branches:
      - main
    paths:
      - 'src/features/dashboard/**'
      - 'src/features/intelligence/operationalFlow/**'
      - 'src/data/repositories/dashboardReadiness.ts'
      - 'scripts/audit-control-room-commissioning-gate.mjs'
      - '.github/workflows/control-room-commissioning-gate-check.yml'

permissions:
  contents: read

jobs:
  application:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Commissioning semantics audit
        run: node scripts/audit-control-room-commissioning-gate.mjs
      - name: TypeScript
        run: npm run typecheck
      - name: Vite production build
        run: npm run build
