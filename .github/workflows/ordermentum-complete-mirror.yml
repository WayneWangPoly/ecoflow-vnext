name: EcoFlow Ordermentum Complete Mirror

on:
  workflow_dispatch:
    inputs:
      scope:
        description: "Run recent reconciliation or explicitly resume full history"
        required: true
        default: "recent"
        type: choice
        options:
          - recent
          - full_history
  workflow_run:
    workflows: ["Deploy Supabase migrations"]
    types: [completed]
  schedule:
    - cron: "30 17 * * 0"

permissions:
  contents: read
  statuses: write

concurrency:
  group: ordermentum-cloud-sync
  cancel-in-progress: false

jobs:
  complete-mirror:
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    timeout-minutes: 90

    env:
      GH_TOKEN: ${{ github.token }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      ORDERMENTUM_USERNAME: ${{ secrets.ORDERMENTUM_USERNAME }}
      ORDERMENTUM_PASSWORD: ${{ secrets.ORDERMENTUM_PASSWORD }}
      ORDERMENTUM_SUPPLIER_ID: ${{ secrets.ORDERMENTUM_SUPPLIER_ID }}
      ORDERMENTUM_BASE_URL: ${{ secrets.ORDERMENTUM_BASE_URL }}
      ORDERMENTUM_API_BASE_URL: ${{ secrets.ORDERMENTUM_API_BASE_URL }}
      ORDERMENTUM_API_KEY: ${{ secrets.ORDERMENTUM_API_KEY }}
      ORDERMENTUM_ORDER_DETAIL_URL_TEMPLATE: ${{ secrets.ORDERMENTUM_ORDER_DETAIL_URL_TEMPLATE }}
      ORDERMENTUM_INVOICE_DETAIL_URL_TEMPLATE: ${{ secrets.ORDERMENTUM_INVOICE_DETAIL_URL_TEMPLATE }}
      ORDERMENTUM_FULL_SYNC_FROM: ${{ secrets.ORDERMENTUM_FULL_SYNC_FROM }}
      NODE_OPTIONS: "--dns-result-order=ipv4first"
      ORDERMENTUM_FETCH_TIMEOUT_MS: "60000"
      SUPABASE_FETCH_TIMEOUT_MS: "60000"
      ORDERMENTUM_FETCH_RETRIES: "3"
      ORDERMENTUM_HISTORY_SLICE_MINUTES: "45"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Resolve mirror mode and status target
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_run" ]; then
            echo "MIRROR_MODE=verify_only" >> "$GITHUB_ENV"
            echo "MIRROR_REASON=Lightweight verification after successful Supabase production deployment" >> "$GITHUB_ENV"
            echo "MIRROR_STATUS_SHA=${{ github.event.workflow_run.head_sha }}" >> "$GITHUB_ENV"
          elif [ "${{ github.event_name }}" = "schedule" ]; then
            echo "MIRROR_MODE=recent" >> "$GITHUB_ENV"
            echo "MIRROR_REASON=Weekly recent commercial reconciliation" >> "$GITHUB_ENV"
            echo "MIRROR_STATUS_SHA=${{ github.sha }}" >> "$GITHUB_ENV"
          else
            if [ "${{ inputs.scope }}" = "full_history" ]; then
              echo "MIRROR_MODE=resume_history" >> "$GITHUB_ENV"
              echo "MIRROR_REASON=Owner or Admin explicitly requested resumable full-history reconciliation" >> "$GITHUB_ENV"
            else
              echo "MIRROR_MODE=recent" >> "$GITHUB_ENV"
              echo "MIRROR_REASON=Owner or Admin requested recent reconciliation" >> "$GITHUB_ENV"
            fi
            echo "MIRROR_STATUS_SHA=${{ github.sha }}" >> "$GITHUB_ENV"
          fi
          echo "MIRROR_STATUS_URL=${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" >> "$GITHUB_ENV"

      - name: Publish pending mirror status
        shell: bash
        run: |
          gh api --method POST "repos/$GITHUB_REPOSITORY/statuses/$MIRROR_STATUS_SHA" \
            -f state='pending' \
            -f context='Ordermentum mirror verification' \
            -f description='Ordermentum verification is running' \
            -f target_url="$MIRROR_STATUS_URL"

      - name: Validate required secrets
        shell: bash
        run: |
          missing=0
          for name in SUPABASE_URL SUPABASE_SERVICE_ROLE_KEY ORDERMENTUM_USERNAME ORDERMENTUM_PASSWORD ORDERMENTUM_SUPPLIER_ID; do
            if [ -z "${!name}" ]; then echo "Missing required secret/env: $name"; missing=1; fi
          done
          if [ "$missing" -ne 0 ]; then exit 1; fi

      - name: Run bounded Ordermentum verification or reconciliation
        id: mirror
        shell: bash
        run: |
          set -o pipefail
          echo "Mode: $MIRROR_MODE"
          echo "Reason: $MIRROR_REASON"
          echo "Degraded notification policy: fail only for a new or changed blocker set"
          node scripts/ordermentum-complete-mirror.mjs \
            --mode="$MIRROR_MODE" \
            --time-budget-minutes=45 \
            --max-pages-per-slice=80 \
            --max-details-per-slice=400 \
            --degraded-exit-mode=transition \
            2>&1 | tee /tmp/ordermentum-complete-mirror.log

      - name: Publish mirror summary
        if: always()
        shell: bash
        run: |
          {
            echo "## Ordermentum bounded mirror"
            echo ""
            echo "- Mode: $MIRROR_MODE"
            echo "- Reason: $MIRROR_REASON"
            echo "- Workflow run: $GITHUB_RUN_ID"
            echo "- DEGRADED alerts: only new or changed blocker sets fail the workflow"
            echo ""
            echo '```text'
            tail -n 180 /tmp/ordermentum-complete-mirror.log 2>/dev/null || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload mirror log and checkpoint result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ordermentum-complete-mirror-${{ github.run_id }}
          path: |
            /tmp/ordermentum-complete-mirror.log
            /tmp/ordermentum-history-pipeline-result.json
          if-no-files-found: warn
          retention-days: 1

      - name: Publish final mirror status
        if: always()
        shell: bash
        run: |
          if [ "${{ steps.mirror.outcome }}" = "success" ]; then
            state='success'
            description='Mirror check completed; business health is published in EcoFlow Settings'
          else
            state='failure'
            description='Mirror check failed or found a new/changed blocker'
          fi
          gh api --method POST "repos/$GITHUB_REPOSITORY/statuses/$MIRROR_STATUS_SHA" \
            -f state="$state" \
            -f context='Ordermentum mirror verification' \
            -f description="$description" \
            -f target_url="$MIRROR_STATUS_URL" || true
