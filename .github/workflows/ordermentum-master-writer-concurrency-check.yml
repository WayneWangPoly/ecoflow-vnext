name: Ordermentum master writer serialization

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/**'
      - 'scripts/ordermentum-cloud-sync.mjs'
      - 'scripts/ordermentum-complete-mirror.mjs'
      - 'scripts/ordermentum-master-data-sync.mjs'
      - 'scripts/audit-ordermentum-master-writer-concurrency.mjs'
  push:
    branches: [main]
    paths:
      - '.github/workflows/**'
      - 'scripts/ordermentum-cloud-sync.mjs'
      - 'scripts/ordermentum-complete-mirror.mjs'
      - 'scripts/ordermentum-master-data-sync.mjs'
      - 'scripts/audit-ordermentum-master-writer-concurrency.mjs'

permissions:
  contents: read

jobs:
  master-writer-concurrency:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Use Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Audit Ordermentum master writer serialization
        run: node scripts/audit-ordermentum-master-writer-concurrency.mjs
