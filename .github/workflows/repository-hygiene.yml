name: Repository hygiene

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  tracked-local-data:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Reject tracked credentials and local API data
        run: node scripts/audit-repository-hygiene.mjs

  patch-refresh-conflict-target:
    if: github.event_name == 'pull_request' && github.head_ref == 'agent/data/INTEL-DATA-002-order-fulfilment-facts'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out fact branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Apply exact managed migration patch and self-clean
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('supabase/migrations/20260729090000_order_fulfilment_facts.sql')
          source = path.read_text()
          old = '  on conflict(dataset_key) do update\n'
          new = '  on conflict on constraint refresh_status_pkey do update\n'

          old_count = source.count(old)
          new_count = source.count(new)
          if old_count == 1 and new_count == 0:
              source = source.replace(old, new, 1)
              path.write_text(source)
          elif old_count == 0 and new_count == 1:
              pass
          else:
              raise SystemExit(
                  f'Unexpected refresh conflict target counts: old={old_count}, new={new_count}'
              )
          PY

          git fetch origin main --depth=1
          git show FETCH_HEAD:.github/workflows/repository-hygiene.yml \
            > .github/workflows/repository-hygiene.yml

          git diff --check
          git config user.name 'EcoFlow Release Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add \
            supabase/migrations/20260729090000_order_fulfilment_facts.sql \
            .github/workflows/repository-hygiene.yml

          if git diff --cached --quiet; then
            echo 'Exact patch and workflow cleanup are already present.'
            exit 0
          fi

          git commit -m 'Disambiguate fact refresh conflict target'
          git push origin HEAD:${{ github.head_ref }}
