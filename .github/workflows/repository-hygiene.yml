name: Repository hygiene

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  tracked-local-data:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Reject tracked credentials and local API data
        run: node scripts/audit-repository-hygiene.mjs

  harden-order-fulfilment-facts:
    if: github.event_name == 'pull_request' && github.head_ref == 'agent/data/INTEL-DATA-002-order-fulfilment-facts'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out fact branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Apply exact semantic hardening and self-clean
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def replace_exact(path: Path, old: str, new: str) -> None:
              text = path.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected one exact replacement, found {count}')
              path.write_text(text.replace(old, new, 1))

          migration = Path('supabase/migrations/20260729090000_order_fulfilment_facts.sql')
          contract = Path('scripts/order-fulfilment-facts-contract-test.sql')
          audit = Path('scripts/audit-order-fulfilment-facts.mjs')

          replace_exact(
              migration,
              """  v_ordered_quantity numeric(14,4);\n  v_ordered_unit text;\n  v_physical_sku_code text;\n""",
              """  v_ordered_quantity numeric(14,4);\n  v_ordered_unit text;\n  v_source_line_status text;\n  v_physical_sku_code text;\n""",
          )

          replace_exact(
              migration,
              """    l.quantity,\n    upper(btrim(coalesce(nullif(l.unit,''),nullif(l.uom,''),'UNSPECIFIED')))\n  into\n    v_internal_order_id,\n    v_source_order_key,\n    v_source_line_id,\n    v_commercial_sku_code,\n    v_commercial_product_name,\n    v_ordered_quantity,\n    v_ordered_unit\n  from public.v_ecoflow_ordermentum_order_lines l\n  join public.ecoflow_ordermentum_internal_orders io\n    on io.source_provider = 'ORDERMENTUM'\n   and io.external_order_id = l.external_order_id\n  where l.external_order_id = btrim(p_external_order_id)\n""",
              """    l.quantity,\n    upper(btrim(coalesce(nullif(l.unit,''),nullif(l.uom,''),'UNSPECIFIED'))),\n    bc.status\n  into\n    v_internal_order_id,\n    v_source_order_key,\n    v_source_line_id,\n    v_commercial_sku_code,\n    v_commercial_product_name,\n    v_ordered_quantity,\n    v_ordered_unit,\n    v_source_line_status\n  from public.v_ecoflow_ordermentum_order_lines l\n  join public.ecoflow_ordermentum_internal_orders io\n    on io.source_provider = 'ORDERMENTUM'\n   and io.external_order_id = l.external_order_id\n  left join public.ecoflow_sku_barcode_confirmations bc\n    on bc.provider='ORDERMENTUM'\n   and bc.external_sku_code=l.sku\n  where l.external_order_id = btrim(p_external_order_id)\n""",
          )

          replace_exact(
              migration,
              """  if v_internal_order_id is null then\n    raise exception 'FULFILMENT_INTERNALISED_SOURCE_LINE_NOT_FOUND: %:%',\n      btrim(p_external_order_id),btrim(p_source_order_line_id);\n  end if;\n  if coalesce(v_ordered_quantity,0) <= 0 then\n""",
              """  if v_internal_order_id is null then\n    raise exception 'FULFILMENT_INTERNALISED_SOURCE_LINE_NOT_FOUND: %:%',\n      btrim(p_external_order_id),btrim(p_source_order_line_id);\n  end if;\n  if v_source_line_status='SERVICE_ITEM' then\n    raise exception 'FULFILMENT_SERVICE_LINE_NOT_PHYSICAL: %:%',\n      btrim(p_external_order_id),btrim(p_source_order_line_id);\n  end if;\n  if coalesce(v_ordered_quantity,0) <= 0 then\n""",
          )

          replace_exact(
              migration,
              """revoke all on table analytics.fact_order_line\n  from public,anon,authenticated;\nrevoke all on table analytics.fact_fulfilment_line\n  from public,anon,authenticated;\ngrant all on table analytics.fact_order_line to service_role;\ngrant all on table analytics.fact_fulfilment_line to service_role;\ngrant usage,select on all sequences in schema analytics to service_role;\n""",
              """revoke all on table analytics.fact_order_line\n  from public,anon,authenticated,service_role;\nrevoke all on table analytics.fact_fulfilment_line\n  from public,anon,authenticated,service_role;\ngrant select on table analytics.fact_order_line to service_role;\ngrant select on table analytics.fact_fulfilment_line to service_role;\n""",
          )

          replace_exact(
              migration,
              """          jsonb_build_array(\n            l.external_order_id,l.line_id,l.sku,l.name,l.quantity,l.unit,l.uom,\n            l.price,l.subtotal,l.gst,l.tax,l.total,\n            r.status,r.payment_status,io.status,io.account_release_status,\n            io.warehouse_gate_status,r.external_updated_at,r.last_synced_at\n          )::text,\n""",
              """          jsonb_build_array(\n            l.external_order_id,\n            l.line_id,\n            coalesce(io.external_order_number,io.order_number,l.order_number),\n            coalesce(io.invoice_number,l.invoice_number),\n            case\n              when coalesce(to_jsonb(r)->>'delivery_date','')\n                ~ '^[0-9]{4}-[0-9]{2}-[0-9]{2}'\n                then left(to_jsonb(r)->>'delivery_date',10)::date\n              else null\n            end,\n            r.external_created_at,\n            r.external_updated_at,\n            r.status,\n            coalesce(r.payment_status,io.payment_status,io.invoice_payment_status),\n            l.sku,\n            l.name,\n            l.quantity,\n            upper(btrim(coalesce(nullif(l.unit,''),nullif(l.uom,''),'UNSPECIFIED'))),\n            l.price,\n            l.subtotal,\n            coalesce(l.gst,l.tax),\n            l.total,\n            case when bc.status='SERVICE_ITEM' then 'SERVICE' else 'STOCK' end\n          )::text,\n""",
          )

          replace_exact(
              contract,
              """  if has_table_privilege('authenticated','analytics.fact_order_line','SELECT')\n    or has_table_privilege(\n      'authenticated','analytics.fact_fulfilment_line','SELECT'\n    ) then\n    raise exception 'facts are directly browser-readable before projections';\n  end if;\n\n  if has_function_privilege(\n""",
              """  if has_table_privilege('authenticated','analytics.fact_order_line','SELECT')\n    or has_table_privilege(\n      'authenticated','analytics.fact_fulfilment_line','SELECT'\n    ) then\n    raise exception 'facts are directly browser-readable before projections';\n  end if;\n\n  if not has_table_privilege('service_role','analytics.fact_order_line','SELECT')\n    or not has_table_privilege(\n      'service_role','analytics.fact_fulfilment_line','SELECT'\n    )\n    or has_table_privilege('service_role','analytics.fact_order_line','INSERT')\n    or has_table_privilege('service_role','analytics.fact_order_line','UPDATE')\n    or has_table_privilege('service_role','analytics.fact_order_line','DELETE')\n    or has_table_privilege('service_role','analytics.fact_order_line','TRUNCATE')\n    or has_table_privilege(\n      'service_role','analytics.fact_fulfilment_line','INSERT'\n    )\n    or has_table_privilege(\n      'service_role','analytics.fact_fulfilment_line','UPDATE'\n    )\n    or has_table_privilege(\n      'service_role','analytics.fact_fulfilment_line','DELETE'\n    )\n    or has_table_privilege(\n      'service_role','analytics.fact_fulfilment_line','TRUNCATE'\n    ) then\n    raise exception 'service role can bypass the controlled fact refresh';\n  end if;\n\n  if has_function_privilege(\n""",
          )

          replace_exact(
              contract,
              """insert into public.skus(id,sku_code,display_name)\nvalues\n  (\n    '50000000-0000-0000-0000-000000000001',\n    'BRAND-A-GLOVE-M-BLK','Brand A Medium Black Gloves'\n  ),\n  (\n    '50000000-0000-0000-0000-000000000002',\n    'BRAND-B-GLOVE-M-BLK','Brand B Medium Black Gloves'\n  );\n\ncreate temporary table pg_temp.ecoflow_fulfilment_test_results(\n""",
              """insert into public.skus(id,sku_code,display_name)\nvalues\n  (\n    '50000000-0000-0000-0000-000000000001',\n    'BRAND-A-GLOVE-M-BLK','Brand A Medium Black Gloves'\n  ),\n  (\n    '50000000-0000-0000-0000-000000000002',\n    'BRAND-B-GLOVE-M-BLK','Brand B Medium Black Gloves'\n  );\n\ninsert into public.om_order_items(\n  id,order_id,sku,name,quantity,unit,price,subtotal,gst,total\n)\nvalues(\n  '30000000-0000-0000-0000-000000000002',\n  '20000000-0000-0000-0000-000000000001',\n  'DELIVERY-FEE','Delivery Fee',1,'Each',5,5,0.50,5.50\n);\n\ninsert into public.ecoflow_sku_barcode_confirmations(\n  provider,external_sku_code,status\n)\nvalues('ORDERMENTUM','DELIVERY-FEE','SERVICE_ITEM');\n\nset role service_role;\nselect public.ecoflow_facts_test_expect_error(\n  $sql$select * from public.ecoflow_record_order_fulfilment_allocation(\n    'pick:OM-1001:DELIVERY-FEE:invalid-physical',\n    '20000000-0000-0000-0000-000000000001',\n    '30000000-0000-0000-0000-000000000002',\n    '50000000-0000-0000-0000-000000000001',\n    1,'EACH','PRIMARY',0,null\n  )$sql$,\n  'FULFILMENT_SERVICE_LINE_NOT_PHYSICAL'\n);\nreset role;\n\ndelete from public.ecoflow_sku_barcode_confirmations\nwhere provider='ORDERMENTUM' and external_sku_code='DELIVERY-FEE';\ndelete from public.om_order_items\nwhere id='30000000-0000-0000-0000-000000000002';\n\ncreate temporary table pg_temp.ecoflow_fulfilment_test_results(\n""",
          )

          replace_exact(
              contract,
              """end;\n$first_refresh$;\n\nupdate public.om_order_items\nset price=11,subtotal=110,gst=11,total=121\n""",
              """end;\n$first_refresh$;\n\n-- Observation time alone must not manufacture a new business fact version.\nupdate public.ordermentum_raw_orders\nset last_synced_at='2026-07-29 09:30:00+09:30'\nwhere id='10000000-0000-0000-0000-000000000001';\nupdate public.ecoflow_ordermentum_internal_orders\nset last_synced_at='2026-07-29 09:30:00+09:30'\nwhere id='40000000-0000-0000-0000-000000000001';\n\nset role service_role;\nselect *\nfrom analytics.refresh_order_fulfilment_facts(\n  '2026-07-29 09:35:00+09:30'\n);\nreset role;\n\ndo $observation_only_refresh$\nbegin\n  if (\n    select count(*)\n    from analytics.fact_order_line\n    where source_order_line_key=\n      '20000000-0000-0000-0000-000000000001:30000000-0000-0000-0000-000000000001'\n  )<>1 then\n    raise exception 'observation-only sync created a false fact version';\n  end if;\n\n  if not exists(\n    select 1\n    from analytics.fact_order_line\n    where source_order_line_key=\n      '20000000-0000-0000-0000-000000000001:30000000-0000-0000-0000-000000000001'\n      and is_current\n      and last_observed_at='2026-07-29 09:35:00+09:30'\n      and source_last_synced_at='2026-07-29 09:30:00+09:30'\n  ) then\n    raise exception 'observation metadata was not advanced in place';\n  end if;\nend;\n$observation_only_refresh$;\n\nupdate public.om_order_items\nset price=11,subtotal=110,gst=11,total=121\n""",
          )

          replace_exact(
              audit,
              """  ['unit conversion gate', /FULFILMENT_UNIT_CONVERSION_REQUIRED/],\n  ['quantity ceiling', /FULFILMENT_QUANTITY_EXCEEDS_ORDERED/],\n""",
              """  ['unit conversion gate', /FULFILMENT_UNIT_CONVERSION_REQUIRED/],\n  ['service-line physical gate', /FULFILMENT_SERVICE_LINE_NOT_PHYSICAL/],\n  ['quantity ceiling', /FULFILMENT_QUANTITY_EXCEEDS_ORDERED/],\n""",
          )

          replace_exact(
              audit,
              """  ['fulfilment fact', /create table analytics\\.fact_fulfilment_line/],\n  ['current version index', /create unique index fact_order_line_one_current[\\s\\S]{0,180}where is_current/],\n""",
              """  ['fulfilment fact', /create table analytics\\.fact_fulfilment_line/],\n  ['service order fact read', /grant select on table analytics\\.fact_order_line to service_role/],\n  ['service fulfilment fact read', /grant select on table analytics\\.fact_fulfilment_line to service_role/],\n  ['current version index', /create unique index fact_order_line_one_current[\\s\\S]{0,180}where is_current/],\n""",
          )

          replace_exact(
              audit,
              """  [\n    'day state inference',\n    /from\\s+public\\.ecoflow_day_state/i,\n  ],\n]) {\n""",
              """  [\n    'day state inference',\n    /from\\s+public\\.ecoflow_day_state/i,\n  ],\n  [\n    'direct service fact writes',\n    /grant all on table analytics\\.fact_(?:order|fulfilment)_line to service_role/,\n  ],\n  [\n    'broad analytics sequence grant',\n    /grant usage,select on all sequences in schema analytics to service_role/,\n  ],\n  [\n    'observation time in business version hash',\n    /jsonb_build_array\\([\\s\\S]{0,1200}last_synced_at[\\s\\S]{0,120}\\)::text/,\n  ],\n]) {\n""",
          )

          replace_exact(
              audit,
              """assert.equal(checks.length, 27);\nconsole.log(`Order/fulfilment fact static audit passed (${checks.length}/${checks.length}).`);\n""",
              """assert.equal(checks.length, 30);\nconsole.log(`Order/fulfilment fact static audit passed (${checks.length}/${checks.length}).`);\n""",
          )
          PY

          git fetch origin main --depth=1
          git show FETCH_HEAD:.github/workflows/repository-hygiene.yml \
            > .github/workflows/repository-hygiene.yml

          git diff --check
          git config user.name 'EcoFlow Release Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add \
            supabase/migrations/20260729090000_order_fulfilment_facts.sql \
            scripts/order-fulfilment-facts-contract-test.sql \
            scripts/audit-order-fulfilment-facts.mjs \
            .github/workflows/repository-hygiene.yml

          if git diff --cached --quiet; then
            echo 'Semantic hardening and workflow cleanup are already present.'
            exit 0
          fi

          git commit -m 'Harden order fulfilment fact semantics'
          git push origin HEAD:${{ github.head_ref }}
