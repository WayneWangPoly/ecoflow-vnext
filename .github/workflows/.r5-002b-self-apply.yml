name: R5-002B self apply

on:
  push:
    branches:
      - 'agent/unleashed/r5-002b-classification-recovery'

permissions:
  contents: write

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, '[r5-002b-applied]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply reviewed R5-002B patch
        run: |
          git apply --check scripts/.r5-002b-self-apply.patch
          git apply scripts/.r5-002b-self-apply.patch
          rm scripts/.r5-002b-self-apply.patch
          rm .github/workflows/.r5-002b-self-apply.yml
      - name: Commit branch implementation
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'ECOFLOW-R5-002B classification repair and dormant R2 [r5-002b-applied]'
          git push origin HEAD:${GITHUB_REF_NAME}
