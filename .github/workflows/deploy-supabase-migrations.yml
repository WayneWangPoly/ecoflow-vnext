name: Deploy Supabase migrations

on:
  workflow_dispatch:
    inputs:
      expected_main_sha:
        description: 'Exact protected main SHA authorized for production deployment'
        required: true
        type: string
      confirmation:
        description: 'Type DEPLOY_SUPABASE_PRODUCTION to confirm production deployment authority'
        required: true
        type: string
  push:
    branches: [main]
    paths:
      - 'supabase/migrations/**'
      - 'supabase/functions/**'
      - 'scripts/run-transient-supabase-command.mjs'
      - 'scripts/normalize-supabase-production-migration-aliases.mjs'
      - 'scripts/transient-supabase-command-contract.test.mjs'
      - 'scripts/release-sync-frontend-paths.mjs'
      - 'scripts/release-sync-frontend-paths-contract.test.mjs'
      - 'scripts/supabase-deploy-gate-contract.test.mjs'
      - '.github/workflows/release-sync-authority.yml'
      - '.github/workflows/deploy-supabase-migrations.yml'

permissions:
  contents: read
  statuses: write

concurrency:
  group: ecoflow-supabase-production-migrations
  cancel-in-progress: false

env:
  SUPABASE_CLI_VERSION: 2.107.0
  SUPABASE_POOLER_HOST: aws-1-ap-southeast-2.pooler.supabase.com

jobs:
  # No-secret authority preflight. A main push is shadow-only. A manual dispatch
  # is allowed to continue toward production only when it targets the current
  # protected main SHA and carries the frozen confirmation token.
  authority:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify event authority
        shell: bash
        env:
          EXPECTED_MAIN_SHA: ${{ inputs.expected_main_sha }}
          DEPLOY_CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          set -euo pipefail
          if [ "$GITHUB_EVENT_NAME" = 'push' ]; then
            test "$GITHUB_REF" = 'refs/heads/main' || {
              echo "Shadow gate push must target protected main; got $GITHUB_REF"
              exit 1
            }
            echo 'main push accepted for shadow verification only; production deployment remains gated'
            exit 0
          fi

          test "$GITHUB_EVENT_NAME" = 'workflow_dispatch' || {
            echo "Unsupported trigger: $GITHUB_EVENT_NAME"
            exit 1
          }
          test "$GITHUB_REF" = 'refs/heads/main' || {
            echo "Production deployment must be dispatched from main; got $GITHUB_REF"
            exit 1
          }
          test -n "$EXPECTED_MAIN_SHA" || {
            echo 'expected_main_sha is required'
            exit 1
          }
          test "$EXPECTED_MAIN_SHA" = "$GITHUB_SHA" || {
            echo "Authorized SHA mismatch: expected=$EXPECTED_MAIN_SHA workflow=$GITHUB_SHA"
            exit 1
          }
          test "$DEPLOY_CONFIRMATION" = 'DEPLOY_SUPABASE_PRODUCTION' || {
            echo 'Production deployment confirmation token mismatch'
            exit 1
          }
          git fetch origin main --depth=1
          CURRENT_MAIN_SHA="$(git rev-parse origin/main)"
          test "$CURRENT_MAIN_SHA" = "$GITHUB_SHA" || {
            echo "Protected main moved after authorization: current=$CURRENT_MAIN_SHA workflow=$GITHUB_SHA"
            exit 1
          }
          echo "Exact-head production deployment authority accepted for $GITHUB_SHA"

  # Apply pending migrations to a copy of the real production schema before
  # any production write is attempted. Push-triggered runs stop after this gate.
  shadow-verify:
    needs: authority
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: production
    env:
      GH_TOKEN: ${{ github.token }}
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_REF: kauqwlzuyxcudoyognwf
      SHADOW_DB_URL: postgresql://postgres:shadow@localhost:54329/postgres
      DEPLOYMENT_STATUS_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    services:
      shadow:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: shadow
          POSTGRES_DB: postgres
        ports:
          - 54329:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - name: Publish pending migration status
        shell: bash
        run: |
          gh api --method POST "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
            -f state='pending' \
            -f context='Supabase migrations' \
            -f description='Shadow verification running; production deploy requires separate manual exact-head authority' \
            -f target_url="$DEPLOYMENT_STATUS_URL"
      - name: Checkout
        uses: actions/checkout@v4
      - name: Verify transient deployment retry contract
        run: node --test scripts/transient-supabase-command-contract.test.mjs
      - name: Verify merge/deploy gate contract
        run: node --test scripts/supabase-deploy-gate-contract.test.mjs
      - name: Require production migration read credentials
        shell: bash
        run: |
          test -n "$SUPABASE_ACCESS_TOKEN" || { echo 'Missing SUPABASE_ACCESS_TOKEN'; exit 1; }
          test -n "$SUPABASE_DB_PASSWORD" || { echo 'Missing SUPABASE_DB_PASSWORD'; exit 1; }
          test -n "$SUPABASE_PROJECT_REF" || { echo 'Missing SUPABASE_PROJECT_REF'; exit 1; }
          test -n "$SUPABASE_POOLER_HOST" || { echo 'Missing SUPABASE_POOLER_HOST'; exit 1; }
      - name: Isolate legacy SQL archives
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/ecoflow-legacy-migrations
          shopt -s nullglob
          for file in supabase/migrations/*.sql; do
            base="$(basename "$file")"
            if [[ "$base" == '20260624_remote_production_baseline.sql' ]] || [[ "$base" =~ ^[0-9]{14}_.+\.sql$ ]]; then
              continue
            fi
            mv "$file" "/tmp/ecoflow-legacy-migrations/$base"
          done
      - name: Normalize known production migration identity aliases
        run: node scripts/normalize-supabase-production-migration-aliases.mjs
      - name: Install Supabase CLI
        run: npm install --global supabase@"$SUPABASE_CLI_VERSION"
      - name: Construct IPv4 pooler database URL
        shell: bash
        run: |
          set -euo pipefail
          ENCODED_PASSWORD="$(python3 -c 'import urllib.parse, os; print(urllib.parse.quote(os.environ["SUPABASE_DB_PASSWORD"], safe=""))')"
          SUPABASE_DB_URL="postgresql://postgres.${SUPABASE_PROJECT_REF}:${ENCODED_PASSWORD}@${SUPABASE_POOLER_HOST}:5432/postgres"
          echo "::add-mask::$SUPABASE_DB_URL"
          echo "SUPABASE_DB_URL=$SUPABASE_DB_URL" >> "$GITHUB_ENV"
      - name: Compute pending migrations
        shell: bash
        run: |
          set -o pipefail
          for attempt in 1 2 3; do
            if supabase migration list --db-url "$SUPABASE_DB_URL" > /tmp/migration-list.txt 2>&1; then
              break
            fi
            echo "migration list attempt $attempt failed; retrying in 20s"
            cat /tmp/migration-list.txt
            [ "$attempt" = 3 ] && exit 1
            sleep 20
          done
          python3 - <<'PY'
          import re
          pending = []
          for line in open('/tmp/migration-list.txt', encoding='utf-8', errors='replace'):
              cells = [cell.strip() for cell in line.split('|')]
              if len(cells) >= 2 and re.fullmatch(r'\d{14}', cells[0]) and not cells[1]:
                  pending.append(cells[0])
          open('/tmp/pending-versions.txt', 'w').write('\n'.join(pending))
          print('pending migrations:', pending or 'none')
          PY
      - name: Prepare shadow database shims
        shell: bash
        run: |
          set -euo pipefail
          psql "$SHADOW_DB_URL" -v ON_ERROR_STOP=1 <<'SQL'
          do $$
          declare r text;
          begin
            foreach r in array array['anon','authenticated','service_role','authenticator','supabase_admin','supabase_auth_admin','supabase_storage_admin','supabase_read_only_user','dashboard_user','pgbouncer'] loop
              if not exists (select 1 from pg_roles where rolname = r) then
                execute format('create role %I nologin', r);
              end if;
            end loop;
          end $$;
          create schema if not exists extensions;
          create extension if not exists pgcrypto with schema extensions;
          create extension if not exists "uuid-ossp" with schema extensions;
          do $$
          begin
            if to_regprocedure('extensions.gen_random_uuid()') is null then
              execute 'create function extensions.gen_random_uuid() returns uuid language sql volatile parallel safe as ''select pg_catalog.gen_random_uuid()''';
            end if;
            if to_regprocedure('extensions.gen_random_uuid()') is null then
              raise exception 'SHADOW_SUPABASE_UUID_HELPER_MISSING';
            end if;
          end $$;
          create schema if not exists auth;
          create schema if not exists storage;
          create schema if not exists vault;
          create schema if not exists graphql_public;
          create table if not exists auth.users (
            id uuid primary key default gen_random_uuid(),
            email text,
            raw_user_meta_data jsonb,
            created_at timestamptz default now()
          );
          create or replace function auth.uid() returns uuid language sql stable
            as $$ select nullif(current_setting('request.jwt.claim.sub', true), '')::uuid $$;
          create or replace function auth.role() returns text language sql stable
            as $$ select coalesce(nullif(current_setting('request.jwt.claim.role', true), ''), 'anon') $$;
          create or replace function auth.jwt() returns jsonb language sql stable
            as $$ select coalesce(nullif(current_setting('request.jwt.claims', true), '')::jsonb, '{}'::jsonb) $$;
          create table if not exists storage.buckets (
            id text primary key,
            name text,
            public boolean default false,
            created_at timestamptz default now(),
            updated_at timestamptz default now()
          );
          create table if not exists storage.objects (
            id uuid primary key default gen_random_uuid(),
            bucket_id text,
            name text,
            owner uuid,
            owner_id text,
            version text,
            metadata jsonb,
            created_at timestamptz default now(),
            updated_at timestamptz default now(),
            last_accessed_at timestamptz,
            path_tokens text[] generated always as (string_to_array(name, '/')) stored
          );
          create or replace function storage.foldername(name text) returns text[] language sql immutable
            as $$ select (string_to_array(name, '/'))[1:coalesce(array_length(string_to_array(name, '/'), 1), 1) - 1] $$;
          grant usage on schema auth, storage, extensions to anon, authenticated, service_role;
          alter table storage.objects enable row level security;
          SQL
      - name: Dump production schema
        shell: bash
        run: |
          set -o pipefail
          for attempt in 1 2 3; do
            if supabase db dump --db-url "$SUPABASE_DB_URL" -f /tmp/prod-schema.sql; then
              break
            fi
            echo "schema dump attempt $attempt failed; retrying in 20s"
            [ "$attempt" = 3 ] && exit 1
            sleep 20
          done
          wc -c /tmp/prod-schema.sql
      - name: Load production schema into shadow
        shell: bash
        run: |
          set +e
          psql "$SHADOW_DB_URL" -v ON_ERROR_STOP=0 -f /tmp/prod-schema.sql > /tmp/schema-load.log 2>&1
          errors=$(grep -c '^psql:.*ERROR' /tmp/schema-load.log || true)
          echo "schema load completed with $errors tolerated error line(s)"
          grep '^psql:.*ERROR' /tmp/schema-load.log | sort | uniq -c | sort -rn | head -15 || true
          exit 0
      - name: Apply pending migrations to shadow (gate)
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -s /tmp/pending-versions.txt ]; then
            echo 'No pending migrations - shadow gate passes trivially.'
            exit 0
          fi
          while IFS= read -r version; do
            file=$(ls supabase/migrations/"$version"_*.sql)
            echo "=== applying $file to shadow ==="
            psql "$SHADOW_DB_URL" -v ON_ERROR_STOP=1 --single-transaction -f "$file"
          done < /tmp/pending-versions.txt
          echo 'All pending migrations applied cleanly against the production schema copy.'

  deploy:
    needs: [authority, shadow-verify]
    if: ${{ github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    environment: production
    env:
      GH_TOKEN: ${{ github.token }}
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_REF: kauqwlzuyxcudoyognwf
      DEPLOYMENT_STATUS_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - name: Checkout authorized exact head
        uses: actions/checkout@v4
      - name: Require production migration credentials
        shell: bash
        run: |
          test -n "$SUPABASE_ACCESS_TOKEN" || { echo 'Missing SUPABASE_ACCESS_TOKEN'; exit 1; }
          test -n "$SUPABASE_DB_PASSWORD" || { echo 'Missing SUPABASE_DB_PASSWORD'; exit 1; }
          test -n "$SUPABASE_PROJECT_REF" || { echo 'Missing SUPABASE_PROJECT_REF'; exit 1; }
          test -n "$SUPABASE_POOLER_HOST" || { echo 'Missing SUPABASE_POOLER_HOST'; exit 1; }
      - name: Isolate legacy SQL archives
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/ecoflow-legacy-migrations
          shopt -s nullglob
          for file in supabase/migrations/*.sql; do
            base="$(basename "$file")"
            if [[ "$base" == '20260624_remote_production_baseline.sql' ]] || [[ "$base" =~ ^[0-9]{14}_.+\.sql$ ]]; then
              continue
            fi
            mv "$file" "/tmp/ecoflow-legacy-migrations/$base"
          done
          echo 'Deployable migration files:'
          for file in supabase/migrations/*.sql; do
            base="$(basename "$file")"
            if [[ "$base" != '20260624_remote_production_baseline.sql' ]] && [[ ! "$base" =~ ^[0-9]{14}_.+\.sql$ ]]; then
              echo "Unexpected active migration filename: $base"
              exit 1
            fi
            echo "  $base"
          done
          test -f supabase/migrations/20260624_remote_production_baseline.sql
          archived_count="$(find /tmp/ecoflow-legacy-migrations -maxdepth 1 -type f -name '*.sql' | wc -l | tr -d ' ')"
          echo "Legacy SQL archives excluded from deployment: $archived_count"
      - name: Normalize known production migration identity aliases
        run: node scripts/normalize-supabase-production-migration-aliases.mjs
      - name: Install Supabase CLI
        run: npm install --global supabase@"$SUPABASE_CLI_VERSION"
      - name: Link production project with transient retry
        shell: bash
        run: |
          node scripts/run-transient-supabase-command.mjs \
            --label 'Link production project' \
            --log supabase-migration-deploy.log \
            --attempts 5 \
            --base-delay-ms 20000 \
            --max-delay-ms 120000 \
            -- supabase link --project-ref "$SUPABASE_PROJECT_REF" --password "$SUPABASE_DB_PASSWORD"
      - name: Verify linked production project
        shell: bash
        run: |
          set -euo pipefail
          test -s supabase/.temp/project-ref || {
            echo 'Supabase CLI did not generate linked project metadata.'
            exit 1
          }
          LINKED_PROJECT_REF="$(tr -d '[:space:]' < supabase/.temp/project-ref)"
          test "$LINKED_PROJECT_REF" = "$SUPABASE_PROJECT_REF" || {
            echo "Project ref mismatch: linked=$LINKED_PROJECT_REF expected=$SUPABASE_PROJECT_REF"
            exit 1
          }
      - name: Construct IPv4 pooler database URL
        shell: bash
        run: |
          set -euo pipefail
          ENCODED_PASSWORD="$(python3 -c 'import urllib.parse, os; print(urllib.parse.quote(os.environ["SUPABASE_DB_PASSWORD"], safe=""))')"
          SUPABASE_DB_URL="postgresql://postgres.${SUPABASE_PROJECT_REF}:${ENCODED_PASSWORD}@${SUPABASE_POOLER_HOST}:5432/postgres"
          echo "::add-mask::$SUPABASE_DB_URL"
          echo "SUPABASE_DB_URL=$SUPABASE_DB_URL" >> "$GITHUB_ENV"
      - name: Inspect migration history
        shell: bash
        run: |
          set -o pipefail
          for attempt in 1 2 3; do
            if supabase migration list --db-url "$SUPABASE_DB_URL" 2>&1 | tee -a supabase-migration-deploy.log; then
              exit 0
            fi
            echo "migration list attempt $attempt failed; retrying in 20s" | tee -a supabase-migration-deploy.log
            [ "$attempt" = 3 ] && exit 1
            sleep 20
          done
      - name: Preview pending migrations
        shell: bash
        run: |
          set -o pipefail
          for attempt in 1 2 3; do
            if supabase db push --db-url "$SUPABASE_DB_URL" --include-all --dry-run 2>&1 | tee -a supabase-migration-deploy.log; then
              exit 0
            fi
            echo "db push dry-run attempt $attempt failed; retrying in 20s" | tee -a supabase-migration-deploy.log
            [ "$attempt" = 3 ] && exit 1
            sleep 20
          done
      - name: Apply pending migrations
        shell: bash
        run: |
          set -o pipefail
          for attempt in 1 2 3; do
            if supabase db push --db-url "$SUPABASE_DB_URL" --include-all --yes 2>&1 | tee -a supabase-migration-deploy.log; then
              exit 0
            fi
            echo "db push attempt $attempt failed; retrying in 20s" | tee -a supabase-migration-deploy.log
            [ "$attempt" = 3 ] && exit 1
            sleep 20
          done
      - name: Deploy Ordermentum sync trigger with transient retry
        shell: bash
        run: |
          node scripts/run-transient-supabase-command.mjs \
            --label 'Deploy trigger-ordermentum-sync' \
            --log supabase-migration-deploy.log \
            --attempts 5 --base-delay-ms 20000 --max-delay-ms 120000 \
            -- supabase functions deploy trigger-ordermentum-sync --project-ref "$SUPABASE_PROJECT_REF"
      - name: Deploy route-start customer notification with transient retry
        shell: bash
        run: |
          node scripts/run-transient-supabase-command.mjs \
            --label 'Deploy notify-route-start' \
            --log supabase-migration-deploy.log \
            --attempts 5 --base-delay-ms 20000 --max-delay-ms 120000 \
            -- supabase functions deploy notify-route-start --project-ref "$SUPABASE_PROJECT_REF"
      - name: Deploy delivery notification dispatch with transient retry
        shell: bash
        run: |
          node scripts/run-transient-supabase-command.mjs \
            --label 'Deploy delivery-notification-dispatch' \
            --log supabase-migration-deploy.log \
            --attempts 5 --base-delay-ms 20000 --max-delay-ms 120000 \
            -- supabase functions deploy delivery-notification-dispatch --project-ref "$SUPABASE_PROJECT_REF"
      - name: Deploy statement dispatch with transient retry
        shell: bash
        run: |
          node scripts/run-transient-supabase-command.mjs \
            --label 'Deploy statement-dispatch' \
            --log supabase-migration-deploy.log \
            --attempts 5 --base-delay-ms 20000 --max-delay-ms 120000 \
            -- supabase functions deploy statement-dispatch --project-ref "$SUPABASE_PROJECT_REF"
      - name: Deploy storage retention with transient retry
        shell: bash
        run: |
          node scripts/run-transient-supabase-command.mjs \
            --label 'Deploy storage-retention' \
            --log supabase-migration-deploy.log \
            --attempts 5 --base-delay-ms 20000 --max-delay-ms 120000 \
            -- supabase functions deploy storage-retention --project-ref "$SUPABASE_PROJECT_REF"
      - name: Deploy Unleashed read-only sync trigger with transient retry
        shell: bash
        run: |
          node scripts/run-transient-supabase-command.mjs \
            --label 'Deploy trigger-unleashed-readonly-sync' \
            --log supabase-migration-deploy.log \
            --attempts 5 --base-delay-ms 20000 --max-delay-ms 120000 \
            -- supabase functions deploy trigger-unleashed-readonly-sync --project-ref "$SUPABASE_PROJECT_REF"
      - name: Deploy Unleashed master-data migration trigger with transient retry
        shell: bash
        run: |
          node scripts/run-transient-supabase-command.mjs \
            --label 'Deploy trigger-unleashed-master-migration' \
            --log supabase-migration-deploy.log \
            --attempts 5 --base-delay-ms 20000 --max-delay-ms 120000 \
            -- supabase functions deploy trigger-unleashed-master-migration --project-ref "$SUPABASE_PROJECT_REF"
      - name: Upload Supabase deployment log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: supabase-production-deploy-log
          path: supabase-migration-deploy.log
          if-no-files-found: warn
          retention-days: 30

  # `Supabase migrations` remains a required protected-main status. On a push it
  # now means the pending migration set passed the production-schema shadow gate,
  # not that production was mutated. Production application requires a separate
  # exact-head workflow_dispatch.
  finalize:
    needs: [authority, shadow-verify, deploy]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      statuses: write
    env:
      GH_TOKEN: ${{ github.token }}
      DEPLOYMENT_STATUS_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      EVENT_NAME: ${{ github.event_name }}
      AUTH_RESULT: ${{ needs.authority.result }}
      SHADOW_RESULT: ${{ needs.shadow-verify.result }}
      DEPLOY_RESULT: ${{ needs.deploy.result }}
    steps:
      - name: Publish final migration status
        shell: bash
        run: |
          set -euo pipefail
          STATE='failure'
          DESCRIPTION='Supabase migration gate did not reach a verified state'

          if [ "$AUTH_RESULT" != 'success' ]; then
            DESCRIPTION="Authority preflight failed or was skipped (authority=$AUTH_RESULT)"
          elif [ "$SHADOW_RESULT" != 'success' ]; then
            DESCRIPTION="Shadow verification failed or was skipped (shadow=$SHADOW_RESULT)"
          elif [ "$EVENT_NAME" = 'push' ]; then
            if [ "$DEPLOY_RESULT" != 'skipped' ]; then
              DESCRIPTION="Push run violated deploy separation (deploy=$DEPLOY_RESULT)"
            else
              STATE='success'
              DESCRIPTION='Shadow verification passed; Production deployment deferred to explicit manual exact-head gate'
            fi
          elif [ "$EVENT_NAME" = 'workflow_dispatch' ] && [ "$DEPLOY_RESULT" = 'success' ]; then
            STATE='success'
            DESCRIPTION='Shadow verification passed; authorized production migration and Edge Function deployment completed'
          elif [ "$EVENT_NAME" = 'workflow_dispatch' ]; then
            DESCRIPTION="Authorized production deployment failed or was skipped (deploy=$DEPLOY_RESULT)"
          else
            DESCRIPTION="Unexpected workflow trigger '$EVENT_NAME'"
          fi

          gh api --method POST "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
            -f state="$STATE" \
            -f context='Supabase migrations' \
            -f description="$DESCRIPTION" \
            -f target_url="$DEPLOYMENT_STATUS_URL"

          echo "$DESCRIPTION"
          test "$STATE" = 'success'
