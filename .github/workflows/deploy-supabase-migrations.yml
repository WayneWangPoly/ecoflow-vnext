name: Deploy Supabase migrations

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'supabase/migrations/**'
      - 'supabase/functions/**'
      - '.github/workflows/deploy-supabase-migrations.yml'
      - 'supabase/.temp/project-ref'

permissions:
  contents: read
  statuses: write

concurrency:
  group: ecoflow-supabase-production-migrations
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: production
    env:
      GH_TOKEN: ${{ github.token }}
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_REF: kauqwlzuyxcudoyognwf
      DEPLOYMENT_STATUS_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - name: Publish pending migration status
        shell: bash
        run: |
          gh api --method POST "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
            -f state='pending' \
            -f context='Supabase migrations' \
            -f description='Production database and functions deployment is running' \
            -f target_url="$DEPLOYMENT_STATUS_URL"
      - name: Checkout
        uses: actions/checkout@v4
      - name: Require production migration credentials
        shell: bash
        run: |
          test -n "$SUPABASE_ACCESS_TOKEN" || { echo 'Missing SUPABASE_ACCESS_TOKEN'; exit 1; }
          test -n "$SUPABASE_DB_PASSWORD" || { echo 'Missing SUPABASE_DB_PASSWORD'; exit 1; }
      - name: Verify linked production project
        shell: bash
        run: |
          REPOSITORY_PROJECT_REF="$(tr -d '[:space:]' < supabase/.temp/project-ref)"
          test "$REPOSITORY_PROJECT_REF" = "$SUPABASE_PROJECT_REF" || {
            echo "Project ref mismatch: repository=$REPOSITORY_PROJECT_REF workflow=$SUPABASE_PROJECT_REF"
            exit 1
          }
      - name: Isolate legacy SQL archives
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/ecoflow-legacy-migrations
          shopt -s nullglob

          for file in supabase/migrations/*.sql; do
            base="$(basename "$file")"
            if [[ "$base" == '20260624_remote_production_baseline.sql' ]] || [[ "$base" =~ ^[0-9]{14}_.+\.sql$ ]]; then
              continue
            fi
            mv "$file" "/tmp/ecoflow-legacy-migrations/$base"
          done

          echo 'Deployable migration files:'
          for file in supabase/migrations/*.sql; do
            base="$(basename "$file")"
            if [[ "$base" != '20260624_remote_production_baseline.sql' ]] && [[ ! "$base" =~ ^[0-9]{14}_.+\.sql$ ]]; then
              echo "Unexpected active migration filename: $base"
              exit 1
            fi
            echo "  $base"
          done

          test -f supabase/migrations/20260624_remote_production_baseline.sql
          archived_count="$(find /tmp/ecoflow-legacy-migrations -maxdepth 1 -type f -name '*.sql' | wc -l | tr -d ' ')"
          echo "Legacy SQL archives excluded from deployment: $archived_count"
      - name: Install Supabase CLI
        run: npm install --global supabase@latest
      - name: Link production project
        shell: bash
        run: |
          set -o pipefail
          supabase link --project-ref "$SUPABASE_PROJECT_REF" --password "$SUPABASE_DB_PASSWORD" 2>&1 | tee supabase-migration-deploy.log
      - name: Inspect migration history
        shell: bash
        run: |
          set -o pipefail
          supabase migration list --linked --password "$SUPABASE_DB_PASSWORD" 2>&1 | tee -a supabase-migration-deploy.log
      - name: Preview pending migrations
        shell: bash
        run: |
          set -o pipefail
          supabase db push --linked --include-all --dry-run --password "$SUPABASE_DB_PASSWORD" 2>&1 | tee -a supabase-migration-deploy.log
      - name: Apply pending migrations
        shell: bash
        run: |
          set -o pipefail
          supabase db push --linked --include-all --yes --password "$SUPABASE_DB_PASSWORD" 2>&1 | tee -a supabase-migration-deploy.log
      - name: Deploy Ordermentum sync trigger
        shell: bash
        run: |
          set -o pipefail
          supabase functions deploy trigger-ordermentum-sync --project-ref "$SUPABASE_PROJECT_REF" 2>&1 | tee -a supabase-migration-deploy.log
      - name: Deploy route-start customer notification
        shell: bash
        run: |
          set -o pipefail
          supabase functions deploy notify-route-start --project-ref "$SUPABASE_PROJECT_REF" 2>&1 | tee -a supabase-migration-deploy.log
      - name: Upload Supabase deployment log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: supabase-production-deploy-log
          path: supabase-migration-deploy.log
          if-no-files-found: warn
          retention-days: 30
      - name: Publish final migration status
        if: always()
        shell: bash
        env:
          JOB_RESULT: ${{ job.status }}
        run: |
          if [ "$JOB_RESULT" = 'success' ]; then
            STATE='success'
            DESCRIPTION='Production database and Edge Functions deployed successfully'
          else
            STATE='failure'
            DESCRIPTION='Production Supabase deployment failed; inspect workflow log artifact'
          fi
          gh api --method POST "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
            -f state="$STATE" \
            -f context='Supabase migrations' \
            -f description="$DESCRIPTION" \
            -f target_url="$DEPLOYMENT_STATUS_URL"
