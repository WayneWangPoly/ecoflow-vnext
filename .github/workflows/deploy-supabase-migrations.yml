name: Deploy Supabase migrations

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'supabase/migrations/**'
      - 'supabase/functions/**'
      - '.github/workflows/deploy-supabase-migrations.yml'

permissions:
  contents: read
  statuses: write

concurrency:
  group: ecoflow-supabase-production-migrations
  cancel-in-progress: false

env:
  SUPABASE_CLI_VERSION: 2.107.0
  SUPABASE_POOLER_HOST: aws-1-ap-southeast-2.pooler.supabase.com

jobs:
  # ------------------------------------------------------------------
  # Gate: apply pending migrations to a copy of the real production
  # schema before any production write is attempted.
  # ------------------------------------------------------------------
  shadow-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    env:
      GH_TOKEN: ${{ github.token }}
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_REF: kauqwlzuyxcudoyognwf
      SHADOW_DB_URL: postgresql://postgres:shadow@localhost:54329/postgres
      DEPLOYMENT_STATUS_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    services:
      shadow:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: shadow
          POSTGRES_DB: postgres
        ports:
          - 54329:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - name: Publish pending migration status
        shell: bash
        run: |
          gh api --method POST "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
            -f state='pending' \
            -f context='Supabase migrations' \
            -f description='Shadow verification and production deployment are running' \
            -f target_url="$DEPLOYMENT_STATUS_URL"
      - name: Checkout
        uses: actions/checkout@v4
      - name: Require production migration credentials
        shell: bash
        run: |
          test -n "$SUPABASE_ACCESS_TOKEN" || { echo 'Missing SUPABASE_ACCESS_TOKEN'; exit 1; }
          test -n "$SUPABASE_DB_PASSWORD" || { echo 'Missing SUPABASE_DB_PASSWORD'; exit 1; }
          test -n "$SUPABASE_PROJECT_REF" || { echo 'Missing SUPABASE_PROJECT_REF'; exit 1; }
          test -n "$SUPABASE_POOLER_HOST" || { echo 'Missing SUPABASE_POOLER_HOST'; exit 1; }
      - name: Isolate legacy SQL archives
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/ecoflow-legacy-migrations
          shopt -s nullglob
          for file in supabase/migrations/*.sql; do
            base="$(basename "$file")"
            if [[ "$base" == '20260624_remote_production_baseline.sql' ]] || [[ "$base" =~ ^[0-9]{14}_.+\.sql$ ]]; then
              continue
            fi
            mv "$file" "/tmp/ecoflow-legacy-migrations/$base"
          done
      - name: Install Supabase CLI
        run: npm install --global supabase@"$SUPABASE_CLI_VERSION"
      - name: Construct IPv4 pooler database URL
        shell: bash
        run: |
          # supabase/.temp is generated local link state and is intentionally not
          # tracked. Construct the known session-pooler URL from governed config.
          set -euo pipefail
          ENCODED_PASSWORD="$(python3 -c 'import urllib.parse, os; print(urllib.parse.quote(os.environ["SUPABASE_DB_PASSWORD"], safe=""))')"
          SUPABASE_DB_URL="postgresql://postgres.${SUPABASE_PROJECT_REF}:${ENCODED_PASSWORD}@${SUPABASE_POOLER_HOST}:5432/postgres"
          echo "::add-mask::$SUPABASE_DB_URL"
          echo "SUPABASE_DB_URL=$SUPABASE_DB_URL" >> "$GITHUB_ENV"
      - name: Compute pending migrations
        shell: bash
        run: |
          set -o pipefail
          for attempt in 1 2 3; do
            if supabase migration list --db-url "$SUPABASE_DB_URL" > /tmp/migration-list.txt 2>&1; then
              break
            fi
            echo "migration list attempt $attempt failed; retrying in 20s"
            cat /tmp/migration-list.txt
            [ "$attempt" = 3 ] && exit 1
            sleep 20
          done
          python3 - <<'PY'
          import re
          pending = []
          for line in open('/tmp/migration-list.txt', encoding='utf-8', errors='replace'):
              cells = [cell.strip() for cell in line.split('|')]
              if len(cells) >= 2 and re.fullmatch(r'\d{14}', cells[0]) and not cells[1]:
                  pending.append(cells[0])
          open('/tmp/pending-versions.txt', 'w').write('\n'.join(pending))
          print('pending migrations:', pending or 'none')
          PY
      - name: Prepare shadow database shims
        shell: bash
        run: |
          set -euo pipefail
          psql "$SHADOW_DB_URL" -v ON_ERROR_STOP=1 <<'SQL'
          do $$
          declare r text;
          begin
            foreach r in array array['anon','authenticated','service_role','authenticator','supabase_admin','supabase_auth_admin','supabase_storage_admin','supabase_read_only_user','dashboard_user','pgbouncer'] loop
              if not exists (select 1 from pg_roles where rolname = r) then
                execute format('create role %I nologin', r);
              end if;
            end loop;
          end $$;
          create extension if not exists pgcrypto;
          create extension if not exists "uuid-ossp";
          create schema if not exists extensions;
          create schema if not exists auth;
          create schema if not exists storage;
          create schema if not exists vault;
          create schema if not exists graphql_public;
          create table if not exists auth.users (
            id uuid primary key default gen_random_uuid(),
            email text,
            raw_user_meta_data jsonb,
            created_at timestamptz default now()
          );
          create or replace function auth.uid() returns uuid language sql stable
            as $$ select nullif(current_setting('request.jwt.claim.sub', true), '')::uuid $$;
          create or replace function auth.role() returns text language sql stable
            as $$ select coalesce(nullif(current_setting('request.jwt.claim.role', true), ''), 'anon') $$;
          create or replace function auth.jwt() returns jsonb language sql stable
            as $$ select coalesce(nullif(current_setting('request.jwt.claims', true), '')::jsonb, '{}'::jsonb) $$;
          create table if not exists storage.buckets (
            id text primary key,
            name text,
            public boolean default false,
            created_at timestamptz default now(),
            updated_at timestamptz default now()
          );
          create table if not exists storage.objects (
            id uuid primary key default gen_random_uuid(),
            bucket_id text,
            name text,
            owner uuid,
            owner_id text,
            version text,
            metadata jsonb,
            created_at timestamptz default now(),
            updated_at timestamptz default now(),
            last_accessed_at timestamptz,
            path_tokens text[] generated always as (string_to_array(name, '/')) stored
          );
          create or replace function storage.foldername(name text) returns text[] language sql immutable
            as $$ select (string_to_array(name, '/'))[1:coalesce(array_length(string_to_array(name, '/'), 1), 1) - 1] $$;
          grant usage on schema auth, storage, extensions to anon, authenticated, service_role;
          alter table storage.objects enable row level security;
          SQL
      - name: Dump production schema
        shell: bash
        run: |
          set -o pipefail
          for attempt in 1 2 3; do
            if supabase db dump --db-url "$SUPABASE_DB_URL" -f /tmp/prod-schema.sql; then
              break
            fi
            echo "schema dump attempt $attempt failed; retrying in 20s"
            [ "$attempt" = 3 ] && exit 1
            sleep 20
          done
          wc -c /tmp/prod-schema.sql
      - name: Load production schema into shadow
        shell: bash
        run: |
          # Platform-managed role grant/ownership noise is tolerated here. The
          # hard gate is the pending-migration application below.
          set +e
          psql "$SHADOW_DB_URL" -v ON_ERROR_STOP=0 -f /tmp/prod-schema.sql > /tmp/schema-load.log 2>&1
          errors=$(grep -c '^psql:.*ERROR' /tmp/schema-load.log || true)
          echo "schema load completed with $errors tolerated error line(s)"
          grep '^psql:.*ERROR' /tmp/schema-load.log | sort | uniq -c | sort -rn | head -15 || true
          exit 0
      - name: Apply pending migrations to shadow (gate)
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -s /tmp/pending-versions.txt ]; then
            echo 'No pending migrations - shadow gate passes trivially.'
            exit 0
          fi
          while IFS= read -r version; do
            file=$(ls supabase/migrations/"$version"_*.sql)
            echo "=== applying $file to shadow ==="
            psql "$SHADOW_DB_URL" -v ON_ERROR_STOP=1 --single-transaction -f "$file"
          done < /tmp/pending-versions.txt
          echo 'All pending migrations applied cleanly against the production schema copy.'

  deploy:
    needs: shadow-verify
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: production
    env:
      GH_TOKEN: ${{ github.token }}
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_REF: kauqwlzuyxcudoyognwf
      DEPLOYMENT_STATUS_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Require production migration credentials
        shell: bash
        run: |
          test -n "$SUPABASE_ACCESS_TOKEN" || { echo 'Missing SUPABASE_ACCESS_TOKEN'; exit 1; }
          test -n "$SUPABASE_DB_PASSWORD" || { echo 'Missing SUPABASE_DB_PASSWORD'; exit 1; }
          test -n "$SUPABASE_PROJECT_REF" || { echo 'Missing SUPABASE_PROJECT_REF'; exit 1; }
          test -n "$SUPABASE_POOLER_HOST" || { echo 'Missing SUPABASE_POOLER_HOST'; exit 1; }
      - name: Isolate legacy SQL archives
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/ecoflow-legacy-migrations
          shopt -s nullglob
          for file in supabase/migrations/*.sql; do
            base="$(basename "$file")"
            if [[ "$base" == '20260624_remote_production_baseline.sql' ]] || [[ "$base" =~ ^[0-9]{14}_.+\.sql$ ]]; then
              continue
            fi
            mv "$file" "/tmp/ecoflow-legacy-migrations/$base"
          done
          echo 'Deployable migration files:'
          for file in supabase/migrations/*.sql; do
            base="$(basename "$file")"
            if [[ "$base" != '20260624_remote_production_baseline.sql' ]] && [[ ! "$base" =~ ^[0-9]{14}_.+\.sql$ ]]; then
              echo "Unexpected active migration filename: $base"
              exit 1
            fi
            echo "  $base"
          done
          test -f supabase/migrations/20260624_remote_production_baseline.sql
          archived_count="$(find /tmp/ecoflow-legacy-migrations -maxdepth 1 -type f -name '*.sql' | wc -l | tr -d ' ')"
          echo "Legacy SQL archives excluded from deployment: $archived_count"
      - name: Install Supabase CLI
        # Pinned: 2.109.x ships a rewritten PgClient that times out against the
        # session pooler even when raw TCP is open. 2.107.0 is proven to connect.
        run: npm install --global supabase@"$SUPABASE_CLI_VERSION"
      - name: Link production project
        shell: bash
        run: |
          set -o pipefail
          supabase link --project-ref "$SUPABASE_PROJECT_REF" --password "$SUPABASE_DB_PASSWORD" 2>&1 | tee supabase-migration-deploy.log
      - name: Verify linked production project
        shell: bash
        run: |
          set -euo pipefail
          test -s supabase/.temp/project-ref || {
            echo 'Supabase CLI did not generate linked project metadata.'
            exit 1
          }
          LINKED_PROJECT_REF="$(tr -d '[:space:]' < supabase/.temp/project-ref)"
          test "$LINKED_PROJECT_REF" = "$SUPABASE_PROJECT_REF" || {
            echo "Project ref mismatch: linked=$LINKED_PROJECT_REF expected=$SUPABASE_PROJECT_REF"
            exit 1
          }
      - name: Construct IPv4 pooler database URL
        shell: bash
        run: |
          # Do not depend on tracked supabase/.temp/pooler-url. That directory is
          # generated local state and remains excluded from Git.
          set -euo pipefail
          ENCODED_PASSWORD="$(python3 -c 'import urllib.parse, os; print(urllib.parse.quote(os.environ["SUPABASE_DB_PASSWORD"], safe=""))')"
          SUPABASE_DB_URL="postgresql://postgres.${SUPABASE_PROJECT_REF}:${ENCODED_PASSWORD}@${SUPABASE_POOLER_HOST}:5432/postgres"
          echo "::add-mask::$SUPABASE_DB_URL"
          echo "SUPABASE_DB_URL=$SUPABASE_DB_URL" >> "$GITHUB_ENV"
      - name: Inspect migration history
        shell: bash
        run: |
          set -o pipefail
          for attempt in 1 2 3; do
            if supabase migration list --db-url "$SUPABASE_DB_URL" 2>&1 | tee -a supabase-migration-deploy.log; then
              exit 0
            fi
            echo "migration list attempt $attempt failed; retrying in 20s" | tee -a supabase-migration-deploy.log
            sleep 20
          done
          exit 1
      - name: Preview pending migrations
        shell: bash
        run: |
          set -o pipefail
          for attempt in 1 2 3; do
            if supabase db push --db-url "$SUPABASE_DB_URL" --include-all --dry-run 2>&1 | tee -a supabase-migration-deploy.log; then
              exit 0
            fi
            echo "db push dry-run attempt $attempt failed; retrying in 20s" | tee -a supabase-migration-deploy.log
            sleep 20
          done
          exit 1
      - name: Apply pending migrations
        shell: bash
        run: |
          set -o pipefail
          for attempt in 1 2 3; do
            if supabase db push --db-url "$SUPABASE_DB_URL" --include-all --yes 2>&1 | tee -a supabase-migration-deploy.log; then
              exit 0
            fi
            echo "db push attempt $attempt failed; retrying in 20s" | tee -a supabase-migration-deploy.log
            sleep 20
          done
          exit 1
      - name: Deploy Ordermentum sync trigger
        shell: bash
        run: |
          set -o pipefail
          supabase functions deploy trigger-ordermentum-sync --project-ref "$SUPABASE_PROJECT_REF" 2>&1 | tee -a supabase-migration-deploy.log
      - name: Deploy route-start customer notification
        shell: bash
        run: |
          set -o pipefail
          supabase functions deploy notify-route-start --project-ref "$SUPABASE_PROJECT_REF" 2>&1 | tee -a supabase-migration-deploy.log
      - name: Deploy delivery notification dispatch
        shell: bash
        run: |
          set -o pipefail
          supabase functions deploy delivery-notification-dispatch --project-ref "$SUPABASE_PROJECT_REF" 2>&1 | tee -a supabase-migration-deploy.log
      - name: Deploy statement dispatch
        shell: bash
        run: |
          set -o pipefail
          supabase functions deploy statement-dispatch --project-ref "$SUPABASE_PROJECT_REF" 2>&1 | tee -a supabase-migration-deploy.log
      - name: Deploy storage retention
        shell: bash
        run: |
          set -o pipefail
          supabase functions deploy storage-retention --project-ref "$SUPABASE_PROJECT_REF" 2>&1 | tee -a supabase-migration-deploy.log
      - name: Upload Supabase deployment log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: supabase-production-deploy-log
          path: supabase-migration-deploy.log
          if-no-files-found: warn
          retention-days: 30

  # ------------------------------------------------------------------
  # Publish final DB state and verify any frontend changed by this commit
  # is not behind the database deployment.
  # ------------------------------------------------------------------
  finalize:
    needs: [shadow-verify, deploy]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      statuses: write
    env:
      GH_TOKEN: ${{ github.token }}
      DEPLOYMENT_STATUS_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      SHADOW_RESULT: ${{ needs.shadow-verify.result }}
      DEPLOY_RESULT: ${{ needs.deploy.result }}
    steps:
      - name: Publish final migration status
        shell: bash
        env:
          GH_TOKEN_WRITE: ${{ github.token }}
        run: |
          if [ "$SHADOW_RESULT" = 'success' ] && [ "$DEPLOY_RESULT" = 'success' ]; then
            STATE='success'
            DESCRIPTION='Shadow verification passed; production database and Edge Functions deployed'
          elif [ "$SHADOW_RESULT" != 'success' ]; then
            STATE='failure'
            DESCRIPTION='Shadow verification or production connection setup failed; inspect workflow logs'
          else
            STATE='failure'
            DESCRIPTION='Production Supabase deployment failed; inspect workflow log artifact'
          fi
          GH_TOKEN="$GH_TOKEN_WRITE" gh api --method POST "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
            -f state="$STATE" \
            -f context='Supabase migrations' \
            -f description="$DESCRIPTION" \
            -f target_url="$DEPLOYMENT_STATUS_URL"
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Verify frontend release is not behind the database
        shell: bash
        run: |
          set -euo pipefail
          if git rev-parse HEAD^ >/dev/null 2>&1; then
            CHANGED=$(git diff-tree --no-commit-id --name-only -r HEAD)
          else
            CHANGED=$(git ls-tree -r --name-only HEAD)
          fi
          if echo "$CHANGED" | grep -Eq '^(src/|public/|index\.html|package(-lock)?\.json|vite\.config\.ts|tsconfig\.json|vercel\.json)'; then
            FRONTEND_CHANGED=yes
          else
            FRONTEND_CHANGED=no
          fi
          echo "frontend files changed in this commit: $FRONTEND_CHANGED"

          if [ "$FRONTEND_CHANGED" = 'no' ]; then
            STATE='success'
            DESCRIPTION='No frontend changes in this commit; no Vercel release check is required'
          else
            VERCEL_STATE=none
            for i in $(seq 1 20); do
              RESPONSE_FILE="/tmp/vercel-status-$i.json"
              ERROR_FILE="/tmp/vercel-status-$i.err"
              if gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/status" > "$RESPONSE_FILE" 2> "$ERROR_FILE"; then
                VERCEL_STATE=$(python3 - "$RESPONSE_FILE" <<'PY'
          import json
          import sys

          path = sys.argv[1]
          try:
              payload = json.load(open(path, encoding='utf-8'))
          except Exception as error:
              print(f"invalid:{type(error).__name__}")
              raise SystemExit(0)

          statuses = payload.get('statuses') if isinstance(payload, dict) else None
          state = 'none'
          if isinstance(statuses, list):
              for status in statuses:
                  if isinstance(status, dict) and status.get('context') == 'Vercel':
                      state = str(status.get('state') or 'none')
                      break
          print(state)
          PY
                )
                if [[ "$VERCEL_STATE" == invalid:* ]]; then
                  echo "poll $i: GitHub returned a non-JSON status response; retrying"
                  head -c 200 "$RESPONSE_FILE" || true
                  VERCEL_STATE=api_error
                else
                  echo "poll $i: Vercel status = $VERCEL_STATE"
                fi
              else
                echo "poll $i: GitHub status API failed; retrying"
                head -c 300 "$ERROR_FILE" || true
                VERCEL_STATE=api_error
              fi
              case "$VERCEL_STATE" in
                success|failure|error) break ;;
              esac
              sleep 30
            done

            if [ "$VERCEL_STATE" = 'success' ]; then
              STATE='success'
              DESCRIPTION='Frontend and database deployed from the same commit'
            else
              STATE='failure'
              DESCRIPTION="DATABASE IS AHEAD OF THE FRONTEND: Vercel state '$VERCEL_STATE' while this commit changes frontend files. Redeploy the frontend before operating."
            fi
          fi

          echo "$DESCRIPTION"
          for attempt in 1 2 3; do
            if gh api --method POST "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
              -f state="$STATE" \
              -f context='Release sync' \
              -f description="$DESCRIPTION" \
              -f target_url="$DEPLOYMENT_STATUS_URL"; then
              exit 0
            fi
            echo "release status publish attempt $attempt failed; retrying in 10s"
            [ "$attempt" = 3 ] && exit 1
            sleep 10
          done
