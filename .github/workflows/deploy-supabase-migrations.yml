name: Deploy Supabase migrations

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'supabase/migrations/**'
      - '.github/workflows/deploy-supabase-migrations.yml'
      - 'supabase/.temp/project-ref'

permissions:
  contents: read

concurrency:
  group: ecoflow-supabase-production-migrations
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_REF: kauqwlzuyxcudoyognwf
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Require production migration credentials
        shell: bash
        run: |
          test -n "$SUPABASE_ACCESS_TOKEN" || { echo 'Missing SUPABASE_ACCESS_TOKEN'; exit 1; }
          test -n "$SUPABASE_DB_PASSWORD" || { echo 'Missing SUPABASE_DB_PASSWORD'; exit 1; }
      - name: Verify linked production project
        shell: bash
        run: |
          REPOSITORY_PROJECT_REF="$(tr -d '[:space:]' < supabase/.temp/project-ref)"
          test "$REPOSITORY_PROJECT_REF" = "$SUPABASE_PROJECT_REF" || {
            echo "Project ref mismatch: repository=$REPOSITORY_PROJECT_REF workflow=$SUPABASE_PROJECT_REF"
            exit 1
          }
      - name: Install Supabase CLI
        run: npm install --global supabase@latest
      - name: Link production project
        run: supabase link --project-ref "$SUPABASE_PROJECT_REF" --password "$SUPABASE_DB_PASSWORD"
      - name: Preview pending migrations
        run: supabase db push --linked --include-all --dry-run --password "$SUPABASE_DB_PASSWORD"
      - name: Apply pending migrations
        run: supabase db push --linked --include-all --yes --password "$SUPABASE_DB_PASSWORD"
