name: Apply commercial contract correction

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: apply-commercial-contract-correction
  cancel-in-progress: true

jobs:
  apply:
    if: github.head_ref == 'agent/pricing-statements-run-history'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/pricing-statements-run-history
          fetch-depth: 0
      - name: Cast statement period test date
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('scripts/commercial-controls-contract-test.sql')
          source = path.read_text()
          old = "public.ecoflow_create_statement_document('STORE-1',current_date-interval '1 month',current_date)"
          new = "public.ecoflow_create_statement_document('STORE-1',(current_date-interval '1 month')::date,current_date)"
          if old in source:
              path.write_text(source.replace(old, new, 1))
          elif new not in source:
              raise SystemExit('Expected statement period test was not found')
          PY
      - name: Commit correction
        shell: bash
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/commercial-controls-contract-test.sql
          git commit -m 'Cast statement contract period date'
          git fetch origin agent/pricing-statements-run-history
          git rebase origin/agent/pricing-statements-run-history
          git push origin HEAD:agent/pricing-statements-run-history
