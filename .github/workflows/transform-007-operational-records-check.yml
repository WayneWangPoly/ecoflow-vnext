name: TRANSFORM-007 operational records

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - main
      - 'agent/**'

permissions:
  contents: read

jobs:
  application:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Use Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Audit bounded operational records
        run: node scripts/audit-transform-007-operational-records.mjs
      - name: Audit shadow-only release gate
        run: node --test scripts/transform-007-supabase-shadow-gate.test.mjs
      - name: Frontend contract
        run: node --experimental-strip-types --test scripts/transform-007-operational-records-frontend-contract.test.mjs
      - name: TypeScript
        run: npm run typecheck
      - name: Production build
        run: npm run build

  database:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: postgres
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - name: Load operational-record fixture
        run: psql -v ON_ERROR_STOP=1 -f scripts/transform-007-operational-records-fixture.sql
      - name: Apply TRANSFORM-007A migration
        run: psql -v ON_ERROR_STOP=1 -f supabase/migrations/20260811020000_transform_007_operational_records.sql
      - name: Execute PostgreSQL contracts
        run: psql -v ON_ERROR_STOP=1 -f scripts/transform-007-operational-records-contract-test.sql
