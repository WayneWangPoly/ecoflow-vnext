name: Intelligence release readiness check

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - main
      - 'agent/phase7/**'

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Use Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Audit release readiness boundaries
        run: node scripts/audit-intel-release-readiness.mjs
      - name: Execute release readiness contract tests
        run: node --experimental-strip-types --test scripts/intel-release-readiness-contract.test.mjs
      - name: TypeScript check
        run: node ./node_modules/typescript/bin/tsc -b --pretty false
      - name: Vite production bundle
        run: node ./node_modules/vite/bin/vite.js build

  release-control:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: postgres
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - name: Load application identity fixture
        run: |
          psql -v ON_ERROR_STOP=1 -f scripts/warehouse-migration-fixture.sql
          psql -v ON_ERROR_STOP=1 -c 'create schema if not exists analytics'
      - name: Apply release control migrations
        run: |
          psql -v ON_ERROR_STOP=1 -f supabase/migrations/20260731190000_intelligence_release_control.sql
          psql -v ON_ERROR_STOP=1 -f supabase/migrations/20260731190100_intelligence_release_verification_conflict_fix.sql
      - name: Execute release control contract tests
        run: psql -v ON_ERROR_STOP=1 -f scripts/intelligence-release-control-contract-test.sql
      - name: Audit release control migration
        run: node scripts/audit-intelligence-release-control.mjs
