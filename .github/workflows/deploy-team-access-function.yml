name: Deploy team access function

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'supabase/functions/create-team-login/**'
      - '.github/workflows/deploy-team-access-function.yml'

permissions:
  contents: read
  statuses: write

concurrency:
  group: ecoflow-team-access-function-production
  cancel-in-progress: false

env:
  SUPABASE_CLI_VERSION: 2.107.0
  SUPABASE_PROJECT_REF: kauqwlzuyxcudoyognwf

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    env:
      GH_TOKEN: ${{ github.token }}
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      STATUS_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - name: Publish pending status
        shell: bash
        run: |
          gh api --method POST "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
            -f state='pending' \
            -f context='Team access function' \
            -f description='Deploying direct account and password controls' \
            -f target_url="$STATUS_URL"

      - name: Checkout
        uses: actions/checkout@v4

      - name: Require deployment credentials
        shell: bash
        run: |
          test -n "$SUPABASE_ACCESS_TOKEN" || { echo 'Missing SUPABASE_ACCESS_TOKEN'; exit 1; }
          test "$(tr -d '[:space:]' < supabase/.temp/project-ref)" = "$SUPABASE_PROJECT_REF" || {
            echo 'Supabase project reference mismatch'
            exit 1
          }

      - name: Install Supabase CLI
        run: npm install --global supabase@"$SUPABASE_CLI_VERSION"

      - name: Deploy create-team-login
        shell: bash
        run: |
          set -o pipefail
          supabase functions deploy create-team-login \
            --project-ref "$SUPABASE_PROJECT_REF" \
            2>&1 | tee team-access-function-deploy.log

      - name: Upload deployment log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: team-access-function-deploy-log
          path: team-access-function-deploy.log
          if-no-files-found: warn
          retention-days: 30

      - name: Publish final status
        if: always()
        shell: bash
        env:
          JOB_RESULT: ${{ job.status }}
        run: |
          if [ "$JOB_RESULT" = 'success' ]; then
            STATE='success'
            DESCRIPTION='Direct account and password controls deployed'
          else
            STATE='failure'
            DESCRIPTION='Team access function deployment failed'
          fi
          gh api --method POST "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
            -f state="$STATE" \
            -f context='Team access function' \
            -f description="$DESCRIPTION" \
            -f target_url="$STATUS_URL"
