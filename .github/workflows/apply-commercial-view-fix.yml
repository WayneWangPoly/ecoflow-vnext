name: Apply commercial view permission correction

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: apply-commercial-view-correction
  cancel-in-progress: true

jobs:
  apply:
    if: github.head_ref == 'agent/pricing-statements-run-history'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/pricing-statements-run-history
          fetch-depth: 0
      - name: Restrict live statement projection by application role
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('supabase/migrations/20260711190000_commercial_controls.sql')
          source = path.read_text()
          old_header = "create or replace view public.v_ecoflow_accounts_live_statement_lines\nwith (security_invoker=true)\nas"
          new_header = "create or replace view public.v_ecoflow_accounts_live_statement_lines\nas"
          old_tail = "from base b;\n\ngrant select on public.v_ecoflow_accounts_live_statement_lines to authenticated;"
          new_tail = "from base b\nwhere public.ecoflow_active_app_role() in ('OWNER','ADMIN','ACCOUNT');\n\ngrant select on public.v_ecoflow_accounts_live_statement_lines to authenticated;"
          if old_header in source:
              source = source.replace(old_header, new_header, 1)
          elif new_header not in source:
              raise SystemExit('Expected live statement view header was not found')
          if old_tail in source:
              source = source.replace(old_tail, new_tail, 1)
          elif new_tail not in source:
              raise SystemExit('Expected live statement view tail was not found')
          path.write_text(source)
          PY
      - name: Commit correction
        shell: bash
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add supabase/migrations/20260711190000_commercial_controls.sql
          git commit -m 'Secure Accounts live balance projection'
          git fetch origin agent/pricing-statements-run-history
          git rebase origin/agent/pricing-statements-run-history
          git push origin HEAD:agent/pricing-statements-run-history
