name: Chat Ordermentum auth gate correction

on:
  push:
    branches:
      - agent/platform/ordermentum-auth-001-transport-guard
    paths:
      - 'scripts/chat-ordermentum-auth-gate-fix.mjs'
      - 'scripts/ordermentum-api-origin-guard.test.mjs'
      - '.github/workflows/chat-ordermentum-auth-gate-fix.yml'

permissions:
  contents: write

jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/platform/ordermentum-auth-001-transport-guard
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Apply bounded auth gate correction
        run: node scripts/chat-ordermentum-auth-gate-fix.mjs
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Verify corrected transport contracts
        run: |
          node --check scripts/ordermentum-auth.mjs
          node --check scripts/ordermentum-sync-common.mjs
          node --check scripts/ordermentum-master-data-common.mjs
          node --check scripts/ordermentum-full-sync-core.mjs
          node --check scripts/ordermentum-master-data-sync.mjs
          node --check scripts/ordermentum-invoice-detail-sync.mjs
          node --check scripts/ordermentum-api-origin-guard-operational.test.mjs
          node --test scripts/ordermentum-api-origin-guard*.test.mjs
      - name: Diff hygiene
        run: git diff --check
      - name: Commit verified implementation only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            scripts/ordermentum-auth.mjs \
            scripts/ordermentum-sync-common.mjs \
            scripts/ordermentum-master-data-common.mjs \
            scripts/ordermentum-full-sync-core.mjs \
            scripts/ordermentum-master-data-sync.mjs \
            scripts/ordermentum-invoice-detail-sync.mjs
          git diff --cached --check
          git commit -m 'fix: close Ordermentum auth mode bypass'
          git push origin HEAD:agent/platform/ordermentum-auth-001-transport-guard
