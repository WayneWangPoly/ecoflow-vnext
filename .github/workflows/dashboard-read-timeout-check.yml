name: Dashboard read timeout hardening

on:
  pull_request:
    branches: [main]
    paths:
      - 'src/features/dashboard/DashboardPage.tsx'
      - 'src/data/repositories/dashboardReadiness.ts'
      - 'scripts/project-ordermentum-raw-orders.mjs'
      - 'scripts/audit-dashboard-read-timeout-hardening.mjs'
      - 'supabase/migrations/20260805225500_dashboard_read_timeout_hardening.sql'
      - '.github/workflows/dashboard-read-timeout-check.yml'
  push:
    branches:
      - main
      - 'hotfix/dashboard-query-timeouts'
    paths:
      - 'src/features/dashboard/DashboardPage.tsx'
      - 'src/data/repositories/dashboardReadiness.ts'
      - 'scripts/project-ordermentum-raw-orders.mjs'
      - 'scripts/audit-dashboard-read-timeout-hardening.mjs'
      - 'supabase/migrations/20260805225500_dashboard_read_timeout_hardening.sql'
      - '.github/workflows/dashboard-read-timeout-check.yml'

permissions:
  contents: read

concurrency:
  group: dashboard-read-timeout-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bounded-dashboard-reads:
    name: Bounded dashboard reads
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Audit read boundaries
        run: node scripts/audit-dashboard-read-timeout-hardening.mjs
      - name: Check projection script syntax
        run: node --check scripts/project-ordermentum-raw-orders.mjs
      - name: TypeScript
        run: npm run typecheck
      - name: Vite production build
        run: npm run build
