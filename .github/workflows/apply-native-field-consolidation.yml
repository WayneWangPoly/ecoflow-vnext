name: Apply native field consolidation

on:
  push:
    branches:
      - agent/production-workflow-consolidation
    paths:
      - scripts/apply-native-field-consolidation.mjs
      - .github/workflows/apply-native-field-consolidation.yml

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout working branch
        uses: actions/checkout@v4
        with:
          ref: agent/production-workflow-consolidation
          fetch-depth: 0
      - name: Apply native consolidation patch
        run: node scripts/apply-native-field-consolidation.mjs
      - name: Remove one-shot patch machinery
        run: |
          rm -f scripts/apply-native-field-consolidation.mjs
          rm -f .github/workflows/apply-native-field-consolidation.yml
      - name: Commit patched source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Consolidate native POD, authenticated sync and unique box codes"
          git push origin HEAD:agent/production-workflow-consolidation
