name: Materialize INTEL-FE-004B App adoption

on:
  push:
    branches:
      - agent/frontend/INTEL-FE-004B-orders-query-surface

permissions:
  contents: write

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/frontend/INTEL-FE-004B-orders-query-surface
          fetch-depth: 0
      - name: Replace legacy Orders panel
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/app/App.tsx')
          text = path.read_text()

          import_anchor = "import { DashboardPage } from '@/features/dashboard/DashboardPage';\n"
          import_replacement = import_anchor + "import { OrdersControlPage } from '@/features/orders/OrdersControlPage';\n"
          if text.count(import_anchor) != 1:
              raise SystemExit('Dashboard import anchor was not unique')
          if "OrdersControlPage" not in text:
              text = text.replace(import_anchor, import_replacement, 1)

          old = """function OrdersPanel({ orders }: { orders: ImportedOrder[] }) {
            // Read-only: status changes only happen through release, picking and delivery actions.
            return (
              <section className=\"panel\">
                <div className=\"panel-head\"><h2>Order control</h2><span>{orders.length} orders from Ordermentum · status follows the real workflow</span></div>
                <div className=\"table-like\">
                  <div className=\"table-head\"><span>Order</span><span>Store</span><span>Tier</span><span>Status</span><span>Value</span><span>POD</span></div>
                  {orders.map((order) => (
                    <div className=\"table-row\" key={order.id}>
                      <span><strong>{order.orderNo}</strong><small>{order.invoiceNo}</small></span>
                      <span><strong>{order.store}</strong><small>{order.suburb}</small></span>
                      <span>{order.priceTier}</span>
                      <span><StatusPill status={order.status} /></span>
                      <span>{money(order.amount)}</span>
                      <span>{order.podStatus}</span>
                    </div>
                  ))}
                </div>
              </section>
            );
          }
          """
          new = """function OrdersPanel({ orders }: { orders: ImportedOrder[] }) {
            return <OrdersControlPage orders={orders} />;
          }
          """
          if text.count(old) != 1:
              raise SystemExit('Legacy OrdersPanel anchor was not unique')
          text = text.replace(old, new, 1)
          path.write_text(text)
          PY
      - name: Remove materializer and commit
        shell: bash
        run: |
          rm .github/workflows/intel-fe-004b-materialize.yml
          git config user.name "EcoFlow Frontend Agent"
          git config user.email "actions@users.noreply.github.com"
          git add src/app/App.tsx .github/workflows/intel-fe-004b-materialize.yml
          git commit -m "INTEL-FE-004B adopt Orders query surface"
          git push origin HEAD:agent/frontend/INTEL-FE-004B-orders-query-surface
