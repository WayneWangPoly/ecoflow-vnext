name: Materialize INTEL-DATA-004B wiring

on:
  push:
    branches:
      - agent/data/INTEL-DATA-004B-exception-lifecycle-ledger

permissions:
  contents: write

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/data/INTEL-DATA-004B-exception-lifecycle-ledger
      - name: Apply exact package and workflow wiring
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          package = Path('package.json')
          package_text = package.read_text()
          old_audit = 'node scripts/audit-actionable-exception-read-model.mjs"'
          new_audit = 'node scripts/audit-actionable-exception-read-model.mjs && node scripts/audit-actionable-exception-lifecycle-ledger.mjs"'
          if package_text.count(old_audit) != 1:
              raise SystemExit('INTEL_DATA_004B_PACKAGE_ANCHOR_INVALID')
          package.write_text(package_text.replace(old_audit, new_audit, 1))

          workflow = Path('.github/workflows/warehouse-productisation-check.yml')
          workflow_text = workflow.read_text()
          old_migration = '            supabase/migrations/20260730160000_actionable_exception_read_model.sql\n'
          new_migration = (
              '            supabase/migrations/20260730160000_actionable_exception_read_model.sql \\\n'
              '            supabase/migrations/20260730190000_actionable_exception_lifecycle_ledger.sql\n'
          )
          if workflow_text.count(old_migration) != 1:
              raise SystemExit('INTEL_DATA_004B_MIGRATION_ANCHOR_INVALID')
          workflow_text = workflow_text.replace(old_migration, new_migration, 1)

          old_test = '''      - name: Execute actionable exception read model tests
        shell: bash
        run: |
          set -o pipefail
          psql -v ON_ERROR_STOP=1 -f scripts/actionable-exception-read-model-contract-test.sql 2>&1 | tee -a operational-db-contract.log
'''
          new_test = old_test + '''      - name: Execute actionable exception lifecycle ledger tests
        shell: bash
        run: |
          set -o pipefail
          psql -v ON_ERROR_STOP=1 -f scripts/actionable-exception-lifecycle-ledger-contract-test.sql 2>&1 | tee -a operational-db-contract.log
'''
          if workflow_text.count(old_test) != 1:
              raise SystemExit('INTEL_DATA_004B_TEST_ANCHOR_INVALID')
          workflow.write_text(workflow_text.replace(old_test, new_test, 1))

          Path('.github/workflows/materialize-intel-data-004b.yml').unlink()
          PY
      - name: Commit materialized wiring
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add package.json .github/workflows/warehouse-productisation-check.yml .github/workflows/materialize-intel-data-004b.yml
          git commit -m "Wire exception lifecycle ledger verification"
          git push
