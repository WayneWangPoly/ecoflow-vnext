name: Commercial Promotion Wave 2 P2B canary promotion

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/commercial-promotion-wave2-p2b-canary-promotion-check.yml'
      - 'docs/engineering/work-packages/338-COMMERCIAL-WAVE2-P2B-CANARY-PROMOTION.md'
      - 'scripts/commercial-promotion-wave2-p2b-canary-promotion-contract.test.mjs'
      - 'scripts/commercial-promotion-wave2-p2b-canary-promotion-db-contract-test.sql'
      - 'src/data/repositories/commercialWave2CanaryPromotion.ts'
      - 'src/features/productIdentity/CommercialWave2CanaryPromotionCarrier.tsx'
      - 'src/features/productIdentity/commercialWave2CanaryPromotionContract.ts'
      - 'src/features/productIdentity/ProductIdentityCommissioningWithSurvey.tsx'
      - 'supabase/functions/commercial-wave2-p2b-canary-promotion/index.ts'
      - 'supabase/migrations/20260913065000_commercial_wave2_p2b_canary_promotion_carrier.sql'
  push:
    branches:
      - 'agent/product-identity/338-wave2-p2b-canary-promotion'

permissions:
  contents: read

jobs:
  contract:
    name: Exact-head P2B auth, replay and separation
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: postgres
      EXACT_BASE_SHA: 56931cb04a2ef95d5762d4445556f81b5c1a60d1
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Bind exact branch head to canonical post-P2A base
        shell: bash
        run: |
          set -euo pipefail
          test "$(git merge-base HEAD "$EXACT_BASE_SHA")" = "$EXACT_BASE_SHA"
          echo "exact_head=$(git rev-parse HEAD)"
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Exercise static P2B separation contract
        run: node --test scripts/commercial-promotion-wave2-p2b-canary-promotion-contract.test.mjs
      - name: Exercise PostgreSQL 17 P2B replay and separation contract
        run: psql -v ON_ERROR_STOP=1 -f scripts/commercial-promotion-wave2-p2b-canary-promotion-db-contract-test.sql
      - name: Keep P2A contract green
        run: node --test scripts/commercial-promotion-wave2-p2a-canary-unlock-contract.test.mjs
      - name: Typecheck
        run: npm run typecheck
      - name: Production build
        run: npm run build
      - name: Reject whitespace errors
        run: git diff --check "$EXACT_BASE_SHA"...HEAD
