name: ECOFLOW-340B-2-R2M Materialize reviewed migration

on:
  push:
    branches:
      - 'agent/unleashed/340b2-r2m-customer-site-promotion-materialization'
    paths:
      - '.github/workflows/340b2-r2m-materialize-migration.yml'

permissions:
  contents: write

jobs:
  materialize:
    name: Supabase CLI migration materialization only
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install repository-pinned Supabase CLI
        run: npm install --global supabase@"2.107.0"
      - name: Create formal migration and prove byte identity
        shell: bash
        run: |
          set -euo pipefail
          name='customer_site_wave1_promotion_authority'
          test -f scripts/customer-site-wave1-promotion-authority.sql
          test -z "$(find supabase/migrations -maxdepth 1 -type f -name "*_${name}.sql" -print -quit)" || {
            echo 'A formal R2M migration already exists; refusing duplicate materialization.'
            exit 1
          }
          supabase migration new "$name"
          migration="$(find supabase/migrations -maxdepth 1 -type f -name "*_${name}.sql" | sort | tail -n 1)"
          test -n "$migration"
          basename "$migration" | grep -Eq '^[0-9]{14}_customer_site_wave1_promotion_authority\.sql$'
          cp scripts/customer-site-wave1-promotion-authority.sql "$migration"
          cmp -s scripts/customer-site-wave1-promotion-authority.sql "$migration"
          echo "MIGRATION_PATH=$migration" >> "$GITHUB_ENV"
          echo "Materialized: $migration"
      - name: Commit generated migration only
        shell: bash
        run: |
          set -euo pipefail
          test -n "${MIGRATION_PATH:-}"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- "$MIGRATION_PATH"
          git diff --cached --name-only | grep -Fx "$MIGRATION_PATH"
          test "$(git diff --cached --name-only | wc -l | tr -d ' ')" = '1'
          git commit -m 'ECOFLOW-340B-2-R2M: materialize reviewed Supabase migration'
          git push origin HEAD:"${GITHUB_REF_NAME}"
