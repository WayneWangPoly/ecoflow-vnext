name: Export source snapshot v2

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  export:
    if: github.head_ref == 'agent/pricing-statements-run-history'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/pricing-statements-run-history
      - name: Create snapshot
        run: |
          tar --exclude=.git --exclude=node_modules -czf ../ecoflow-source.tar.gz .
          mv ../ecoflow-source.tar.gz ecoflow-source.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: ecoflow-source-snapshot-v2
          path: ecoflow-source.tar.gz
          retention-days: 1
