name: Product identity frontend check

on:
  pull_request:
    paths:
      - 'src/features/productIdentity/**'
      - 'src/data/repositories/productIdentity*.ts'
      - 'src/features/operationalRoutes/UnifiedOperationalRoutes.tsx'
      - 'src/features/navigation/OperationalAppShell.tsx'
      - 'src/features/intelligence/navigation/routeContract.ts'
      - 'src/main.tsx'
      - '.github/workflows/product-identity-frontend-check.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Product Identity route and role contract
        run: |
          set -euo pipefail
          grep -q "'/commissioning/product-identity'" src/main.tsx
          grep -q "workspace: 'product-identity'" src/features/intelligence/navigation/routeContract.ts
          grep -q "Product Identity" src/features/navigation/OperationalAppShell.tsx
          grep -q "role === 'warehouse'" src/features/operationalRoutes/UnifiedOperationalRoutes.tsx
          grep -q "role === 'driver'" src/features/operationalRoutes/UnifiedOperationalRoutes.tsx
          grep -q "const canPublish = role === 'owner' || role === 'admin'" src/features/productIdentity/ProductIdentityCommissioningWorkspace.tsx
          grep -q "Legacy barcode evidence is reference only" src/features/productIdentity/ProductIdentityCommissioningWorkspace.tsx
          grep -q "Inventory quantities were not changed" src/features/productIdentity/ProductIdentityCommissioningWorkspace.tsx
      - name: No Product Identity DOM enhancer
        run: |
          set -euo pipefail
          if grep -R -E "MutationObserver|observeBody|querySelector\(" src/features/productIdentity src/data/repositories/productIdentity*.ts; then
            echo 'Product Identity must be native React, not a DOM enhancer.' >&2
            exit 1
          fi
      - name: TypeScript
        run: npm run typecheck
      - name: Production build
        run: npm run build
