name: Commercial Promotion Wave 2 P4A readiness

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/commercial-promotion-wave2-p4a-readiness-check.yml'
      - 'scripts/commercial-promotion-wave2-p4a-readiness-contract.test.mjs'
      - 'scripts/commercial-promotion-wave2-p4a-readiness-db-contract-test.sql'
      - 'src/data/repositories/commercialWave2P4Readiness.ts'
      - 'src/features/productIdentity/CommercialWave2P4ReadinessCarrier.tsx'
      - 'src/features/productIdentity/commercialWave2P4ReadinessContract.ts'
      - 'src/features/productIdentity/ProductIdentityCommissioningWithSurvey.tsx'
      - 'supabase/migrations/20260913234000_commercial_wave2_p4a_readiness.sql'
  push:
    branches:
      - 'agent/product-identity/338-wave2-p4a-readiness'

permissions:
  contents: read

jobs:
  contract:
    name: Exact-head P4A expansion readiness contract
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: postgres
      EXACT_BASE_SHA: 88490baa22b7e2cede8f8a12fdb42087d4370e56
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Bind exact branch head to P3 production base
        shell: bash
        run: |
          set -euo pipefail
          test "$(git merge-base HEAD "$EXACT_BASE_SHA")" = "$EXACT_BASE_SHA"
          echo "exact_head=$(git rev-parse HEAD)"
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Exercise P4A static readiness-only contract
        run: node --test scripts/commercial-promotion-wave2-p4a-readiness-contract.test.mjs
      - name: Exercise PostgreSQL 17 P4A production-like readiness and fail-closed contract
        run: psql -v ON_ERROR_STOP=1 -f scripts/commercial-promotion-wave2-p4a-readiness-db-contract-test.sql
      - name: Keep incumbent P3A-R4 static contract green
        run: node --test scripts/commercial-promotion-wave2-p3a-r4-master-sync-sentinel-contract.test.mjs
      - name: Keep incumbent P3A-R2 authority contract green
        run: node --test scripts/commercial-promotion-wave2-p3a-auth-read-contract.test.mjs
      - name: Keep incumbent P2B contract green
        run: node --test scripts/commercial-promotion-wave2-p2b-canary-promotion-contract.test.mjs
      - name: Typecheck
        run: npm run typecheck
      - name: Production build
        run: npm run build
      - name: Reject whitespace errors
        run: git diff --check "$EXACT_BASE_SHA"...HEAD
