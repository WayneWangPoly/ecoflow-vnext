name: Apply invoice-id schema compatibility

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: apply-invoice-id-schema-compat
  cancel-in-progress: true

jobs:
  apply:
    if: github.head_ref == 'agent/fix-commercial-invoice-id-schema'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fix-commercial-invoice-id-schema
          fetch-depth: 0
      - name: Normalise invoice identifiers at commercial boundary
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          migration = Path('supabase/migrations/20260711190000_commercial_controls.sql')
          source = migration.read_text()
          replacements = [
              (
                  "select a.internal_order_id,sum(a.allocated_amount)::numeric as allocated_amount\n  from public.ecoflow_customer_payment_allocations a group by a.internal_order_id",
                  "select a.internal_order_id::text as internal_order_id,sum(a.allocated_amount)::numeric as allocated_amount\n  from public.ecoflow_customer_payment_allocations a group by a.internal_order_id::text",
              ),
              (
                  "left join allocated a on a.internal_order_id=l.internal_order_id",
                  "left join allocated a on a.internal_order_id=l.internal_order_id::text",
              ),
              (
                  "select b.store_id,b.store_name,b.internal_order_id,b.order_number,b.invoice_number,b.order_ts,b.due_at,",
                  "select b.store_id,b.store_name,b.internal_order_id::text as internal_order_id,b.order_number,b.invoice_number,b.order_ts,b.due_at,",
              ),
          ]
          for old, new in replacements:
              if old in source:
                  source = source.replace(old, new, 1)
              elif new not in source:
                  raise SystemExit(f'Expected migration fragment not found: {old}')
          migration.write_text(source)

          fixture = Path('scripts/commercial-controls-migration-fixture.sql')
          fsource = fixture.read_text()
          fold = "store_id text,store_name text,internal_order_id text primary key,order_number text"
          fnew = "store_id text,store_name text,internal_order_id uuid primary key,order_number text"
          if fold in fsource:
              fixture.write_text(fsource.replace(fold, fnew, 1))
          elif fnew not in fsource:
              raise SystemExit('Expected invoice fixture identifier type was not found')

          contract = Path('scripts/commercial-controls-contract-test.sql')
          csource = contract.read_text()
          contract_replacements = [
              ("'ORDER-1','ORD-1'", "'aaaaaaaa-aaaa-aaaa-aaaa-aaaaaaaaaaa1','ORD-1'"),
              ("'ORDER-2','ORD-2'", "'aaaaaaaa-aaaa-aaaa-aaaa-aaaaaaaaaaa2','ORD-2'"),
              ("internal_order_id='ORDER-1'", "internal_order_id='aaaaaaaa-aaaa-aaaa-aaaa-aaaaaaaaaaa1'"),
              ("internal_order_id='ORDER-2'", "internal_order_id='aaaaaaaa-aaaa-aaaa-aaaa-aaaaaaaaaaa2'"),
          ]
          for old, new in contract_replacements:
              if old in csource:
                  csource = csource.replace(old, new, 1)
              elif new not in csource:
                  raise SystemExit(f'Expected contract fragment not found: {old}')
          contract.write_text(csource)
          PY
      - name: Commit compatibility correction
        shell: bash
        run: |
          if git diff --quiet; then
            echo 'Compatibility correction already applied.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add supabase/migrations/20260711190000_commercial_controls.sql scripts/commercial-controls-migration-fixture.sql scripts/commercial-controls-contract-test.sql
          git commit -m 'Normalise production invoice identifiers for commercial controls'
          git fetch origin agent/fix-commercial-invoice-id-schema
          git rebase origin/agent/fix-commercial-invoice-id-schema
          git push origin HEAD:agent/fix-commercial-invoice-id-schema
