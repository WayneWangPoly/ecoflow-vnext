name: Recover Supabase migration ordering

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/recover-supabase-migration-ordering.yml'

permissions:
  contents: read

concurrency:
  group: ecoflow-supabase-production-migrations
  cancel-in-progress: false

env:
  SUPABASE_CLI_VERSION: 2.107.0
  SUPABASE_POOLER_HOST: aws-1-ap-southeast-2.pooler.supabase.com

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    environment: production
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_REF: kauqwlzuyxcudoyognwf
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      ORDERMENTUM_USERNAME: ${{ secrets.ORDERMENTUM_USERNAME }}
      ORDERMENTUM_PASSWORD: ${{ secrets.ORDERMENTUM_PASSWORD }}
      ORDERMENTUM_SUPPLIER_ID: ${{ secrets.ORDERMENTUM_SUPPLIER_ID }}
      ORDERMENTUM_BASE_URL: ${{ secrets.ORDERMENTUM_BASE_URL }}
      ORDERMENTUM_API_BASE_URL: ${{ secrets.ORDERMENTUM_API_BASE_URL }}
      ORDERMENTUM_API_KEY: ${{ secrets.ORDERMENTUM_API_KEY }}
      ORDERMENTUM_ORDER_DETAIL_URL_TEMPLATE: ${{ secrets.ORDERMENTUM_ORDER_DETAIL_URL_TEMPLATE }}
      ORDERMENTUM_INVOICE_DETAIL_URL_TEMPLATE: ${{ secrets.ORDERMENTUM_INVOICE_DETAIL_URL_TEMPLATE }}
      ORDERMENTUM_FULL_SYNC_FROM: ${{ secrets.ORDERMENTUM_FULL_SYNC_FROM }}
      NODE_OPTIONS: '--dns-result-order=ipv4first'
      ORDERMENTUM_FETCH_TIMEOUT_MS: '60000'
      SUPABASE_FETCH_TIMEOUT_MS: '60000'
      ORDERMENTUM_FETCH_RETRIES: '3'

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Require production credentials
        shell: bash
        run: |
          set -euo pipefail
          for name in SUPABASE_ACCESS_TOKEN SUPABASE_DB_PASSWORD SUPABASE_URL SUPABASE_SERVICE_ROLE_KEY ORDERMENTUM_USERNAME ORDERMENTUM_PASSWORD ORDERMENTUM_SUPPLIER_ID SUPABASE_POOLER_HOST; do
            test -n "${!name}" || { echo "Missing required runtime value: $name"; exit 1; }
          done

      - name: Isolate legacy SQL archives
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/ecoflow-legacy-migrations
          shopt -s nullglob
          for file in supabase/migrations/*.sql; do
            base="$(basename "$file")"
            if [[ "$base" == '20260624_remote_production_baseline.sql' ]] || [[ "$base" =~ ^[0-9]{14}_.+\.sql$ ]]; then
              continue
            fi
            mv "$file" "/tmp/ecoflow-legacy-migrations/$base"
          done

      - name: Remove runtime work from pending schema migration copies
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def replace_or_confirm(path_name: str, old: str, new: str, forbidden: str) -> None:
              path = Path(path_name)
              source = path.read_text()
              if old in source:
                  path.write_text(source.replace(old, new))
                  print(f'Sanitised runtime migration work in {path_name}.')
                  return
              if forbidden in source:
                  raise SystemExit(f'{path_name} contains an unexpected runtime execution form: {forbidden}')
              print(f'{path_name} is already free of the targeted runtime execution.')

          replace_or_confirm(
              'supabase/migrations/20260714013000_ordermentum_complete_mirror_v1.sql',
              "select public.ecoflow_project_ordermentum_raw_invoices(10000);\nselect public.ecoflow_refresh_ui_active_order_keys();\n\nnotify pgrst, 'reload schema';",
              "-- Runtime projection and cache refresh run after deployment in bounded batches.\n\nnotify pgrst, 'reload schema';",
              'select public.ecoflow_project_ordermentum_raw_invoices(10000);',
          )

          replace_or_confirm(
              'supabase/migrations/20260714023000_commercial_source_boundary_v1.sql',
              "do $$\nbegin\n  if to_regclass('public.ecoflow_ui_active_order_keys') is not null then\n    perform public.ecoflow_refresh_ui_active_order_keys();\n  end if;\nend $$;\n\nnotify pgrst, 'reload schema';",
              "-- Active-key refresh is runtime data work and is executed only after all\n-- schema migrations install the final safe refresh function.\n\nnotify pgrst, 'reload schema';",
              'perform public.ecoflow_refresh_ui_active_order_keys();',
          )

          replace_or_confirm(
              'supabase/migrations/20260715001000_active_order_keys_safe_refresh.sql',
              "select public.ecoflow_refresh_ui_active_order_keys();\nnotify pgrst, 'reload schema';",
              "-- The complete-mirror workflow refreshes active keys after deployment.\nnotify pgrst, 'reload schema';",
              'select public.ecoflow_refresh_ui_active_order_keys();',
          )
          PY

          ! grep -R -Fq 'select public.ecoflow_project_ordermentum_raw_invoices(10000);' supabase/migrations
          ! grep -R -Fq 'perform public.ecoflow_refresh_ui_active_order_keys();' supabase/migrations
          ! grep -R -Fq 'select public.ecoflow_refresh_ui_active_order_keys();' supabase/migrations
          echo 'All deployment-time Ordermentum projection and active-key refresh calls are removed from the runner migration set.'

      - name: Install deployment tools
        shell: bash
        run: |
          set -euo pipefail
          npm install --global supabase@"$SUPABASE_CLI_VERSION"
          sudo apt-get update
          sudo apt-get install -y postgresql-client

      - name: Resolve production pooler URL
        shell: bash
        run: |
          set -euo pipefail
          ENCODED_PASSWORD="$(python3 -c 'import urllib.parse, os; print(urllib.parse.quote(os.environ["SUPABASE_DB_PASSWORD"], safe=""))')"
          SUPABASE_DB_URL="postgresql://postgres.${SUPABASE_PROJECT_REF}:${ENCODED_PASSWORD}@${SUPABASE_POOLER_HOST}:5432/postgres"
          echo "::add-mask::$SUPABASE_DB_URL"
          echo "SUPABASE_DB_URL=$SUPABASE_DB_URL" >> "$GITHUB_ENV"

      - name: Preview corrected pending migrations
        shell: bash
        run: |
          set -o pipefail
          for attempt in 1 2 3; do
            if supabase db push --db-url "$SUPABASE_DB_URL" --include-all --dry-run 2>&1 | tee /tmp/recovery-deploy.log; then
              exit 0
            fi
            echo "dry-run attempt $attempt failed; retrying in 20s" | tee -a /tmp/recovery-deploy.log
            sleep 20
          done
          exit 1

      - name: Apply corrected production migrations
        shell: bash
        run: |
          set -o pipefail
          for attempt in 1 2 3; do
            if supabase db push --db-url "$SUPABASE_DB_URL" --include-all --yes 2>&1 | tee -a /tmp/recovery-deploy.log; then
              exit 0
            fi
            echo "db push attempt $attempt failed; retrying in 20s" | tee -a /tmp/recovery-deploy.log
            sleep 20
          done
          exit 1

      - name: Verify lightweight production active-key function
        shell: bash
        run: |
          set -euo pipefail
          psql "$SUPABASE_DB_URL" -v ON_ERROR_STOP=1 -Atc \
            "select pg_get_functiondef('public.ecoflow_refresh_ui_active_order_keys()'::regprocedure);" \
            > /tmp/active-key-function.sql
          python3 - <<'PY'
          from pathlib import Path
          import re

          source = Path('/tmp/active-key-function.sql').read_text().lower()

          if 'v_ecoflow_order_operations_v' in source:
              raise SystemExit('Production active-key refresh still scans the expensive operations view.')

          required = [
              'pg_advisory_xact_lock',
              'from public.om_orders o',
              'ecoflow_ordermentum_source_presence',
              "presence.domain='order'",
              "coalesce(presence.source_status, 'present') <> 'source_missing'",
              "now() - interval '60 days'",
              'insert into public.ecoflow_ui_active_order_keys(order_key)',
              'on conflict(order_key) do nothing',
              'delete from public.ecoflow_ui_active_order_keys existing',
              'where existing.order_key is not null',
              'not exists (',
          ]
          missing = [contract for contract in required if contract not in source]
          if missing:
              raise SystemExit(f'Production active-key delta contract is incomplete: {missing}')

          if 'on conflict(order_key) do update' in source:
              raise SystemExit('Production active-key refresh rewrites unchanged cache members.')
          if re.search(r'\bupdate\s+public\.ecoflow_ui_active_order_keys\b', source):
              raise SystemExit('Production active-key refresh directly updates cache rows.')

          deletes = re.findall(
              r'delete\s+from\s+public\.ecoflow_ui_active_order_keys\b[\s\S]*?;',
              source,
          )
          if len(deletes) != 1:
              raise SystemExit(f'Expected exactly one bounded active-key prune, found {len(deletes)}.')
          prune = deletes[0]
          if not re.search(r'\bwhere\b', prune) or not re.search(r'\bnot\s+exists\s*\(', prune):
              raise SystemExit('Active-key cache DELETE is not the bounded NOT EXISTS delta prune.')

          print('Production active-key delta function is installed: lightweight source read, insert-only delta, bounded stale-key prune.')
          PY

      - name: Deploy required Edge Functions
        shell: bash
        run: |
          set -euo pipefail
          for fn in trigger-ordermentum-sync notify-route-start delivery-notification-dispatch statement-dispatch storage-retention; do
            supabase functions deploy "$fn" --project-ref "$SUPABASE_PROJECT_REF" 2>&1 | tee -a /tmp/recovery-deploy.log
          done

      - name: Publish recovery deployment summary
        if: always()
        shell: bash
        run: |
          {
            echo '## Supabase migration ordering recovery'
            echo
            echo '### Deployment tail'
            echo '```text'
            tail -n 50 /tmp/recovery-deploy.log 2>/dev/null || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload recovery deployment logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: supabase-migration-ordering-recovery-deploy-${{ github.run_id }}
          path: |
            /tmp/recovery-deploy.log
            /tmp/active-key-function.sql
          if-no-files-found: warn
          retention-days: 30

  complete-mirror:
    needs: recover
    runs-on: ubuntu-latest
    timeout-minutes: 240
    environment: production
    concurrency:
      group: ordermentum-cloud-sync
      cancel-in-progress: false
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      ORDERMENTUM_USERNAME: ${{ secrets.ORDERMENTUM_USERNAME }}
      ORDERMENTUM_PASSWORD: ${{ secrets.ORDERMENTUM_PASSWORD }}
      ORDERMENTUM_SUPPLIER_ID: ${{ secrets.ORDERMENTUM_SUPPLIER_ID }}
      ORDERMENTUM_BASE_URL: ${{ secrets.ORDERMENTUM_BASE_URL }}
      ORDERMENTUM_API_BASE_URL: ${{ secrets.ORDERMENTUM_API_BASE_URL }}
      ORDERMENTUM_API_KEY: ${{ secrets.ORDERMENTUM_API_KEY }}
      ORDERMENTUM_ORDER_DETAIL_URL_TEMPLATE: ${{ secrets.ORDERMENTUM_ORDER_DETAIL_URL_TEMPLATE }}
      ORDERMENTUM_INVOICE_DETAIL_URL_TEMPLATE: ${{ secrets.ORDERMENTUM_INVOICE_DETAIL_URL_TEMPLATE }}
      ORDERMENTUM_FULL_SYNC_FROM: ${{ secrets.ORDERMENTUM_FULL_SYNC_FROM }}
      NODE_OPTIONS: '--dns-result-order=ipv4first'
      ORDERMENTUM_FETCH_TIMEOUT_MS: '60000'
      SUPABASE_FETCH_TIMEOUT_MS: '60000'
      ORDERMENTUM_FETCH_RETRIES: '3'
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install application dependencies
        run: npm install --no-audit --no-fund

      - name: Run full-history complete mirror
        shell: bash
        run: |
          set -o pipefail
          node scripts/ordermentum-complete-mirror.mjs --scope=full_history 2>&1 | tee /tmp/ordermentum-complete-mirror.log

      - name: Publish complete mirror summary
        if: always()
        shell: bash
        run: |
          {
            echo '## Recovery complete mirror'
            echo
            echo '```text'
            tail -n 100 /tmp/ordermentum-complete-mirror.log 2>/dev/null || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload recovery complete mirror log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: supabase-migration-ordering-recovery-mirror-${{ github.run_id }}
          path: /tmp/ordermentum-complete-mirror.log
          if-no-files-found: warn
          retention-days: 30
