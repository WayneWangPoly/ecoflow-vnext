name: Apply operational stability patch

on:
  push:
    branches: [refactor/operational-stability-phase1-20260713]
    paths:
      - 'scripts/apply-operational-stability-patch.mjs'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/operational-stability-phase1-20260713
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply deterministic App stability patch
        run: node scripts/apply-operational-stability-patch.mjs
      - name: Commit patched App
        shell: bash
        run: |
          if git diff --quiet -- src/app/App.tsx; then
            echo 'App.tsx already contains the stability patch.'
            exit 0
          fi
          git config user.name 'EcoFlow Stability Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add src/app/App.tsx
          git commit -m 'Keep secure sessions and remove production demo fallback'
          git push origin HEAD:refactor/operational-stability-phase1-20260713
