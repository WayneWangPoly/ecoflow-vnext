name: Operational safety continuity check

on:
  pull_request:
    paths:
      - 'src/**'
      - 'scripts/**'
      - 'supabase/migrations/**'
      - 'package.json'
      - '.github/workflows/operational-safety-continuity.yml'
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'scripts/audit-operational-safety-continuity.mjs'
      - 'scripts/audit-release-receiving-clarity.mjs'
      - 'supabase/migrations/**'
      - 'package.json'
      - '.github/workflows/operational-safety-continuity.yml'

permissions:
  contents: write

concurrency:
  group: operational-safety-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: agent/frontend/INTEL-FE-001C-dashboard-navigation
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Materialise final package
        run: node scripts/apply-intel-fe-001c-bundle.mjs

      - name: Restore governed workflow before audits
        run: git show origin/main:.github/workflows/operational-safety-continuity.yml > .github/workflows/operational-safety-continuity.yml

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Audit operational safety and continuity
        shell: bash
        run: |
          set -o pipefail
          npm run audit:operational-safety 2>&1 | tee operational-safety-audit.log

      - name: Audit release and receiving clarity
        shell: bash
        run: |
          set -o pipefail
          npm run audit:release-receiving 2>&1 | tee release-receiving-audit.log

      - name: Audit warehouse product boundary
        shell: bash
        run: |
          set -o pipefail
          npm run audit:warehouse 2>&1 | tee operational-cross-domain-audit.log

      - name: Audit repository hygiene
        run: npm run audit:repository-hygiene

      - name: TypeScript check
        shell: bash
        run: |
          set -o pipefail
          node ./node_modules/typescript/bin/tsc --noEmit 2>&1 | tee operational-safety-build.log

      - name: Vite production bundle
        shell: bash
        run: |
          set -o pipefail
          node ./node_modules/vite/bin/vite.js build 2>&1 | tee -a operational-safety-build.log

      - name: Publish final package
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "[INTEL-FE-001C] Replace Dashboard text navigation"
          git push origin HEAD:agent/frontend/INTEL-FE-001C-dashboard-navigation

      - name: Upload safety diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: operational-safety-diagnostics
          path: |
            operational-safety-audit.log
            release-receiving-audit.log
            operational-cross-domain-audit.log
            operational-safety-build.log
          if-no-files-found: ignore
          retention-days: 7
