name: Operational safety continuity check

on:
  pull_request:
    paths:
      - 'src/**'
      - 'scripts/audit-operational-safety-continuity.mjs'
      - 'scripts/audit-release-receiving-clarity.mjs'
      - 'supabase/migrations/**'
      - 'package.json'
      - '.github/workflows/operational-safety-continuity.yml'
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'scripts/audit-operational-safety-continuity.mjs'
      - 'scripts/audit-release-receiving-clarity.mjs'
      - 'supabase/migrations/**'
      - 'package.json'
      - '.github/workflows/operational-safety-continuity.yml'

concurrency:
  group: operational-safety-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apply-intel-fe-001b-route-shell:
    if: github.event_name == 'pull_request' && github.head_ref == 'agent/frontend/INTEL-FE-001B-routed-desktop-shell'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Check out exact feature branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Apply exact App route-shell patch
        run: python3 scripts/apply-intel-fe-001b-app-patch.py

      - name: Restore read-only workflow and publish final feature diff
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --depth=1
          git checkout origin/main -- .github/workflows/operational-safety-continuity.yml
          rm scripts/apply-intel-fe-001b-app-patch.py
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/app/App.tsx .github/workflows/operational-safety-continuity.yml scripts/apply-intel-fe-001b-app-patch.py
          git commit -m '[INTEL-FE-001B] Wire canonical routes into desktop shell'
          git push origin "HEAD:${{ github.head_ref }}"

  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Audit operational safety and continuity
        shell: bash
        run: |
          set -o pipefail
          npm run audit:operational-safety 2>&1 | tee operational-safety-audit.log

      - name: Audit release and receiving clarity
        shell: bash
        run: |
          set -o pipefail
          npm run audit:release-receiving 2>&1 | tee release-receiving-audit.log

      - name: Audit warehouse product boundary
        shell: bash
        run: |
          set -o pipefail
          npm run audit:warehouse 2>&1 | tee operational-cross-domain-audit.log

      - name: TypeScript check
        shell: bash
        run: |
          set -o pipefail
          node ./node_modules/typescript/bin/tsc --noEmit 2>&1 | tee operational-safety-build.log

      - name: Vite production bundle
        shell: bash
        run: |
          set -o pipefail
          node ./node_modules/vite/bin/vite.js build 2>&1 | tee -a operational-safety-build.log

      - name: Upload safety diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: operational-safety-diagnostics
          path: |
            operational-safety-audit.log
            release-receiving-audit.log
            operational-cross-domain-audit.log
            operational-safety-build.log
          if-no-files-found: ignore
          retention-days: 7
