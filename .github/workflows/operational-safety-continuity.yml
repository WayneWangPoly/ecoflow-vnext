name: Operational safety continuity check

on:
  pull_request:
    paths:
      - 'src/**'
      - 'scripts/audit-operational-safety-continuity.mjs'
      - 'supabase/migrations/**'
      - 'package.json'
      - '.github/workflows/operational-safety-continuity.yml'
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'scripts/audit-operational-safety-continuity.mjs'
      - 'supabase/migrations/**'
      - 'package.json'
      - '.github/workflows/operational-safety-continuity.yml'

concurrency:
  group: operational-safety-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Audit operational safety and continuity
        run: npm run audit:operational-safety 2>&1 | tee operational-safety-audit.log

      - name: TypeScript and production bundle
        run: npm run build 2>&1 | tee operational-safety-build.log

      - name: Upload safety diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: operational-safety-diagnostics
          path: |
            operational-safety-audit.log
            operational-safety-build.log
          if-no-files-found: ignore
          retention-days: 7
