name: Operational safety continuity check

on:
  pull_request:
    paths:
      - 'src/**'
      - 'scripts/audit-operational-safety-continuity.mjs'
      - 'supabase/migrations/**'
      - 'package.json'
      - '.github/workflows/operational-safety-continuity.yml'
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'scripts/audit-operational-safety-continuity.mjs'
      - 'supabase/migrations/**'
      - 'package.json'
      - '.github/workflows/operational-safety-continuity.yml'

concurrency:
  group: operational-safety-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit operational safety and continuity
        run: npm run audit:operational-safety

      - name: TypeScript and production bundle
        run: npm run build
