name: Shadow extension parity check

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/deploy-supabase-migrations.yml'
      - '.github/workflows/release-sync-authority.yml'
      - '.github/workflows/shadow-extension-parity-check.yml'
      - 'scripts/supabase-deploy-gate-contract.test.mjs'
  push:
    branches:
      - 'fix/transform-005-shadow-extension-parity'
    paths:
      - '.github/workflows/deploy-supabase-migrations.yml'
      - '.github/workflows/release-sync-authority.yml'
      - '.github/workflows/shadow-extension-parity-check.yml'
      - 'scripts/supabase-deploy-gate-contract.test.mjs'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  postgres17-supabase-extension-layout:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 54329:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      PGHOST: localhost
      PGPORT: 54329
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: postgres
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Reproduce shadow UUID extension layout
        shell: bash
        run: |
          set -euo pipefail
          psql -v ON_ERROR_STOP=1 <<'SQL'
          create schema if not exists extensions;
          create extension if not exists pgcrypto with schema extensions;
          create extension if not exists "uuid-ossp" with schema extensions;
          do $$
          begin
            if to_regprocedure('extensions.gen_random_uuid()') is null then
              execute 'create function extensions.gen_random_uuid() returns uuid language sql volatile parallel safe as ''select pg_catalog.gen_random_uuid()''';
            end if;
          end $$;

          select extensions.gen_random_uuid() as pgcrypto_uuid;
          select extensions.uuid_generate_v4() as uuid_ossp_uuid;

          create table shadow_extension_contract (
            id uuid primary key default extensions.gen_random_uuid(),
            legacy_id uuid not null default extensions.uuid_generate_v4(),
            payload text not null
          );
          insert into shadow_extension_contract(payload) values ('supabase-shadow-parity');

          do $$
          declare v_count integer;
          begin
            select count(*) into v_count
            from shadow_extension_contract
            where id is not null and legacy_id is not null;
            if v_count <> 1 then
              raise exception 'SHADOW_EXTENSION_PARITY_FAILED';
            end if;
          end $$;
          SQL

      - name: Audit shadow ordering and split release authority
        shell: bash
        run: |
          set -euo pipefail
          deploy_workflow=.github/workflows/deploy-supabase-migrations.yml
          release_workflow=.github/workflows/release-sync-authority.yml
          python3 - "$deploy_workflow" "$release_workflow" <<'PY'
          import pathlib
          import sys

          deploy = pathlib.Path(sys.argv[1]).read_text()
          release = pathlib.Path(sys.argv[2]).read_text()

          schema = deploy.index('create schema if not exists extensions;')
          pgcrypto = deploy.index('create extension if not exists pgcrypto with schema extensions;')
          uuid_ossp = deploy.index('create extension if not exists "uuid-ossp" with schema extensions;')
          dump = deploy.index('- name: Dump production schema')
          if not (schema < pgcrypto < dump and schema < uuid_ossp < dump):
              raise SystemExit('Supabase extension parity must be established before production schema load')
          if "to_regprocedure('extensions.gen_random_uuid()')" not in deploy:
              raise SystemExit('Missing explicit extensions.gen_random_uuid compatibility assertion')

          deploy_job = deploy.index('\n  deploy:\n')
          before_deploy = deploy[:deploy_job]
          guarded_deploy = deploy[deploy_job:]
          if "if: ${{ github.event_name == 'workflow_dispatch' }}" not in guarded_deploy:
              raise SystemExit('Production deploy job is not workflow_dispatch-only')
          if 'supabase db push --db-url "$SUPABASE_DB_URL" --include-all --yes' in before_deploy:
              raise SystemExit('Production migration application is reachable before the guarded deploy job')
          if 'supabase functions deploy' in before_deploy:
              raise SystemExit('Edge Function deployment is reachable before the guarded deploy job')
          if 'supabase db push --db-url "$SUPABASE_DB_URL" --include-all --yes' not in guarded_deploy:
              raise SystemExit('Manual production deployment path lost migration application')
          if 'supabase functions deploy' not in guarded_deploy:
              raise SystemExit('Manual production deployment path lost Edge Function deployment')
          if 'Production deployment deferred to explicit manual exact-head gate' not in deploy:
              raise SystemExit('Push shadow success does not explicitly defer production deployment')

          if 'UPSTREAM_EVENT: ${{ github.event.workflow_run.event }}' not in release:
              raise SystemExit('Trusted Release sync authority is missing upstream event classification')
          if 'Production database unchanged; deployment deferred to explicit manual exact-head gate' not in release:
              raise SystemExit('Push-only Release sync can still imply production deployment')
          if "elif [ \"$UPSTREAM_EVENT\" != 'workflow_dispatch' ]; then" not in release:
              raise SystemExit('Release sync authority does not fail closed on unexpected trigger types')

          print('shadow extension parity and split release authority verified')
          PY
