name: Apply admin and viewer workspace hardening

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: admin-viewer-workspaces
  cancel-in-progress: true

jobs:
  apply:
    if: github.head_ref == 'agent/admin-viewer-workspaces'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout working branch
        uses: actions/checkout@v4
        with:
          ref: agent/admin-viewer-workspaces
          fetch-depth: 0
      - name: Use Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply role and workspace patch
        run: python scripts/apply-admin-viewer-workspaces.py
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Validate semantic contracts
        run: npm run audit:warehouse
      - name: TypeScript check
        run: node ./node_modules/typescript/bin/tsc -b --pretty false
      - name: Vite production bundle
        run: node ./node_modules/vite/bin/vite.js build
      - name: Commit product changes
        shell: bash
        run: |
          set -o pipefail
          {
            set -eux
            if git diff --quiet; then
              echo 'Product changes already applied.'
              exit 0
            fi
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git status --short
            git add src scripts/audit-warehouse-productisation.mjs
            git commit -m 'Harden Admin and Viewer workspace access'
            git fetch origin agent/admin-viewer-workspaces
            git rebase origin/agent/admin-viewer-workspaces
            git push --verbose origin HEAD:agent/admin-viewer-workspaces
          } 2>&1 | tee role-hardening-push.log
      - name: Upload push diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: role-hardening-push-diagnostic
          path: role-hardening-push.log
          if-no-files-found: warn
