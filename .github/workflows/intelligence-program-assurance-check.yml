name: Intelligence programme assurance check

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - main
      - 'agent/phase8/**'

permissions:
  contents: read

jobs:
  assurance:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Use Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      # Audit Phase 8 programme assurance through the permanent completion gate.
      - name: Audit Phase 8 completion gate
        run: node scripts/audit-intel-phase-8-program-assurance-gate.mjs
      - name: Execute programme assurance contract tests
        run: node --experimental-strip-types --test scripts/intel-program-assurance-contract.test.mjs
      - name: TypeScript check
        run: node ./node_modules/typescript/bin/tsc -b --pretty false
      - name: Vite production bundle
        run: node ./node_modules/vite/bin/vite.js build
      - name: Enforce Intelligence performance budgets
        run: node --experimental-strip-types scripts/audit-intel-performance-budget.mjs
      - name: Smoke canonical deep routes
        run: node --experimental-strip-types scripts/intel-route-smoke.mjs
