name: Apply INTEL-FE-001C dashboard navigation

on:
  push:
    branches:
      - agent/frontend/INTEL-FE-001C-dashboard-navigation
    paths:
      - .github/workflows/apply-intel-fe-001c-dashboard-navigation.yml
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/apply-intel-fe-001c-dashboard-navigation.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/frontend/INTEL-FE-001C-dashboard-navigation
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Apply exact patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import json

          def replace_once(text: str, old: str, new: str, label: str) -> str:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected exactly one match, found {count}")
              return text.replace(old, new, 1)

          dashboard_path = Path('src/features/dashboard/DashboardPage.tsx')
          dashboard = dashboard_path.read_text()
          dashboard = replace_once(
              dashboard,
              "import type { EcoFlowDataSet, ImportedOrder, Role } from '@/domain/types';\n",
              "import type { EcoFlowDataSet, ImportedOrder, Role } from '@/domain/types';\nimport { dashboardStageTarget, type DashboardNavigationTab } from './dashboardNavigationContract';\n",
              'dashboard contract import',
          )
          dashboard = replace_once(
              dashboard,
              "  onOpenOrders: () => void;\n",
              "  onOpenTab: (tab: DashboardNavigationTab) => void;\n",
              'dashboard callback prop',
          )
          dashboard = replace_once(
              dashboard,
              "function openSection(label: string) {\n  Array.from(document.querySelectorAll<HTMLButtonElement>('.sidebar-nav button, .desktop-mobile-nav button'))\n    .find((button) => button.textContent?.trim() === label)?.click();\n}\n",
              "",
              'legacy text navigation helper',
          )
          dashboard = replace_once(
              dashboard,
              "export function DashboardPage({ role, data, orders, snapshotReady, loading, loadError, healthNotice, onReload, onOpenOrders }: Props) {",
              "export function DashboardPage({ role, data, orders, snapshotReady, loading, loadError, healthNotice, onReload, onOpenTab }: Props) {",
              'dashboard signature',
          )
          dashboard = replace_once(
              dashboard,
              "  const stages: Array<{ key: Stage; label: string; count: number; section: string }> = [\n    { key: 'blocked', label: 'Needs action', count: groups.blocked.length, section: 'Orders' },\n    { key: 'review', label: 'Finance review', count: groups.review.length, section: role === 'account' ? 'Reconciliation' : 'Orders' },\n    { key: 'ready', label: 'Ready', count: groups.ready.length, section: 'Orders' },\n    { key: 'warehouse', label: 'In warehouse', count: groups.warehouse.length, section: 'Delivery' },\n    { key: 'route', label: 'On route', count: groups.route.length, section: 'Delivery' },\n  ];",
              "  const stages: Array<{ key: Stage; label: string; count: number; tab: DashboardNavigationTab }> = [\n    { key: 'blocked', label: 'Needs action', count: groups.blocked.length, tab: dashboardStageTarget('blocked', role) },\n    { key: 'review', label: 'Finance review', count: groups.review.length, tab: dashboardStageTarget('review', role) },\n    { key: 'ready', label: 'Ready', count: groups.ready.length, tab: dashboardStageTarget('ready', role) },\n    { key: 'warehouse', label: 'In warehouse', count: groups.warehouse.length, tab: dashboardStageTarget('warehouse', role) },\n    { key: 'route', label: 'On route', count: groups.route.length, tab: dashboardStageTarget('route', role) },\n  ];",
              'typed stage targets',
          )
          dashboard = replace_once(
              dashboard,
              'onClick={onOpenOrders}>Review orders</button>',
              "onClick={() => onOpenTab('orders')}>Review orders</button>",
              'review orders navigation',
          )
          dashboard = replace_once(
              dashboard,
              "onClick={() => openSection('Reconciliation')}>Reconciliation</button>",
              "onClick={() => onOpenTab('reconciliation')}>Reconciliation</button>",
              'reconciliation navigation',
          )
          dashboard = replace_once(
              dashboard,
              'onClick={() => openSection(stage.section)}>',
              'onClick={() => onOpenTab(stage.tab)}>',
              'stage navigation',
          )
          dashboard = replace_once(
              dashboard,
              'onClick={onOpenOrders}>View all</button>',
              "onClick={() => onOpenTab('orders')}>View all</button>",
              'view all navigation',
          )
          dashboard_path.write_text(dashboard)

          app_path = Path('src/app/App.tsx')
          app = app_path.read_text()
          app = replace_once(
              app,
              "onReload={onReload} onOpenOrders={() => setTab('orders')} />",
              "onReload={onReload} onOpenTab={setTab} />",
              'desktop shell dashboard navigation callback',
          )
          app_path.write_text(app)

          Path('src/features/dashboard/dashboardNavigationContract.ts').write_text("""import type { Role } from '@/domain/types';

export type DashboardNavigationTab = 'orders' | 'delivery' | 'reconciliation';
export type DashboardStage = 'blocked' | 'review' | 'ready' | 'warehouse' | 'route';

export function dashboardStageTarget(stage: DashboardStage, role: Role): DashboardNavigationTab {
  if (stage === 'warehouse' || stage === 'route') return 'delivery';
  if (stage === 'review' && role === 'account') return 'reconciliation';
  return 'orders';
}
""")

          Path('scripts/intel-dashboard-navigation-contract.test.mjs').write_text("""import test from 'node:test';
import assert from 'node:assert/strict';
import { dashboardStageTarget } from '../src/features/dashboard/dashboardNavigationContract.ts';

test('operational and ready stages open Orders', () => {
  assert.equal(dashboardStageTarget('blocked', 'owner'), 'orders');
  assert.equal(dashboardStageTarget('ready', 'viewer'), 'orders');
  assert.equal(dashboardStageTarget('review', 'owner'), 'orders');
});

test('Accounts finance review opens Reconciliation', () => {
  assert.equal(dashboardStageTarget('review', 'account'), 'reconciliation');
});

test('warehouse execution stages open Delivery', () => {
  assert.equal(dashboardStageTarget('warehouse', 'owner'), 'delivery');
  assert.equal(dashboardStageTarget('route', 'account'), 'delivery');
});
""")

          Path('scripts/audit-intel-dashboard-navigation.mjs').write_text("""import fs from 'node:fs';
import path from 'node:path';
import process from 'node:process';

const root = process.cwd();
function read(relativePath) {
  const absolute = path.join(root, relativePath);
  if (!fs.existsSync(absolute)) throw new Error(`INTEL_FE_001C_FILE_MISSING: ${relativePath}`);
  return fs.readFileSync(absolute, 'utf8');
}

const dashboard = read('src/features/dashboard/DashboardPage.tsx');
const app = read('src/app/App.tsx');
const contract = read('src/features/dashboard/dashboardNavigationContract.ts');
const test = read('scripts/intel-dashboard-navigation-contract.test.mjs');
const packageJson = JSON.parse(read('package.json'));

for (const banned of ['document.querySelector', 'document.querySelectorAll', '.textContent', 'openSection(']) {
  if (dashboard.includes(banned)) throw new Error(`INTEL_FE_001C_DASHBOARD_TEXT_NAVIGATION_REMAINS: ${banned}`);
}

for (const required of [
  "onOpenTab: (tab: DashboardNavigationTab) => void",
  "onClick={() => onOpenTab('orders')}>Review orders</button>",
  "onClick={() => onOpenTab('reconciliation')}>Reconciliation</button>",
  'onClick={() => onOpenTab(stage.tab)}',
  'dashboardStageTarget',
]) {
  if (!dashboard.includes(required)) throw new Error(`INTEL_FE_001C_TYPED_NAVIGATION_MISSING: ${required}`);
}

if (!app.includes('onReload={onReload} onOpenTab={setTab} />')) {
  throw new Error('INTEL_FE_001C_SHELL_CALLBACK_NOT_CONNECTED');
}
if (app.includes("onOpenOrders={() => setTab('orders')}")) {
  throw new Error('INTEL_FE_001C_OLD_DASHBOARD_CALLBACK_REMAINS');
}

for (const required of ['DashboardNavigationTab', 'DashboardStage', 'dashboardStageTarget']) {
  if (!contract.includes(required)) throw new Error(`INTEL_FE_001C_CONTRACT_MISSING: ${required}`);
}
for (const testName of [
  'operational and ready stages open Orders',
  'Accounts finance review opens Reconciliation',
  'warehouse execution stages open Delivery',
]) {
  if (!test.includes(testName)) throw new Error(`INTEL_FE_001C_TEST_MISSING: ${testName}`);
}

const auditCommand = packageJson.scripts?.['audit:intel-frontend'];
if (typeof auditCommand !== 'string'
  || !auditCommand.includes('audit-intel-dashboard-navigation.mjs')
  || !auditCommand.includes('intel-dashboard-navigation-contract.test.mjs')) {
  throw new Error('INTEL_FE_001C_PACKAGE_AUDIT_WIRING_MISSING');
}

if (fs.existsSync(path.join(root, '.github/workflows/apply-intel-fe-001c-dashboard-navigation.yml'))) {
  throw new Error('INTEL_FE_001C_TEMPORARY_PATCH_WORKFLOW_REMAINS');
}

console.log('INTEL-FE-001C dashboard navigation audit passed.');
""")

          package_path = Path('package.json')
          package_data = json.loads(package_path.read_text())
          current = package_data['scripts']['audit:intel-frontend']
          suffix = " && node scripts/audit-intel-dashboard-navigation.mjs && node --experimental-strip-types --test scripts/intel-dashboard-navigation-contract.test.mjs"
          if suffix.strip() in current:
              raise SystemExit('package audit already contains INTEL-FE-001C wiring')
          package_data['scripts']['audit:intel-frontend'] = current + suffix
          package_path.write_text(json.dumps(package_data, indent=2) + '\n')

          Path('.github/workflows/apply-intel-fe-001c-dashboard-navigation.yml').unlink()
          PY
      - name: Validate
        run: |
          npm run audit:intel-frontend
          npm run audit:repository-hygiene
          npm run audit:operational-safety
          npm run typecheck
          npm run build
          git diff --check
      - name: Commit final package
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app/App.tsx src/features/dashboard/DashboardPage.tsx src/features/dashboard/dashboardNavigationContract.ts scripts/audit-intel-dashboard-navigation.mjs scripts/intel-dashboard-navigation-contract.test.mjs package.json .github/workflows/apply-intel-fe-001c-dashboard-navigation.yml
          git commit -m "[INTEL-FE-001C] Replace Dashboard text navigation"
          git push origin HEAD:agent/frontend/INTEL-FE-001C-dashboard-navigation
