name: Agent commissioning audit patch

on:
  push:
    branches:
      - agent/global-inventory-commissioning-gate

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[COMMISSION-AUDIT-PATCHED]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/global-inventory-commissioning-gate
          fetch-depth: 0
      - name: Upgrade Today authority contract
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('scripts/audit-intel-dashboard-control-room.mjs')
          text = p.read_text()
          old = "  'buildOperationalFlow(todayOrders)',\n"
          new = "  'buildOperationalFlow(todayOrders, {',\n  'inventoryQuantityCommissioned: readiness ? inventoryQuantityCommissioned : undefined',\n"
          if text.count(old) != 1:
              raise SystemExit(f'expected one Today flow marker, found {text.count(old)}')
          text = text.replace(old, new, 1)
          anchor = "if (dashboard.includes('serverCurrentOrders} Today') || dashboard.includes('server_current_orders) as today')) {\n  throw new Error('TRANSFORM_003_CURRENT_WORKLOAD_MISREPRESENTED_AS_TODAY');\n}\n"
          extra = anchor + "if (dashboard.includes('buildOperationalFlow(todayOrders), [todayOrders]')) {\n  throw new Error('TRANSFORM_003_TODAY_COMMISSIONING_CONTEXT_MISSING');\n}\n"
          if text.count(anchor) != 1:
              raise SystemExit('Today workload guard anchor not found exactly once')
          text = text.replace(anchor, extra, 1)
          p.write_text(text)
          Path('.github/workflows/agent-commissioning-audit-patch.yml').unlink()
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/audit-intel-dashboard-control-room.mjs .github/workflows/agent-commissioning-audit-patch.yml
          git commit -m "[COMMISSION-AUDIT-PATCHED] Bind Today flow audit to commissioning authority"
          git push origin HEAD:agent/global-inventory-commissioning-gate
