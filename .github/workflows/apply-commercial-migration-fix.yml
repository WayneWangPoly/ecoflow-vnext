name: Apply commercial migration correction

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: apply-commercial-migration-correction
  cancel-in-progress: true

jobs:
  apply:
    if: github.head_ref == 'agent/pricing-statements-run-history'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/pricing-statements-run-history
          fetch-depth: 0
      - name: Qualify business-day comparison
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('supabase/migrations/20260711190000_commercial_controls.sql')
          source = path.read_text()
          old = "left join locations l on l.business_day=g.business_day and l.route_id='RUN-'||replace(g.business_day,'-','')||'-'||g.run_code;"
          new = "left join locations l on l.business_day::text=g.business_day::text and l.route_id='RUN-'||replace(g.business_day::text,'-','')||'-'||g.run_code;"
          if old in source:
              path.write_text(source.replace(old, new, 1))
          elif new not in source:
              raise SystemExit('Expected run history join was not found')
          PY
      - name: Commit correction
        shell: bash
        run: |
          if git diff --quiet; then
            echo 'Correction already applied.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add supabase/migrations/20260711190000_commercial_controls.sql
          git commit -m 'Qualify delivery run business day comparison'
          git fetch origin agent/pricing-statements-run-history
          git rebase origin/agent/pricing-statements-run-history
          git push origin HEAD:agent/pricing-statements-run-history
