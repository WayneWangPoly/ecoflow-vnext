name: TRANSFORM-006 bounded Driver data boundary wiring

on:
  push:
    branches:
      - agent/transform-006-delivery-driver
    paths:
      - scripts/transform-006-wire-route-authority.mjs

permissions:
  contents: write

jobs:
  wire:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/transform-006-delivery-driver
          fetch-depth: 0
      - name: Apply bounded Driver data boundary patch
        run: node scripts/transform-006-wire-route-authority.mjs
      - name: Verify patch hygiene
        run: git diff --check
      - name: Commit application wiring
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "EcoFlow Builder"
          git config user.email "actions@users.noreply.github.com"
          git add src/app/App.tsx
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "fix(delivery): isolate Driver from broad order views"
          git push origin HEAD:agent/transform-006-delivery-driver
