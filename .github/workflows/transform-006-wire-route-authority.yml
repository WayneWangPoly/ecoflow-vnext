name: TRANSFORM-006 wire route authority

on:
  push:
    branches:
      - agent/transform-006-delivery-driver
    paths:
      - scripts/transform-006-wire-route-authority.mjs

permissions:
  contents: write

jobs:
  wire:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/transform-006-delivery-driver
          fetch-depth: 0
      - name: Apply bounded route-authority patch
        run: node scripts/transform-006-wire-route-authority.mjs
      - name: Verify patch hygiene
        run: git diff --check
      - name: Commit bounded application wiring
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "EcoFlow Builder"
          git config user.email "actions@users.noreply.github.com"
          git add src/app/App.tsx src/app/DriverApp.tsx
          if git diff --cached --quiet; then
            echo "No wiring changes required."
            exit 0
          fi
          git commit -m "feat(delivery): wire locked route authority"
          git push origin HEAD:agent/transform-006-delivery-driver
