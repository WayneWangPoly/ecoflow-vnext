name: Governed Unleashed legacy probe retirement

on:
  workflow_dispatch:
    inputs:
      operation:
        description: Production action
        required: true
        type: choice
        default: preflight
        options:
          - preflight
          - retire_legacy_probes
      confirmation:
        description: Type RETIRE INERT UNLEASHED PROBES for the retirement action
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: ecoflow-unleashed-legacy-probe-retirement-production
  cancel-in-progress: false

env:
  SUPABASE_CLI_VERSION: 2.107.0
  SUPABASE_PROJECT_REF: kauqwlzuyxcudoyognwf
  UNLEASHED_REPLACEMENT_FUNCTION: trigger-unleashed-readonly-sync

jobs:
  governed-retirement:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      RETIREMENT_OPERATION: ${{ inputs.operation }}
      RETIREMENT_CONFIRMATION: ${{ inputs.confirmation }}
    steps:
      - name: Checkout exact workflow revision
        uses: actions/checkout@v4

      - name: Require production main and deployment credentials
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = 'refs/heads/main' || {
            echo 'Retirement workflow may run only from main.'
            exit 1
          }
          test -n "$SUPABASE_ACCESS_TOKEN" || {
            echo 'Missing SUPABASE_ACCESS_TOKEN.'
            exit 1
          }
          test "$(tr -d '[:space:]' < supabase/.temp/project-ref)" = "$SUPABASE_PROJECT_REF" || {
            echo 'Supabase project reference mismatch.'
            exit 1
          }

      - name: Install pinned Supabase CLI
        run: npm install --global supabase@"$SUPABASE_CLI_VERSION"

      - name: Capture and validate pre-retirement state
        shell: bash
        run: |
          set -euo pipefail
          supabase functions list --project-ref "$SUPABASE_PROJECT_REF" --output json > unleashed-functions-before.json
          node scripts/unleashed-readonly-retirement-state.mjs before unleashed-functions-before.json | tee unleashed-retirement-preflight.txt

      - name: Require exact destructive confirmation
        id: confirmation
        if: ${{ inputs.operation == 'retire_legacy_probes' }}
        shell: bash
        run: |
          set -euo pipefail
          test "$RETIREMENT_CONFIRMATION" = 'RETIRE INERT UNLEASHED PROBES' || {
            echo 'Exact retirement confirmation was not supplied.'
            exit 1
          }

      - name: Select exact inert functions
        if: ${{ inputs.operation == 'retire_legacy_probes' }}
        shell: bash
        run: |
          set -euo pipefail
          node scripts/unleashed-readonly-retirement-state.mjs targets unleashed-functions-before.json > unleashed-retirement-targets.txt

      - name: Retire matched legacy probes
        if: ${{ inputs.operation == 'retire_legacy_probes' }}
        shell: bash
        run: |
          set -euo pipefail
          : > unleashed-retirement-delete.log
          while IFS= read -r function_name; do
            test -n "$function_name" || continue
            case "$function_name" in
              unleashed-readonly-probe-001c|unleashed-readonly-probe-001c2|unleashed-readonly-probe-001c3)
                ;;
              *)
                echo "Refusing unexpected retirement target: $function_name" | tee -a unleashed-retirement-delete.log
                exit 1
                ;;
            esac
            echo "Retiring governed inert function: $function_name" | tee -a unleashed-retirement-delete.log
            supabase functions delete "$function_name" --project-ref "$SUPABASE_PROJECT_REF" --yes 2>&1 | tee -a unleashed-retirement-delete.log
          done < unleashed-retirement-targets.txt

      - name: Capture and validate post-retirement state
        if: ${{ always() && inputs.operation == 'retire_legacy_probes' && steps.confirmation.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          supabase functions list --project-ref "$SUPABASE_PROJECT_REF" --output json > unleashed-functions-after.json
          node scripts/unleashed-readonly-retirement-state.mjs after unleashed-functions-after.json | tee unleashed-retirement-result.txt

      - name: Upload governed retirement evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unleashed-legacy-probe-retirement-${{ github.run_id }}
          path: |
            unleashed-functions-before.json
            unleashed-functions-after.json
            unleashed-retirement-preflight.txt
            unleashed-retirement-targets.txt
            unleashed-retirement-delete.log
            unleashed-retirement-result.txt
          if-no-files-found: warn
          retention-days: 90
