name: EcoFlow Ordermentum Cloud Sync

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: 'Sync mode'
        required: true
        default: 'standard'
        type: choice
        options:
          - standard
          - catchup
          - master_only
          - orders_only

concurrency:
  group: ordermentum-cloud-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      ORDERMENTUM_USERNAME: ${{ secrets.ORDERMENTUM_USERNAME }}
      ORDERMENTUM_PASSWORD: ${{ secrets.ORDERMENTUM_PASSWORD }}
      ORDERMENTUM_SUPPLIER_ID: ${{ secrets.ORDERMENTUM_SUPPLIER_ID }}
      ORDERMENTUM_BASE_URL: ${{ secrets.ORDERMENTUM_BASE_URL || 'https://app.ordermentum.com' }}
      ORDERMENTUM_API_BASE_URL: ${{ secrets.ORDERMENTUM_API_BASE_URL || 'https://app.ordermentum.com' }}
      ORDERMENTUM_API_KEY: ${{ secrets.ORDERMENTUM_API_KEY }}
      ORDERMENTUM_MASTER_RESOURCES: products,variants,purchasers,price_groups,invoices,leads
      NODE_OPTIONS: --dns-result-order=ipv4first
      ORDERMENTUM_FETCH_TIMEOUT_MS: '60000'
      SUPABASE_FETCH_TIMEOUT_MS: '60000'
      ORDERMENTUM_FETCH_RETRIES: '3'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci || npm install

      - name: Run Ordermentum cloud sync
        run: node scripts/ordermentum-cloud-sync.mjs --mode=${{ github.event.inputs.mode || 'standard' }}
