name: EcoFlow Ordermentum Cloud Sync

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Sync mode to run manually"
        required: true
        default: "orders_invoices"
        type: choice
        options:
          - orders_invoices
          - stores_only
          - sku_only
          - catchup
          - standard
  schedule:
    # Time-sensitive operational delta only. Store and SKU masters are Owner-triggered.
    - cron: "17 * * * *"

concurrency:
  group: ordermentum-cloud-sync
  cancel-in-progress: false

jobs:
  ordermentum-cloud-sync:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      ORDERMENTUM_USERNAME: ${{ secrets.ORDERMENTUM_USERNAME }}
      ORDERMENTUM_PASSWORD: ${{ secrets.ORDERMENTUM_PASSWORD }}
      ORDERMENTUM_SUPPLIER_ID: ${{ secrets.ORDERMENTUM_SUPPLIER_ID }}
      ORDERMENTUM_BASE_URL: ${{ secrets.ORDERMENTUM_BASE_URL }}
      ORDERMENTUM_API_BASE_URL: ${{ secrets.ORDERMENTUM_API_BASE_URL }}
      ORDERMENTUM_API_KEY: ${{ secrets.ORDERMENTUM_API_KEY }}
      NODE_OPTIONS: "--dns-result-order=ipv4first"
      ORDERMENTUM_FETCH_TIMEOUT_MS: "60000"
      SUPABASE_FETCH_TIMEOUT_MS: "60000"
      ORDERMENTUM_FETCH_RETRIES: "3"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Resolve sync mode
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            echo "SYNC_MODE=orders_invoices" >> "$GITHUB_ENV"
            echo "Scheduled hourly run: orders_invoices only"
          else
            echo "SYNC_MODE=${{ inputs.mode }}" >> "$GITHUB_ENV"
            echo "Manual run: ${{ inputs.mode }}"
          fi

      - name: Validate required secrets
        shell: bash
        run: |
          missing=0
          for name in SUPABASE_URL SUPABASE_SERVICE_ROLE_KEY ORDERMENTUM_USERNAME ORDERMENTUM_PASSWORD ORDERMENTUM_SUPPLIER_ID ORDERMENTUM_BASE_URL ORDERMENTUM_API_BASE_URL; do
            if [ -z "${!name}" ]; then
              echo "Missing required secret/env: $name"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            exit 1
          fi

      - name: Run isolated Ordermentum sync
        run: node scripts/ordermentum-cloud-sync.mjs --mode "$SYNC_MODE"
