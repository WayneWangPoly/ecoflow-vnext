name: EcoFlow Ordermentum Cloud Sync

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Sync mode to run manually"
        required: true
        default: "orders_invoices"
        type: choice
        options:
          - orders_invoices
          - stores_only
          - sku_only
          - catchup
          - standard
      job_id:
        description: "EcoFlow operational sync job ID"
        required: false
        type: string
  schedule:
    # Orders are the live operational feed. Two runs per hour reduce the time a
    # delayed GitHub schedule can leave newly placed customer orders unseen.
    - cron: "7,37 * * * *"

concurrency:
  group: ordermentum-cloud-sync
  cancel-in-progress: false

jobs:
  ordermentum-cloud-sync:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      ORDERMENTUM_USERNAME: ${{ secrets.ORDERMENTUM_USERNAME }}
      ORDERMENTUM_PASSWORD: ${{ secrets.ORDERMENTUM_PASSWORD }}
      ORDERMENTUM_SUPPLIER_ID: ${{ secrets.ORDERMENTUM_SUPPLIER_ID }}
      ORDERMENTUM_BASE_URL: ${{ secrets.ORDERMENTUM_BASE_URL }}
      ORDERMENTUM_API_BASE_URL: ${{ secrets.ORDERMENTUM_API_BASE_URL }}
      ORDERMENTUM_API_KEY: ${{ secrets.ORDERMENTUM_API_KEY }}
      NODE_OPTIONS: "--dns-result-order=ipv4first"
      ORDERMENTUM_FETCH_TIMEOUT_MS: "60000"
      SUPABASE_FETCH_TIMEOUT_MS: "60000"
      ORDERMENTUM_FETCH_RETRIES: "3"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Resolve sync mode
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            echo "SYNC_MODE=orders_invoices" >> "$GITHUB_ENV"
            echo "REQUESTED_JOB_ID=" >> "$GITHUB_ENV"
            echo "Scheduled twice-hourly run: orders_invoices only"
          else
            echo "SYNC_MODE=${{ inputs.mode }}" >> "$GITHUB_ENV"
            echo "REQUESTED_JOB_ID=${{ inputs.job_id }}" >> "$GITHUB_ENV"
            echo "Manual run: ${{ inputs.mode }}"
          fi

      - name: Validate required secrets
        shell: bash
        run: |
          missing=0
          for name in SUPABASE_URL SUPABASE_SERVICE_ROLE_KEY ORDERMENTUM_USERNAME ORDERMENTUM_PASSWORD ORDERMENTUM_SUPPLIER_ID ORDERMENTUM_BASE_URL ORDERMENTUM_API_BASE_URL; do
            if [ -z "${!name}" ]; then
              echo "Missing required secret/env: $name"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then exit 1; fi

      - name: Resolve durable operational job
        shell: bash
        run: |
          job_id="$(node scripts/operational-sync-job.mjs ensure \
            --job-id "$REQUESTED_JOB_ID" \
            --mode "$SYNC_MODE" \
            --reason "${{ github.event_name == 'schedule' && 'Scheduled twice-hourly order and invoice delta' || 'Owner/Admin requested Ordermentum sync' }}" \
            --requested-by "${{ github.actor }}")"
          test -n "$job_id"
          echo "SYNC_JOB_ID=$job_id" >> "$GITHUB_ENV"
          echo "Operational job: $job_id"

      - name: Mark job running
        run: node scripts/operational-sync-job.mjs update --job-id "$SYNC_JOB_ID" --status RUNNING --stage "Connecting to Ordermentum" --stage-number 1 --stage-total 4

      - name: Run isolated Ordermentum sync
        id: run_sync
        shell: bash
        run: |
          set +e
          node scripts/operational-sync-job.mjs update --job-id "$SYNC_JOB_ID" --status RUNNING --stage "Fetching and projecting $SYNC_MODE" --stage-number 2 --stage-total 4
          node scripts/ordermentum-cloud-sync.mjs --mode "$SYNC_MODE" 2>&1 | tee /tmp/ordermentum-sync.log
          sync_exit=${PIPESTATUS[0]}
          echo "SYNC_EXIT_CODE=$sync_exit" >> "$GITHUB_ENV"
          exit 0

      - name: Finalise successful job
        if: env.SYNC_EXIT_CODE == '0'
        run: node scripts/operational-sync-job.mjs update --job-id "$SYNC_JOB_ID" --status SUCCEEDED --stage "Sync complete" --stage-number 4 --stage-total 4

      - name: Finalise failed job
        if: env.SYNC_EXIT_CODE != '0'
        shell: bash
        run: |
          error_message="$(tail -n 35 /tmp/ordermentum-sync.log 2>/dev/null | tr '\n' ' ' | cut -c1-3500)"
          node scripts/operational-sync-job.mjs update \
            --job-id "$SYNC_JOB_ID" \
            --status FAILED \
            --stage "Sync failed" \
            --stage-number 4 \
            --stage-total 4 \
            --error-code ORDERMENTUM_SYNC_FAILED \
            --error-message "$error_message"
          exit "$SYNC_EXIT_CODE"

      - name: Upload sync log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ordermentum-sync-${{ env.SYNC_JOB_ID }}
          path: /tmp/ordermentum-sync.log
          if-no-files-found: warn
          retention-days: 30
