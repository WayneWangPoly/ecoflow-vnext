name: Materialize INTEL-UI-003B Copy

on:
  push:
    branches:
      - agent/frontend/INTEL-UI-003B-actionable-exception-surface

permissions:
  contents: write

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/frontend/INTEL-UI-003B-actionable-exception-surface
          fetch-depth: 0
      - name: Apply exact copy compatibility
        shell: python
        run: |
          from pathlib import Path
          path = Path('src/features/dashboard/DashboardPage.tsx')
          source = path.read_text()
          anchor = '          className="ops-control-panel ops-control-attention"\n          title="Operational queues"\n'
          replacement = '          className="ops-control-panel ops-control-attention"\n          eyebrow="Needs attention"\n          title="Operational queues"\n'
          if source.count(anchor) != 1:
              raise SystemExit('INTEL_UI_003B_COPY_ANCHOR_COUNT_INVALID')
          source = source.replace(anchor, replacement, 1)
          path.write_text(source)
      - name: Remove materializer and commit
        shell: bash
        run: |
          rm .github/workflows/materialize-intel-ui-003b-copy.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/features/dashboard/DashboardPage.tsx .github/workflows/materialize-intel-ui-003b-copy.yml
          git commit -m "Preserve needs-attention dashboard copy"
          git push origin HEAD:agent/frontend/INTEL-UI-003B-actionable-exception-surface
