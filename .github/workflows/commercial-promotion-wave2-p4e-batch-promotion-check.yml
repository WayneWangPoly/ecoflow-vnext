name: Commercial Promotion Wave 2 P4E sequential batch promotion

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/commercial-promotion-wave2-p4e-batch-promotion-check.yml'
      - 'docs/engineering/work-packages/338-COMMERCIAL-WAVE2-P4E-BATCH-PROMOTION.md'
      - 'scripts/commercial-promotion-wave2-p4e-batch-promotion-contract.test.mjs'
      - 'scripts/commercial-promotion-wave2-p4e-batch-promotion-db-contract-test.sql'
      - 'src/data/repositories/commercialWave2P4EBatchPromotion.ts'
      - 'src/features/productIdentity/CommercialWave2P4EBatchPromotionCarrier.tsx'
      - 'src/features/productIdentity/commercialWave2P4EBatchPromotionContract.ts'
      - 'src/features/productIdentity/ProductIdentityCommissioningWithSurvey.tsx'
      - 'supabase/migrations/20260914031500_commercial_wave2_p4e_batch_promotion_engineering.sql'
  push:
    branches:
      - 'agent/product-identity/338-wave2-p4e-batch-promotion-engineering'

permissions:
  contents: read

jobs:
  contract:
    name: Exact-head P4E sequential batch promotion contract
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: postgres
      EXACT_BASE_SHA: d7af3b5ea2436366ba90d444988af55816bfc781
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Bind exact branch head to P4D production base
        shell: bash
        run: |
          set -euo pipefail
          test "$(git merge-base HEAD "$EXACT_BASE_SHA")" = "$EXACT_BASE_SHA"
          echo "exact_head=$(git rev-parse HEAD)"
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Exercise P4E static batch promotion contract
        run: node --test scripts/commercial-promotion-wave2-p4e-batch-promotion-contract.test.mjs
      - name: Exercise PostgreSQL 17 P4E seven-batch and postflight contract
        run: psql -v ON_ERROR_STOP=1 -f scripts/commercial-promotion-wave2-p4e-batch-promotion-db-contract-test.sql
      - name: Keep P4D promotion readiness contract green
        run: node --test scripts/commercial-promotion-wave2-p4d-promotion-readiness-contract.test.mjs
      - name: Keep P4C activation contract green
        run: node --test scripts/commercial-promotion-wave2-p4c-activation-contract.test.mjs
      - name: Keep P4B authority replacement contract green
        run: node --test scripts/commercial-promotion-wave2-p4b-authority-replacement-contract.test.mjs
      - name: Keep P2B promotion contract green
        run: node --test scripts/commercial-promotion-wave2-p2b-canary-promotion-contract.test.mjs
      - name: Typecheck
        run: npm run typecheck
      - name: Production build
        run: npm run build
      - name: Reject whitespace errors
        run: git diff --check "$EXACT_BASE_SHA"...HEAD
