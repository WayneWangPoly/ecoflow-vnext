name: Chat Unleashed acquisition fencing portability

on:
  push:
    branches:
      - agent/platform/unleashed-migration-002d-acquisition-fencing
    paths:
      - scripts/chat-unleashed-acquisition-fencing-portability.mjs

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/platform/unleashed-migration-002d-acquisition-fencing
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node scripts/chat-unleashed-acquisition-fencing-portability.mjs
      - name: Verify exact patch scope
        run: |
          git diff --check
          git diff --name-only
          test "$(git diff --name-only | sort | tr '\n' ' ')" = "scripts/unleashed-readonly-connector-db-fixture.sql supabase/migrations/20260902041500_unleashed_snapshot_acquisition_fencing.sql "
      - name: Commit portability correction
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/unleashed-readonly-connector-db-fixture.sql supabase/migrations/20260902041500_unleashed_snapshot_acquisition_fencing.sql
          git commit -m 'fix: harden Unleashed fencing extension portability'
          git push origin HEAD:agent/platform/unleashed-migration-002d-acquisition-fencing
