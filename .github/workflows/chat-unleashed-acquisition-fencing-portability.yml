name: Chat Unleashed acquisition fencing staging

on:
  push:
    branches:
      - agent/platform/unleashed-migration-002d-acquisition-fencing
    paths:
      - scripts/chat-unleashed-acquisition-fencing-expiry-fixture.mjs
      - .github/workflows/chat-unleashed-acquisition-fencing-portability.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/platform/unleashed-migration-002d-acquisition-fencing
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node scripts/chat-unleashed-acquisition-fencing-expiry-fixture.mjs
      - name: Verify exact patch scope
        run: |
          git diff --check
          git diff --name-only
          test "$(git diff --name-only | tr '\n' ' ')" = "scripts/unleashed-snapshot-acquisition-fencing-db-contract-test.sql "
      - name: Commit expiry fixture correction
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/unleashed-snapshot-acquisition-fencing-db-contract-test.sql
          git commit -m 'test: model elapsed Unleashed lease time correctly'
          git push origin HEAD:agent/platform/unleashed-migration-002d-acquisition-fencing
