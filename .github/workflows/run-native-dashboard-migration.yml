name: Run native Dashboard migration

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/run-native-dashboard-migration.yml'

permissions:
  contents: write
  issues: write

concurrency:
  group: ecoflow-native-dashboard-migration
  cancel-in-progress: false

env:
  TARGET_BRANCH: refactor/native-dashboard-phase2-20260713
  RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out migration branch
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_BRANCH }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify prepared migration inputs
        shell: bash
        run: |
          test -f scripts/apply-native-dashboard-migration.py
          test -f src/features/dashboard/DashboardPage.tsx
          test -f src/features/dashboard/dashboardModel.ts
          test -f src/features/dashboard/DashboardPrimitives.tsx
      - name: Apply prepared native Dashboard migration
        shell: bash
        run: |
          set -o pipefail
          python3 scripts/apply-native-dashboard-migration.py 2>&1 | tee /tmp/native-dashboard-migration.log
      - name: Remove one-time branch helpers
        run: |
          rm -f scripts/apply-native-dashboard-migration.py
          rm -f .github/workflows/apply-native-dashboard-migration.yml
      - name: Commit migration to draft branch
        shell: bash
        run: |
          git config user.name 'EcoFlow Stability Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'Native Dashboard migration already applied.'
            exit 0
          fi
          git commit -m 'Migrate dashboard from DOM enhancer to native workspace'
          git push origin "HEAD:$TARGET_BRANCH"
      - name: Publish migration failure
        if: failure()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "Native Dashboard migration failed before anything was merged to production."
            echo
            echo "Run: $RUN_URL"
            echo
            echo '```text'
            if [ -f /tmp/native-dashboard-migration.log ]; then tail -220 /tmp/native-dashboard-migration.log; else echo 'Migration input verification or checkout failed before a patch log was created.'; fi
            echo '```'
          } > /tmp/native-dashboard-migration-issue.md
          gh issue create \
            --repo "$GITHUB_REPOSITORY" \
            --title "Native Dashboard migration failed · run $GITHUB_RUN_NUMBER" \
            --body-file /tmp/native-dashboard-migration-issue.md
