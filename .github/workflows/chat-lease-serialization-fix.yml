name: Chat #338 lease serialization fix

on:
  push:
    branches:
      - agent/platform/unleashed-migration-003-master-data-bridge
    paths:
      - '.github/workflows/chat-lease-serialization-fix.yml'

permissions:
  contents: write

jobs:
  patch-test-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: postgres
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/platform/unleashed-migration-003-master-data-bridge
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Apply bounded lease serialization patch
        run: python3 scripts/chat-lease-serialization-fix.py
      - name: Remove one-shot Chat tooling before verification
        run: |
          rm scripts/chat-lease-serialization-fix.py
          rm .github/workflows/chat-lease-serialization-fix.yml
      - run: npm ci
      - name: Run static and helper contracts
        run: node --experimental-strip-types --test scripts/unleashed-master-data-bridge-contract.test.mjs
      - name: Run migration, RLS, idempotency and lease contracts
        run: psql -v ON_ERROR_STOP=1 -f scripts/unleashed-master-data-bridge-db-contract-test.sql
      - name: Run independent-review regression contract
        run: psql -v ON_ERROR_STOP=1 -f scripts/unleashed-master-data-bridge-review-fixes-db-contract-test.sql
      - name: Run bounded authority audit
        run: node scripts/audit-unleashed-master-data-bridge.mjs
      - name: Verify diff hygiene
        run: |
          git diff --check
          test ! -e scripts/chat-lease-serialization-fix.py
          test ! -e .github/workflows/chat-lease-serialization-fix.yml
          git status --short
      - name: Commit verified patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "UNLEASHED-MIGRATION-003 serialize copy lease transitions"
          git push origin HEAD:agent/platform/unleashed-migration-003-master-data-bridge
