name: Chat #338 lease serialization fix

on:
  push:
    branches:
      - agent/platform/unleashed-migration-003-master-data-bridge
    paths:
      - '.github/workflows/chat-lease-serialization-fix.yml'

permissions:
  contents: write

jobs:
  patch-test-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: postgres
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/platform/unleashed-migration-003-master-data-bridge
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Prepare exact DB contract patch marker
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('scripts/unleashed-master-data-bridge-db-contract-test.sql')
          text = p.read_text()
          sentinel = "\nselect 'UNLEASHED_MASTER_DATA_BRIDGE_DB_CONTRACT_PASS' as result;"
          if text.count(sentinel) != 1:
              raise SystemExit(f'expected one DB PASS sentinel, found {text.count(sentinel)}')
          p.write_text(text.replace(sentinel, "\nrollback;\n", 1))
          PY
      - name: Apply bounded lease serialization patch
        run: python3 scripts/chat-lease-serialization-fix.py
      - name: Align static contract with database-owned lease boundary
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('scripts/unleashed-master-data-bridge-contract.test.mjs')
          text = p.read_text()
          replacements = {
            "  assert.match(edgeFunction, /COPY_RUN_LEASE_EXPIRED/);":
              "  assert.match(migration, /COPY_RUN_LEASE_EXPIRED/);",
            "  assert.match(edgeFunction, /failureStateLostLease = !updateError && !releasedAsset/);":
              "  assert.match(migration, /ecoflow_fail_unleashed_product_asset_copy/);",
            "  assert.match(edgeFunction, /\\.eq\\('asset_status', 'COPYING'\\)[\\s\\S]{0,120}\\.eq\\('claimed_in_run_id', run\\.id\\)/);":
              "  assert.match(edgeFunction, /rpc\\(\\s*'ecoflow_claim_unleashed_product_asset'/);",
            "  assert.match(edgeFunction, /\\.eq\\('id', run\\.id\\)\\.eq\\('status', 'RUNNING'\\)\\.select\\('\\*'\\)\\.maybeSingle\\(\\)/);":
              "  assert.match(edgeFunction, /rpc\\(\\s*'ecoflow_complete_unleashed_asset_copy_run'/);",
            "  assert.match(edgeFunction, /rpc\\('ecoflow_claim_unleashed_product_asset'/);":
              "  assert.match(edgeFunction, /rpc\\(\\s*'ecoflow_claim_unleashed_product_asset'/);",
            "  assert.match(edgeFunction, /rpc\\('ecoflow_commit_unleashed_product_asset_copy'/);":
              "  assert.match(edgeFunction, /rpc\\(\\s*'ecoflow_commit_unleashed_product_asset_copy'/);",
            "  assert.match(edgeFunction, /rpc\\('ecoflow_fail_unleashed_product_asset_copy'/);":
              "  assert.match(edgeFunction, /rpc\\(\\s*'ecoflow_fail_unleashed_product_asset_copy'/);",
            "  assert.match(edgeFunction, /rpc\\('ecoflow_expire_unleashed_asset_copy_run'/);":
              "  assert.match(edgeFunction, /rpc\\(\\s*'ecoflow_expire_unleashed_asset_copy_run'/);",
            "  assert.match(edgeFunction, /rpc\\('ecoflow_complete_unleashed_asset_copy_run'/);":
              "  assert.match(edgeFunction, /rpc\\(\\s*'ecoflow_complete_unleashed_asset_copy_run'/);",
          }
          for old, new in replacements.items():
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'static assertion replacement expected 1 match, found {count}: {old}')
              text = text.replace(old, new, 1)
          p.write_text(text)
          PY
      - name: Restore DB contract PASS sentinel
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('scripts/unleashed-master-data-bridge-db-contract-test.sql')
          text = p.read_text()
          marker = "\nrollback;\n"
          if text.count(marker) != 1:
              raise SystemExit(f'expected one temporary rollback marker, found {text.count(marker)}')
          p.write_text(text.replace(marker, "\nselect 'UNLEASHED_MASTER_DATA_BRIDGE_DB_CONTRACT_PASS' as result;\n", 1))
          PY
      - name: Remove one-shot Chat tooling before verification
        run: |
          rm scripts/chat-lease-serialization-fix.py
          rm .github/workflows/chat-lease-serialization-fix.yml
      - run: npm ci
      - name: Run static and helper contracts
        run: node --experimental-strip-types --test scripts/unleashed-master-data-bridge-contract.test.mjs
      - name: Run migration, RLS, idempotency and lease contracts
        run: psql -v ON_ERROR_STOP=1 -f scripts/unleashed-master-data-bridge-db-contract-test.sql
      - name: Run independent-review regression contract
        run: psql -v ON_ERROR_STOP=1 -f scripts/unleashed-master-data-bridge-review-fixes-db-contract-test.sql
      - name: Run bounded authority audit
        run: node scripts/audit-unleashed-master-data-bridge.mjs
      - name: Verify diff hygiene
        run: |
          git diff --check
          test ! -e scripts/chat-lease-serialization-fix.py
          test ! -e .github/workflows/chat-lease-serialization-fix.yml
          git status --short
      - name: Commit verified patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "UNLEASHED-MIGRATION-003 serialize copy lease transitions"
          git push origin HEAD:agent/platform/unleashed-migration-003-master-data-bridge
