name: Apply price-group schema compatibility

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: apply-price-group-schema-compat
  cancel-in-progress: true

jobs:
  apply:
    if: github.head_ref == 'agent/fix-commercial-price-group-schema'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fix-commercial-price-group-schema
          fetch-depth: 0
      - name: Make price-group view schema-compatible
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          migration = Path('supabase/migrations/20260711190000_commercial_controls.sql')
          source = migration.read_text()
          old = """), groups as (
            select distinct price_group_id, coalesce(nullif(price_group_name,''),price_group_id) as price_group_name
            from public.v_ecoflow_ordermentum_price_groups_v1
            where nullif(trim(price_group_id),'') is not null
          ), current_matrix as ("""
          new = """), groups as (
            select distinct
              coalesce(
                nullif(trim(to_jsonb(pg)->>'price_group_id'),''),
                nullif(trim(to_jsonb(pg)->>'external_price_group_id'),'')
              ) as price_group_id,
              coalesce(
                nullif(trim(to_jsonb(pg)->>'price_group_name'),''),
                nullif(trim(to_jsonb(pg)->>'name'),''),
                coalesce(
                  nullif(trim(to_jsonb(pg)->>'price_group_id'),''),
                  nullif(trim(to_jsonb(pg)->>'external_price_group_id'),'')
                )
              ) as price_group_name
            from public.v_ecoflow_ordermentum_price_groups_v1 pg
            where coalesce(
              nullif(trim(to_jsonb(pg)->>'price_group_id'),''),
              nullif(trim(to_jsonb(pg)->>'external_price_group_id'),'')
            ) is not null
          ), current_matrix as ("""
          if old in source:
              migration.write_text(source.replace(old, new, 1))
          elif new not in source:
              raise SystemExit('Expected price-group CTE was not found')

          fixture = Path('scripts/commercial-controls-migration-fixture.sql')
          fsource = fixture.read_text()
          fold = """create table if not exists public.fixture_commercial_price_groups(price_group_id text primary key,price_group_name text,description text);
          create or replace view public.v_ecoflow_ordermentum_price_groups_v1 as
          select price_group_id,price_group_name,description,now() last_synced_at from public.fixture_commercial_price_groups;"""
          fnew = """create table if not exists public.fixture_commercial_price_groups(external_price_group_id text primary key,price_group_name text,description text);
          create or replace view public.v_ecoflow_ordermentum_price_groups_v1 as
          select external_price_group_id,price_group_name,description,now() last_synced_at from public.fixture_commercial_price_groups;"""
          if fold in fsource:
              fixture.write_text(fsource.replace(fold, fnew, 1))
          elif fnew not in fsource:
              raise SystemExit('Expected price-group fixture was not found')
          PY
      - name: Commit compatibility correction
        shell: bash
        run: |
          if git diff --quiet; then
            echo 'Compatibility correction already applied.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add supabase/migrations/20260711190000_commercial_controls.sql scripts/commercial-controls-migration-fixture.sql
          git commit -m 'Support production price-group view schema'
          git fetch origin agent/fix-commercial-price-group-schema
          git rebase origin/agent/fix-commercial-price-group-schema
          git push origin HEAD:agent/fix-commercial-price-group-schema
