name: R5-002-R2 recovery metadata patch

on:
  push:
    branches:
      - 'agent/unleashed/r5-002-r2-activation'
    paths:
      - '.github/workflows/r5-002-r2-metadata-patch.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/unleashed/r5-002-r2-activation
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Preserve recovery binding through final run metadata
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          edge_path = Path('supabase/functions/trigger-unleashed-readonly-sync/index.ts')
          edge = edge_path.read_text()
          old = """      ...(requestKey ? { request_key: requestKey } : {}),
                target: target?.audit ?? null,
                records_inserted: recordsInserted,
          """
          new = """      ...(requestKey ? { request_key: requestKey } : {}),
                ...(recoveryOf ? { recovery_of: recoveryOf } : {}),
                target: target?.audit ?? null,
                records_inserted: recordsInserted,
          """
          if old not in edge:
              raise SystemExit('final run metadata marker not found')
          edge = edge.replace(old, new, 1)
          edge_path.write_text(edge)

          test_path = Path('scripts/r5-002b-classification-recovery-contract.test.mjs')
          test = test_path.read_text()
          marker = "  assert.match(edge, /recovery_of: recoveryOf/);\n"
          replacement = "  assert.equal((edge.match(/recovery_of: recoveryOf/g) ?? []).length, 2, 'recovery binding must survive run creation and final metadata rewrite');\n"
          if marker not in test:
              raise SystemExit('R2 recovery metadata assertion marker not found')
          test = test.replace(marker, replacement, 1)
          test_path.write_text(test)
          PY
          git diff --check
      - name: Focused contract
        run: node --experimental-strip-types --test scripts/r5-002b-classification-recovery-contract.test.mjs
      - name: Typecheck
        run: npm run typecheck
      - name: Build
        run: npm run build
      - name: Commit evidence-preservation fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'WayneWangPoly'
          git config user.email 'waynewangpoly@gmail.com'
          git add supabase/functions/trigger-unleashed-readonly-sync/index.ts scripts/r5-002b-classification-recovery-contract.test.mjs
          git commit -m 'fix(r5-002-r2): preserve recovery binding through completion'
          git push origin HEAD:agent/unleashed/r5-002-r2-activation
