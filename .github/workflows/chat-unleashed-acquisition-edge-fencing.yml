name: Chat Unleashed acquisition Edge fencing staging

on:
  push:
    branches:
      - 'agent/platform/unleashed-migration-002d-acquisition-fencing'
    paths:
      - '.github/workflows/chat-unleashed-acquisition-edge-fencing.yml'
      - 'scripts/chat-unleashed-acquisition-edge-apply.mjs'
      - 'scripts/chat-unleashed-acquisition-edge-loop.template.txt'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Check staging applier syntax
        run: node --check scripts/chat-unleashed-acquisition-edge-apply.mjs
      - name: Apply bounded Edge fencing integration
        run: node scripts/chat-unleashed-acquisition-edge-apply.mjs
      - name: Verify Edge syntax
        run: node scripts/check-unleashed-edge-function-syntax.mjs
      - name: Verify fencing static contract
        run: node --experimental-strip-types --test scripts/unleashed-snapshot-acquisition-fencing-contract.test.mjs
      - name: Verify exact permanent patch scope
        shell: bash
        run: |
          changed="$({ git diff --name-only; git ls-files --others --exclude-standard; } | sort -u)"
          expected="$(printf '%s\n' \
            'scripts/unleashed-snapshot-acquisition-fencing-contract.test.mjs' \
            'supabase/functions/trigger-unleashed-readonly-sync/index.ts' | sort -u)"
          printf 'Changed files:\n%s\n' "$changed"
          test "$changed" = "$expected"
      - name: Commit permanent Edge fencing integration
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/unleashed-snapshot-acquisition-fencing-contract.test.mjs supabase/functions/trigger-unleashed-readonly-sync/index.ts
          git commit -m 'fix: route Unleashed snapshot writes through fencing RPCs'
          git push origin HEAD:agent/platform/unleashed-migration-002d-acquisition-fencing
